    .fw-c { animation-delay: -1.7s; }
    @keyframes fw-pop { 0% { transform: scale(0.3); opacity: 0; } 25% { opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
