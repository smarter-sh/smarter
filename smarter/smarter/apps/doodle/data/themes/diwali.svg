<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340">
  <style>
    .dw-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: dw-flicker 0.7s ease-in-out infinite alternate; }
    @keyframes dw-flicker { from { transform: scale(0.9, 0.85); } to { transform: scale(1, 1.1); } }
    .dw-glow { animation: dw-glow 2.4s ease-in-out infinite; }
    @keyframes dw-glow { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.45; } }
    .dw-bulb { animation: dw-twinkle 1.6s ease-in-out infinite; }
    .dw-bulb-b { animation-delay: -0.8s; }
    @keyframes dw-twinkle { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  </style>
