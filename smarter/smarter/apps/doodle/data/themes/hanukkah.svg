<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340">
  <style>
    .hk-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: hk-flicker 0.75s ease-in-out infinite alternate; }
    @keyframes hk-flicker { from { transform: scaleY(0.85); } to { transform: scaleY(1.12); } }
    .hk-spin { transform-box: fill-box; transform-origin: 50% 100%; animation: hk-wobble 1.2s ease-in-out infinite alternate; }
    @keyframes hk-wobble { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  </style>
  <!-- a menorah -->
  <g transform="translate(0 14)">
  <g fill="#ffc145">
    <rect x="384" y="270" width="96" height="4" rx="2" />
    <rect x="430" y="256" width="4" height="40" />
    <rect x="416" y="296" width="32" height="6" rx="3" />
  </g>
  <g fill="#4fc3f7">
    <rect x="386" y="256" width="4" height="14" rx="1" />
    <rect x="397" y="256" width="4" height="14" rx="1" />
    <rect x="408" y="256" width="4" height="14" rx="1" />
    <rect x="419" y="256" width="4" height="14" rx="1" />
    <rect x="441" y="256" width="4" height="14" rx="1" />
    <rect x="452" y="256" width="4" height="14" rx="1" />
    <rect x="463" y="256" width="4" height="14" rx="1" />
    <rect x="474" y="256" width="4" height="14" rx="1" />
    <rect x="430" y="240" width="4" height="16" rx="1" />
  </g>
  <g fill="#ffc145">
