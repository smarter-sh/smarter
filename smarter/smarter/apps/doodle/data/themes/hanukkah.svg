    <path class="hk-flame" d="M399 246 q4 5 0 9 q-4 -4 0 -9 z" />
    <path class="hk-flame" d="M410 246 q4 5 0 9 q-4 -4 0 -9 z" />
    <path class="hk-flame" d="M421 246 q4 5 0 9 q-4 -4 0 -9 z" />
    <path class="hk-flame" d="M443 246 q4 5 0 9 q-4 -4 0 -9 z" />
    <path class="hk-flame" d="M454 246 q4 5 0 9 q-4 -4 0 -9 z" />
    <path class="hk-flame" d="M465 246 q4 5 0 9 q-4 -4 0 -9 z" />
