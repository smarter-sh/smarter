  <g transform="translate(480 74) scale(0.9)"><g class="fw-burst fw-b" fill="none" stroke="#e53935" stroke-width="2.6" stroke-linecap="round"><path d="M8 0H20M5.7 5.7L14.1 14.1M0 8V20M-5.7 5.7L-14.1 14.1M-8 0H-20M-5.7 -5.7L-14.1 -14.1M0 -8V-20M5.7 -5.7L14.1 -14.1" /></g></g>
