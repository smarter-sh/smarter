<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340">
  <style>
    .fw-burst { transform-box: fill-box; transform-origin: center; animation: fw-pop 2.6s ease-out infinite; }
    .fw-b { animation-delay: -0.9s; }
    .fw-c { animation-delay: -1.7s; }
    @keyframes fw-pop { 0% { transform: scale(0.3); opacity: 0; } 25% { opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
  </style>
