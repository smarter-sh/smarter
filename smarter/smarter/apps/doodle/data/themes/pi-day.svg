<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340">
  <style>
    .pi-bob { animation: pi-bob 5s ease-in-out infinite; }
    .pi-bob-b { animation-delay: -2.5s; }
    @keyframes pi-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  </style>
  <text x="260" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#ffffff" fill-opacity="0.75" letter-spacing="2">3.14159 26535 89793 23846…</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700">
    <text class="pi-bob" x="60" y="70" font-size="34" fill="#ffc145">π</text>
    <text class="pi-bob pi-bob-b" x="440" y="74" font-size="30" fill="#4fc3f7">π</text>
    <text class="pi-bob pi-bob-b" x="150" y="92" font-size="20" fill="#ff6b9a">π</text>
    <text class="pi-bob" x="352" y="94" font-size="22" fill="#00c2a8">π</text>
  </g>
  <!-- a pie -->
  <path d="M398 288 C398 306 482 306 482 288 Z" fill="#c97c3d" />
  <ellipse cx="440" cy="288" rx="42" ry="11" fill="#e8a25c" />
  <ellipse cx="440" cy="287" rx="34" ry="7" fill="#b03a2e" />
  <path d="M414 284 L466 290 M418 291 L462 283 M440 280 V294" stroke="#e8a25c" stroke-width="3" stroke-linecap="round" />
</svg>
