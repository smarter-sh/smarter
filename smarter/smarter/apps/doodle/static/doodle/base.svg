<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img">
  <title>A Smarter LLMClient's chat window, with the plugin, guardrail, vectorstore and secret that it uses, and its manifest.</title>
  <style>
    .dd-flow { stroke-dasharray: 3 7; animation: dd-flow 1.8s linear infinite; }
    @keyframes dd-flow { to { stroke-dashoffset: -20; } }
    .dd-float { animation: dd-float 6s ease-in-out infinite; }
    .dd-float-b { animation-delay: -1.5s; }
    .dd-float-c { animation-delay: -3s; }
    .dd-float-d { animation-delay: -4.5s; }
    @keyframes dd-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .dd-typing circle { animation: dd-blink 1.4s ease-in-out infinite; }
    .dd-typing circle:nth-child(2) { animation-delay: 0.2s; }
    .dd-typing circle:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dd-blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    .dd-twinkle { animation: dd-twinkle 5s ease-in-out infinite; }
    .dd-twinkle-b { animation-delay: -2.5s; }
    @keyframes dd-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g id="doodle-base">
    <!-- a few stars -->
    <g fill="#ffffff">
      <circle class="dd-twinkle" cx="150" cy="36" r="1.6" />
      <circle class="dd-twinkle dd-twinkle-b" cx="196" cy="68" r="1.2" />
      <circle class="dd-twinkle" cx="330" cy="58" r="1.4" />
      <circle class="dd-twinkle dd-twinkle-b" cx="372" cy="24" r="1.8" />
      <circle class="dd-twinkle dd-twinkle-b" cx="262" cy="30" r="1.1" />
      <circle class="dd-twinkle" cx="30" cy="180" r="1.3" />
      <circle class="dd-twinkle dd-twinkle-b" cx="494" cy="176" r="1.3" />
    </g>

    <!-- the ground -->
    <ellipse cx="260" cy="310" rx="200" ry="10" fill="#ffffff" opacity="0.05" />

    <!-- what the LLMClient uses: data flows along the connectors -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
      <path class="dd-flow" d="M185 150 C152 150 146 122 118 122" />
      <path class="dd-flow" d="M185 200 C152 200 146 230 115 230" />
      <path class="dd-flow" d="M335 150 C368 150 374 122 402 122" />
      <path class="dd-flow" d="M335 200 C368 200 374 230 405 230" />
      <path class="dd-flow" d="M260 232 L260 252" />
    </g>

    <!-- the LLMClient: a chat window -->
    <g>
      <rect x="185" y="105" width="150" height="127" rx="14" fill="#ffffff" />
      <path d="M185 119 a14 14 0 0 1 14 -14 h122 a14 14 0 0 1 14 14 v8 h-150 z" fill="#f1effe" />
      <circle cx="199" cy="116" r="3" fill="#ff5733" />
      <circle cx="209" cy="116" r="3" fill="#ffc145" />
      <circle cx="219" cy="116" r="3" fill="#00c2a8" />
      <!-- the user's message -->
      <rect x="243" y="137" width="80" height="22" rx="11" fill="#ff5733" />
      <rect x="254" y="146" width="56" height="4" rx="2" fill="#ffffff" opacity="0.9" />
      <!-- the LLM's answer -->
      <rect x="197" y="166" width="98" height="30" rx="11" fill="#ecebfe" />
      <rect x="207" y="174" width="72" height="4" rx="2" fill="#6c5ce7" opacity="0.6" />
      <rect x="207" y="184" width="48" height="4" rx="2" fill="#6c5ce7" opacity="0.4" />
      <!-- and the next one, on its way -->
      <rect x="197" y="203" width="42" height="18" rx="9" fill="#ecebfe" />
      <g class="dd-typing" fill="#6c5ce7">
        <circle cx="208" cy="212" r="2.6" />
        <circle cx="218" cy="212" r="2.6" />
        <circle cx="228" cy="212" r="2.6" />
      </g>
    </g>

    <!-- a plugin -->
    <g class="dd-float">
      <circle cx="92" cy="122" r="26" fill="#00c2a8" />
      <path d="M82 112 h6.5 a4 4 0 1 0 7 0 h6.5 v6.5 a4 4 0 1 1 0 7 v6.5 h-20 z" fill="#ffffff" />
    </g>

    <!-- a guardrail -->
    <g class="dd-float dd-float-b">
      <circle cx="89" cy="230" r="26" fill="#ffc145" />
      <path d="M89 216 l12 5 v8 c0 8 -5 13 -12 16 c-7 -3 -12 -8 -12 -16 v-8 z" fill="#ffffff" />
      <path d="M84 230 l4 4 l7 -8" fill="none" stroke="#ffc145" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- a vectorstore -->
    <g class="dd-float dd-float-c">
      <circle cx="428" cy="122" r="26" fill="#4fc3f7" />
      <path d="M417 113 v18 a11 4 0 0 0 22 0 v-18 z" fill="#ffffff" />
      <ellipse cx="428" cy="113" rx="11" ry="4" fill="#e3f6fd" />
      <path d="M417 122 a11 4 0 0 0 22 0" fill="none" stroke="#4fc3f7" stroke-width="1.6" />
    </g>

    <!-- a secret -->
    <g class="dd-float dd-float-d">
      <circle cx="431" cy="230" r="26" fill="#ff6b9a" />
      <circle cx="424" cy="230" r="6" fill="none" stroke="#ffffff" stroke-width="3" />
      <path d="M430 230 h12 m-4 0 v5 m-4 -5 v4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- its manifest -->
    <g>
      <rect x="190" y="252" width="140" height="26" rx="13" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3" />
      <text x="260" y="269" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ffffff"><tspan fill="#ffc145">kind</tspan>: LLMClient</text>
    </g>
  </g>
  <g id="doodle-props" />
</svg>
