---
# Find, create and update Linear issues, projects and comments.
# Documentation: https://linear.app/docs/mcp
#
# Prerequisite: a Smarter Secret named linear_mcp_access_token, containing an OAuth access
# token issued by Linear's MCP authorization server. Smarter does not yet perform the
# OAuth flow itself, and does not refresh the token.
apiVersion: smarter.sh/v1
kind: MCPClient
metadata:
  name: linear
  description: Find, create and update Linear issues, projects and comments.
  version: 1.0.0
  tags:
    - project-management
    - issues
  annotations:
    - smarter.sh/mcpclient/documentation: https://linear.app/docs/mcp
spec:
  config:
    transport: http
    endpointUrl: https://mcp.linear.app/mcp
    authType: oauth2
    credentials: linear_mcp_access_token
    allowedTools: []            # all of the server's tools
    includeInstructions: true
    timeout: 30
    cacheTtl: 300
    isActive: true
    priority: 100
