---
# Search, read and write Notion pages and databases, with Notion's hosted MCP server.
# Documentation: https://developers.notion.com/docs/mcp
#
# Prerequisite: a Smarter Secret named notion_mcp_access_token, containing an OAuth access
# token issued by Notion's MCP authorization server. Smarter does not yet perform the
# OAuth flow itself, and does not refresh the token.
apiVersion: smarter.sh/v1
kind: MCPClient
metadata:
  name: notion
  description: Search, read and write Notion pages and databases, with Notion's hosted MCP server.
  version: 1.0.0
  tags:
    - productivity
    - knowledge-base
  annotations:
    - smarter.sh/mcpclient/documentation: https://developers.notion.com/docs/mcp
spec:
  config:
    transport: http
    endpointUrl: https://mcp.notion.com/mcp
    authType: oauth2
    credentials: notion_mcp_access_token
    allowedTools: []            # all of the server's tools
    includeInstructions: true
    timeout: 30
    cacheTtl: 300
    isActive: true
    priority: 100
