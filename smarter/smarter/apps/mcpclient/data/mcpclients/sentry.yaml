---
# Investigate Sentry issues, errors and performance data.
# Documentation: https://docs.sentry.io/product/sentry-mcp/
#
# Prerequisite: a Smarter Secret named sentry_mcp_access_token, containing an OAuth access
# token issued by Sentry's MCP authorization server. Smarter does not yet perform the
# OAuth flow itself, and does not refresh the token.
apiVersion: smarter.sh/v1
kind: MCPClient
metadata:
  name: sentry
  description: Investigate Sentry issues, errors and performance data.
  version: 1.0.0
  tags:
    - monitoring
    - errors
    - developer-tools
  annotations:
    - smarter.sh/mcpclient/documentation: https://docs.sentry.io/product/sentry-mcp/
spec:
  config:
    transport: http
    endpointUrl: https://mcp.sentry.dev/mcp
    authType: oauth2
    credentials: sentry_mcp_access_token
    allowedTools: []            # all of the server's tools
    includeInstructions: true
    timeout: 30
    cacheTtl: 300
    isActive: true
    priority: 100
