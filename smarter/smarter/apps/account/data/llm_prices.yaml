# The prices that a new platform starts with, in USD per million tokens, as each provider publishes
# them for its standard tier, without batch, cached-input or long-context rates.
#
# manage.py initialize_llm_prices, which initialize_platform runs, creates an LLMPrices row of each
# charge type (completion, plugin, tool) for each model below, at its blended price: three input
# tokens to one output token, (3 * input + output) / 4. It never changes a price that already
# exists, so an operator's prices, entered in the Django admin, are kept.
#
# Only the built-in providers' default models are listed, each with the page that published its
# price and the day it was checked. A model that isn't listed costs nothing until an operator adds
# its price. Not listed, because their providers' own pricing pages didn't confirm a price on
# 2026-11-23: googleai's gemini-flash-latest (the page doesn't say which model the alias points
# to), mistral's mistral-medium-latest, and cohere's command-a-03-2025.
prices:
  - provider: openai
    model: gpt-6-luna
    input: 0.10
    output: 0.50
    source: https://developers.openai.com/api/docs/pricing
    checked: 2026-11-23

  - provider: anthropic
    model: claude-sonnet-4-6
    input: 3.00
    output: 15.00
    source: https://platform.claude.com/docs/en/about-claude/pricing
    checked: 2026-11-23

  - provider: togetherai
    model: openai/gpt-oss-120b
    input: 0.15
    output: 0.60
    source: https://www.together.ai/pricing
    checked: 2026-11-23

  - provider: metaai
    model: muse-spark-1.3-contributor
    input: 0.10
    output: 0.20
    source: https://dev.meta.ai/models/muse-spark
    checked: 2026-11-23
