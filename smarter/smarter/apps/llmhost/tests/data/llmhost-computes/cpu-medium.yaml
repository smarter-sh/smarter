---
# A general-purpose node for 3B to 8B quantized models on CPU.
# The price is the AWS us-east-1 on-demand price of one node.
apiVersion: smarter.sh/v1
kind: LLMHostCompute
metadata:
  name: cpu_medium
  description: 8 vCPUs and 32 GiB, for quantized models up to about 8B on CPU.
  version: 1.0.0
  tags:
  - cpu
  annotations:
  - smarter.sh/llmhostcompute/builtin: 'true'
spec:
  node:
    instanceType: m7i.2xlarge
    cpu: 8
    memoryGb: 32
    diskSizeGb: 50
  nodeGroup:
    maxNodes: 4
  cost:
    perHour: 0.4032
    currency: USD
