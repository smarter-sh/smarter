---
# Meta Llama 3.1 8B Instruct, one of the most downloaded models on Hugging Face.
# Gated: accept the license at the model card, and store a Hugging Face token in the
# Smarter Secret huggingface_token. The 16K context fits the KV cache in 24 GB.
# Revision 'main' tracks the repository: pin a commit SHA for reproducible deployments.
# Resources are what one replica's pod requests of a node of its compute.
apiVersion: smarter.sh/v1
kind: LLMHost
metadata:
  name: llama_3_1_8b_instruct
  description: Meta Llama 3.1 8B Instruct, served by vLLM on one NVIDIA A10G, with tool calling, at a public HTTPS
    endpoint.
  version: 1.0.0
  tags:
  - llama
  - meta
  - vllm
  - chat
  - tool-calling
  annotations:
  - smarter.sh/llmhost/builtin: 'true'
  - smarter.sh/llmhost/model-card: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
spec:
  model:
    source: huggingface
    repository: meta-llama/Llama-3.1-8B-Instruct
    revision: main
    servedName: llama-3.1-8b-instruct
    task: text-generation
    tokenSecret: huggingface_token
    license: llama3.1
    architecture: llama
    parameterCount: 8030261248
    contextWindow: 131072
    quantization: bf16
    capabilities:
      functionCalling: true
  engine:
    name: vllm
    contextLength: 16384
    gpuMemoryUtilization: 0.9
    args:
    - --enable-auto-tool-choice
    - --tool-call-parser
    - llama3_json
  compute: gpu_a10g_1x
  resources:
    gpuCount: 1
    vramRequiredGb: 21
    cpu: '4'
    memory: 24Gi
  network:
    ingress: true
