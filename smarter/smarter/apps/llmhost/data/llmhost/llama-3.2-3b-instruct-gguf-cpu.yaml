---
# Meta Llama 3.2 3B Instruct, quantized to 4 bits (Q4_K_M, about 2 GB), on CPU: no GPU node required.
# A community GGUF conversion, from a public, ungated repository.
# Revision 'main' tracks the repository: pin a commit SHA for reproducible deployments.
apiVersion: smarter.sh/v1
kind: LLMHost
metadata:
  name: llama_3_2_3b_instruct_gguf_cpu
  description: Meta Llama 3.2 3B Instruct, 4-bit GGUF, served by llama.cpp on CPU.
  version: 1.0.0
  tags:
  - llama
  - meta
  - llama-cpp
  - gguf
  - cpu
  - chat
  annotations:
  - smarter.sh/llmhost/builtin: 'true'
  - smarter.sh/llmhost/model-card: https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF
spec:
  model:
    source: huggingface
    repository: bartowski/Llama-3.2-3B-Instruct-GGUF
    revision: main
    file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
    servedName: llama-3.2-3b-instruct
    license: llama3.2
    architecture: llama
    parameterCount: 3212749824
    contextWindow: 131072
    quantization: gguf
  engine:
    name: llama_cpp
    contextLength: 8192
    maxConcurrentRequests: 4
  compute: cpu_medium
  resources:
    gpuCount: 0
    cpu: '7'
    memory: 8Gi
    shmSize: 1Gi
  storage:
    size: 10Gi
