---
# Alibaba Qwen2.5 Coder 7B Instruct: code generation, completion and repair.
# Revision 'main' tracks the repository: pin a commit SHA for reproducible deployments.
# Resources are what one replica's pod requests of a node of its compute.
apiVersion: smarter.sh/v1
kind: LLMHost
metadata:
  name: qwen2_5_coder_7b_instruct
  description: Alibaba Qwen2.5 Coder 7B Instruct, a code model, served by vLLM on one NVIDIA A10G.
  version: 1.0.0
  tags:
  - qwen
  - alibaba
  - vllm
  - code
  annotations:
  - smarter.sh/llmhost/builtin: 'true'
  - smarter.sh/llmhost/model-card: https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct
spec:
  model:
    source: huggingface
    repository: Qwen/Qwen2.5-Coder-7B-Instruct
    revision: main
    servedName: qwen2.5-coder-7b-instruct
    license: apache-2.0
    architecture: qwen2
    parameterCount: 7615616512
    contextWindow: 32768
    quantization: bf16
  engine:
    name: vllm
    contextLength: 16384
  compute: gpu_a10g_1x
  resources:
    gpuCount: 1
    vramRequiredGb: 20
    cpu: '4'
    memory: 23Gi
