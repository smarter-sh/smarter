---
# Alibaba Qwen3 0.6B, among the most downloaded models on Hugging Face: e.g. for tests,
# drafts and classification.
# Revision 'main' tracks the repository: pin a commit SHA for reproducible deployments.
# Resources are what one replica's pod requests of a node of its compute.
apiVersion: smarter.sh/v1
kind: LLMHost
metadata:
  name: qwen3_0_6b
  description: Alibaba Qwen3 0.6B, a tiny reasoning model, served by vLLM on one NVIDIA L4.
  version: 1.0.0
  tags:
  - qwen
  - alibaba
  - vllm
  - chat
  - reasoning
  - small
  annotations:
  - smarter.sh/llmhost/builtin: 'true'
  - smarter.sh/llmhost/model-card: https://huggingface.co/Qwen/Qwen3-0.6B
spec:
  model:
    source: huggingface
    repository: Qwen/Qwen3-0.6B
    revision: main
    servedName: qwen3-0.6b
    license: apache-2.0
    architecture: qwen3
    parameterCount: 751632384
    contextWindow: 32768
    quantization: bf16
    capabilities:
      reasoning: true
  engine:
    name: vllm
    contextLength: 32768
    gpuMemoryUtilization: 0.8
    args:
    - --reasoning-parser
    - qwen3
  compute: gpu_l4_1x
  resources:
    gpuCount: 1
    vramRequiredGb: 2
    cpu: '4'
    memory: 8Gi
