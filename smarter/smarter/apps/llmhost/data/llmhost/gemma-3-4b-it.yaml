---
# Google Gemma 3 4B Instruct: accepts images as well as text.
# Gated: accept the Gemma terms of use, and store a Hugging Face token in the Secret huggingface_token.
# Revision 'main' tracks the repository: pin a commit SHA for reproducible deployments.
# Resources are what one replica's pod requests of a node of its compute.
apiVersion: smarter.sh/v1
kind: LLMHost
metadata:
  name: gemma_3_4b_it
  description: Google Gemma 3 4B Instruct, a vision-language model, served by vLLM on one NVIDIA L4.
  version: 1.0.0
  tags:
  - gemma
  - google
  - vllm
  - chat
  - vision
  annotations:
  - smarter.sh/llmhost/builtin: 'true'
  - smarter.sh/llmhost/model-card: https://huggingface.co/google/gemma-3-4b-it
spec:
  model:
    source: huggingface
    repository: google/gemma-3-4b-it
    revision: main
    servedName: gemma-3-4b-it
    tokenSecret: huggingface_token
    license: gemma
    architecture: gemma3
    parameterCount: 4300079472
    contextWindow: 131072
    quantization: bf16
    capabilities:
      vision: true
  engine:
    name: vllm
    contextLength: 16384
  compute: gpu_l4_1x
  resources:
    gpuCount: 1
    vramRequiredGb: 11
    cpu: '4'
    memory: 15Gi
