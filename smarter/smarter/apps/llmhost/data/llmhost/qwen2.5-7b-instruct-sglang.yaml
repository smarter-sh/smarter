---
# The same model as qwen2.5-7b-instruct.yaml, served by SGLang instead of vLLM: the model
# and the engine are independent. SGLang's RadixAttention suits workloads with shared prompt prefixes.
# Revision 'main' tracks the repository: pin a commit SHA for reproducible deployments.
# Resources are what one replica's pod requests of a node of its compute.
apiVersion: smarter.sh/v1
kind: LLMHost
metadata:
  name: qwen2_5_7b_instruct_sglang
  description: Alibaba Qwen2.5 7B Instruct, served by SGLang on one NVIDIA A10G.
  version: 1.0.0
  tags:
  - qwen
  - alibaba
  - sglang
  - chat
  annotations:
  - smarter.sh/llmhost/builtin: 'true'
  - smarter.sh/llmhost/model-card: https://huggingface.co/Qwen/Qwen2.5-7B-Instruct
spec:
  model:
    source: huggingface
    repository: Qwen/Qwen2.5-7B-Instruct
    revision: main
    servedName: qwen2.5-7b-instruct
    license: apache-2.0
    architecture: qwen2
    parameterCount: 7615616512
    contextWindow: 32768
    quantization: bf16
  engine:
    name: sglang
    contextLength: 16384
    gpuMemoryUtilization: 0.85
  compute: gpu_a10g_1x
  resources:
    gpuCount: 1
    vramRequiredGb: 20
    cpu: '4'
    memory: 23Gi
