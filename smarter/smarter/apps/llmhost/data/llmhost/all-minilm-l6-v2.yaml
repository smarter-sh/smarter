---
# sentence-transformers all-MiniLM-L6-v2: one of the most downloaded models on Hugging Face.
# 384-dimensional embeddings, for semantic search and clustering. Small enough for CPU.
# Revision 'main' tracks the repository: pin a commit SHA for reproducible deployments.
apiVersion: smarter.sh/v1
kind: LLMHost
metadata:
  name: all_minilm_l6_v2
  description: sentence-transformers all-MiniLM-L6-v2, a small embedding model, served by Text Embeddings Inference
    on CPU.
  version: 1.0.0
  tags:
  - embedding
  - sentence-transformers
  - tei
  - cpu
  annotations:
  - smarter.sh/llmhost/builtin: 'true'
  - smarter.sh/llmhost/model-card: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2
spec:
  model:
    source: huggingface
    repository: sentence-transformers/all-MiniLM-L6-v2
    revision: main
    task: embedding
    license: apache-2.0
    architecture: bert
    parameterCount: 22713216
    contextWindow: 256
    embeddingDimensions: 384
    quantization: fp32
    capabilities:
      streaming: false
  engine:
    name: tei
    maxConcurrentRequests: 512
  compute: cpu_small
  resources:
    gpuCount: 0
    cpu: '3'
    memory: 2Gi
    shmSize: 1Gi
  storage:
    size: 2Gi
