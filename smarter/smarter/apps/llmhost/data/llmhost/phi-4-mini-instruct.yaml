---
# Microsoft Phi-4-mini-instruct: a 3.8B model with strong reasoning for its size. MIT licensed.
# Revision 'main' tracks the repository: pin a commit SHA for reproducible deployments.
# Resources are what one replica's pod requests of a node of its compute.
apiVersion: smarter.sh/v1
kind: LLMHost
metadata:
  name: phi_4_mini_instruct
  description: Microsoft Phi-4-mini-instruct, served by vLLM on one NVIDIA L4.
  version: 1.0.0
  tags:
  - phi
  - microsoft
  - vllm
  - chat
  - small
  annotations:
  - smarter.sh/llmhost/builtin: 'true'
  - smarter.sh/llmhost/model-card: https://huggingface.co/microsoft/Phi-4-mini-instruct
spec:
  model:
    source: huggingface
    repository: microsoft/Phi-4-mini-instruct
    revision: main
    servedName: phi-4-mini-instruct
    license: mit
    architecture: phi3
    parameterCount: 3836021760
    contextWindow: 131072
    quantization: bf16
  engine:
    name: vllm
    contextLength: 16384
  compute: gpu_l4_1x
  resources:
    gpuCount: 1
    vramRequiredGb: 10
    cpu: '4'
    memory: 14Gi
