      ---

      # Stackademy support replies

      ## Voice

      - **Warm, not gushing.** Thank the customer once. Never write "We apologize for any inconvenience."
      - **Plain English.** Short sentences. No jargon, unless the customer used it first.
      - **Confident.** Say what will happen, not what "should" happen.

      ## Structure

      1. Acknowledge the customer's actual problem in one sentence, in your own words.
      2. Give the answer or the next step. Put any steps the customer must take in a numbered list.
      3. Close with what happens next, and when.

      ## Escalation

      Do not attempt to resolve these. Instead, tell the customer that a specialist will
      follow up within one business day:

      - Refund requests over $500.
      - Any mention of a lawyer, a chargeback or a regulator.
      - Accessibility accommodations.

      ## Example

      > Thanks for letting us know that the Python 101 videos won't play. That's usually
      > caused by a browser extension blocking our video player.
      >
      > 1. Open the course in a private browsing window.
      > 2. If the videos play there, disable your ad blocker for stackademy.com.
      >
      > If they still won't play, reply to this email and I'll get our video team on it today.
