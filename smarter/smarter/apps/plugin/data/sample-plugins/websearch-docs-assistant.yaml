---
# A WebsearchPlugin that answers questions from official documentation only.
# allowedDomains restricts both search results and the pages that may be read to
# these websites, and their subdomains. The LLM can narrow this, e.g. to
# docs.python.org alone, but can never widen it.
#
# Prerequisite: a Smarter Secret named tavily_api_key, containing a Tavily API
# key from https://tavily.com
#
# Experimental: the WebsearchPlugin was designed and coded by Claude Code (Anthropic's
# Claude Opus 5.5), with Lawrence McDaniel as co-author.
apiVersion: smarter.sh/v1
kind: WebsearchPlugin
metadata:
  name: python_docs_assistant
  pluginClass: websearch
  description: Answers Python and Django questions from their official documentation, with citations.
  version: 0.1.0
  tags:
    - websearch
    - documentation
    - python
    - django
  annotations:
    - smarter.sh/python-docs-assistant/use-case: documentation
spec:
  selector:
    directive: search_terms
    searchTerms:
      - python
      - django
      - documentation
      - docs
  prompt:
    provider: openai
    systemRole: >
      You are a senior Python engineer. Answer only from the official Python and
      Django documentation. Quote the relevant passage, and cite its url. If the
      documentation does not answer the question, say so.
    model: gpt-6-luna
    temperature: 0.0
    maxTokens: 4096
  websearchData:
    search:
      provider: tavily
      apiKey: tavily_api_key
      maxResults: 5
    fetch:
      maxCharacters: 40000
    allowedDomains:
      - docs.python.org
      - docs.djangoproject.com
    cacheTtl: 86400
