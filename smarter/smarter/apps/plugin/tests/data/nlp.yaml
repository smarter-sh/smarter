---
# Test cases for smarter.apps.plugin.nlp.
clean_prompt:
  - prompt: WhoIsLawrenceMcDaniel
    expected: Who Is Lawrence McDaniel
  - prompt: "Hello, world!"
    expected: Hello world
  - prompt: tell me about gobstoppers
    expected: tell me about gobstoppers
lower_case_splitter:
  - value: The Quick Brown Fox
    expected: [the, quick, brown, fox]
  - value: ""
    expected: []
normalized_words:
  - value: Who is Lawrence P. McDaniel?
    expected: [who, is, lawrence, p, mcdaniel]
  - value: "Gobstopper's -- price!"
    expected: [gobstoppers, price]
  - value: "?!"
    expected: []
word_matches:
  - prompt_word: gobstopper
    term_word: gobstopper
    expected: true
  - prompt_word: gobstoppers
    term_word: gobstopper
    expected: true
  - prompt_word: gobstopper
    term_word: gobstoppers
    expected: true
  - prompt_word: boxes
    term_word: box
    expected: true
  - prompt_word: concatenate
    term_word: cat
    expected: false
  - prompt_word: start
    term_word: art
    expected: false
simple_search:
  - prompt: Find all weather plugins for New York
    search_term: weather plugins
    expected: true
  - prompt: Find all weather plugins for New York
    search_term: Weather
    expected: true
  - prompt: plugins for weather in New York
    search_term: weather plugins
    expected: true
  - prompt: Find all weather plugins for New York
    search_term: plugin
    expected: true
  - prompt: Tell me about Gobstoppers.
    search_term: Gobstopper
    expected: true
  - prompt: Find all weather plugins for New York
    search_term: California
    expected: false
  - prompt: How do I concatenate strings?
    search_term: cat
    expected: false
  - prompt: How do I start?
    search_term: art
    expected: false
  - prompt: Find all weather plugins for New York
    search_term: ""
    expected: false
allowed_distance:
  - search_term: API
    expected: 0
  - search_term: dev
    expected: 0
  - search_term: Wonka
    expected: 1
  - search_term: Wonka Bar
    expected: 1
  - search_term: lawrence
    expected: 1
  - search_term: Gobstopper
    expected: 2
  - search_term: Lawrence McDaniel
    expected: 2
within_levenshtein_distance:
  - prompt: I want a Gobbstopper
    search_term: Gobstopper
    expected: true
  - prompt: I want a gobstoper
    search_term: Gobstopper
    expected: true
  - prompt: Who is Lawrance McDaniel?
    search_term: Lawrence McDaniel
    expected: true
  - prompt: I love a Wonka Bat
    search_term: Wonka Bar
    expected: true
  - prompt: I want a Gobbstopper
    search_term: Gobstopper
    threshold: 0
    expected: false
  - prompt: any ideas?
    search_term: API
    expected: false
  - prompt: a wonky car
    search_term: Wonka Bar
    expected: false
  - prompt: a doorstopper
    search_term: Gobstopper
    expected: false
  - prompt: larry
    search_term: lawrence
    expected: false
  - prompt: dev
    search_term: developer
    expected: false
  - prompt: Who is McDaniel?
    search_term: Lawrence McDaniel
    expected: false
does_refer_to:
  - prompt: WhoIsLawrenceMcDaniel
    search_term: Lawrence McDaniel
    fuzzy: false
    expected: true
  - prompt: Tell me about the Everlasting Gobstopper.
    search_term: Gobstopper
    fuzzy: false
    expected: true
  - prompt: Tell me about Gobstoppers
    search_term: Gobstopper
    fuzzy: false
    expected: true
  - prompt: WhoIsLawranceMcDaniel
    search_term: Lawrence McDaniel
    fuzzy: false
    expected: false
  - prompt: WhoIsLawranceMcDaniel
    search_term: Lawrence McDaniel
    fuzzy: true
    expected: true
  - prompt: WhoIsLawrenceMcDaniel
    search_term: John Doe
    fuzzy: true
    expected: false
  - prompt: any ideas?
    search_term: API
    fuzzy: true
    expected: false
# thesaurus_match() returns the words of the prompt that matched, or null. These
# cases use the real WordNet corpus, and are skipped if it is not installed.
thesaurus_match:
  - prompt: I want to buy an automobile
    search_term: car
    expected: automobile
  - prompt: Show me a picture of a cat
    search_term: image
    expected: picture
  - prompt: A monochrome photograph of Paris
    search_term: black and white
    expected: monochrome
  - prompt: I need an aid
    search_term: help
    expected: aid
  - prompt: Show me the bill
    search_term: invoice
    expected: bill
  - prompt: Can I see the bills from my last trip?
    search_term: travel invoice
    expected: null
  - prompt: Can I see the bills from my last travel?
    search_term: travel invoice
    expected: travel bill
  - prompt: Tell me about everlasting gobstoppers
    search_term: gobstopper
    expected: gobstopper
  # verb senses are excluded: the verb image means see.
  - prompt: Let me see the code
    search_term: image
    expected: null
  # in the reverse direction, only nouns count: weather is a synonym of the verb endure.
  - prompt: Can you endure the cold?
    search_term: weather
    expected: null
  - prompt: What is the weather like?
    search_term: car
    expected: null
  # words shorter than THESAURUS_MIN_WORD_LENGTH must match exactly.
  - prompt: artificial intelligence aid
    search_term: ai help
    expected: null
  - prompt: ""
    search_term: car
    expected: null
  - prompt: buy an automobile
    search_term: "?"
    expected: null
