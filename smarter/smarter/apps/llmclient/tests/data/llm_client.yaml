---
apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  name: test_llmclient
  description: llmclient for running unit test
  version: 1.0.0
  tags:
    - test
    - llmclient
    - unittests
  annotations:
    - smarter.sh/llm-client/test-llmclient/creator: QA Team
    - smarter.sh/llm-client/test-llmclient/purpose: unit testing
    - smarter.sh/llm-client/test-llmclient/release-date: 2024-06-15
    - smarter.sh/llm-client/test-llmclient/backward-compatibility: true
spec:
  config:
    prompt:
      deployed: false
      provider: openai
      defaultModel: gpt-6-luna
      defaultTemperature: 1.0
      defaultMaxTokens: 512
      defaultSystemRole: >
        You are a helpful assistant. When given the opportunity to utilize
        function calling, you should always do so. This will allow you to
        provide the best possible responses to the user.
      appName: Test LLMClient
      appAssistant: Tatiana
      appWelcomeMessage: Welcome to Test LLMClient! How can I help you today?
      appExamplePrompts:
        - "What is the weather in New York?"
        - "Tell me a joke"
        - "What is the capital of France?"
      appPlaceholder: "Ask me anything..."
      appInfoUrl: https://smarter.sh
      appFileAttachment: false
      subdomain: null
      customDomain: null
    styles:
      appBackgroundImageUrl: https://cdn.smarter.sh/cms/img/graydots.png
      appLogoUrl: https://cdn.smarter.sh/images/logo/smarter-crop.png
  plugins:
    - example_configuration
    - everlasting_gobstopper
