apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  description: "An llmclient that scientific calculator functions."
  name: calculator
  version: 0.1.0
  tags:
    - calculator
    - capstone-project
  annotations:
    - smarter.sh/tests/focus-level: high
    - smarter.sh/tests/owner: Lawrence McDaniel
spec:
  apiKey: null
  config:
    prompt:
      appAssistant: Cleo The Calculator
      appExamplePrompts:
      - What is (3 + 5) * 2?
      - Calculate 7.5 / (2.5 - 0.5) + 4.
      - What is sin(pi / 2) + cos(0)?
      - Evaluate 2 * (3 + 4) - sqrt(49) + tan(pi / 4).
      appFileAttachment: false
      appInfoUrl: https://smarter.sh
      appName: Calculator Bot
      appPlaceholder: Give me something to calculate...
      appWelcomeMessage: Welcome to the Calculator Bot! How can I help you today?
      customDomain: null
      defaultMaxTokens: 4096
      defaultModel: gpt-6-luna
      defaultSystemRole: You are a helpful calculator. You perform all of your
        operations using the ext_calculator_calculator tool that is provided to you
        on all prompts. You always use the ext_calculator_calculator tool to perform
        calculations. You NEVER perform calculations yourself. If you are
        unable to provide the necessary ext_calculator_calculator parameters, then ask
        the user for clarification.

        Your replies are displayed in a chat window that renders markdown. Show the
        expression in inline code and the result in bold, such as `(3 + 5) * 2` = **16**.
        For a calculation with several steps, show each step in a numbered list. Write math
        as plain text and inline code, rather than LaTeX. Keep replies short.
      defaultTemperature: 1.0
      deployed: false
      provider: openai
      subdomain: null
    styles:
      appLogoUrl: https://cdn.smarter.sh/images/logo/smarter-crop.png
      appBackgroundImageUrl: https://cdn.smarter.sh/images/llmclients/calculator/background.svg
      appBackgroundImageSize: auto
      assistantAvatarUrl: https://cdn.smarter.sh/images/llmclients/calculator/assistant.png
      googleFont: Space Mono
      fontSize: 15px
      borderRadius: 6px
      conversationHeader:
        backgroundColor: '#1f2a1f'
        color: '#b8f5a0'
        infoColor: '#7fbf6a'
      messageList:
        backgroundColor: rgba(232, 237, 220, 0.9)
        color: '#1f2a1f'
      incomingMessage:
        backgroundColor: '#d7e4c0'
        color: '#1f2a1f'
        borderColor: '#9fb98a'
      outgoingMessage:
        backgroundColor: '#f28c28'
        color: '#1f1300'
      messageInput:
        editorBackgroundColor: '#d7e4c0'
        placeholderColor: '#5f7a52'
      buttons:
        color: '#f28c28'
      typingIndicator:
        color: '#3f6b35'
  extensions:
    - calculator
  guardrails:
    - prompt_injection_keyword_input
