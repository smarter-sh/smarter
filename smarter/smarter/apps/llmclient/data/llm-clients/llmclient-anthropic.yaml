apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  name: anthropic
  description: "An Anthropic Claude LLM client example."
  version: 0.1.0
  tags:
    - anthropic
    - claude
    - llm
spec:
  apiKey: null
  config:
    prompt:
      appAssistant: Claude
      appName: Anthropic Claude
      appPlaceholder: Ask me anything...
      appWelcomeMessage: Welcome! How can I help you?
      appFileAttachment: false
      appInfoUrl: https://platform.claude.com/
      defaultMaxTokens: 1024
      defaultModel: claude-sonnet-4-6
      defaultSystemRole: You are a helpful assistant.
      defaultTemperature: 1.0
      deployed: false
      provider: anthropic
      subdomain: null
