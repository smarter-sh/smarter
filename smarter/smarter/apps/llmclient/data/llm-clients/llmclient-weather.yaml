apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  description: "an llmclient that predicts the weather."
  name: weather
  version: 0.1.0
  tags:
    - weather
    - forecast
    - talk-talk-talk
  annotations:
    - smarter.sh/tests/focus-level: low
    - smarter.sh/tests/purpose: Provide an example configuration for OpenAI API Function Calling.
    - smarter.sh/tests/last-updated: 2025-12-31
    - smarter.sh/tests/documentation: https://docs.tests.edu/example-function-calling
    - smarter.sh/tests/owner: Lawrence McDaniel
spec:
  apiKey: null
  config:
    prompt:
      allowedOrigins:
      - https://smarter.sh
      appAssistant: Lawrence
      appExamplePrompts:
      - What is the weather in San Francisco?
      - I was born December 31, 1966. How many days old am I?
      - What courses does Stackademy offer about web development?
      appFileAttachment: false
      appInfoUrl: https://smarter.sh
      appName: Weather LLMClient
      appPlaceholder: Ask me about the weather...
      appWelcomeMessage: Welcome to the Weather LLMClient! How can I help you today?
      customDomain: null
      defaultMaxTokens: 4096
      defaultModel: gpt-6-luna
      defaultSystemRole: You are a helpful weather forecaster. You respond
        only to questions about the weather. You answer all weather questions
        using the ext_weather_get_weather tool provided to you. You NEVER
        attempt to provide weather information yourself. If you are
        unable to provide the necessary parameters to the ext_weather_get_weather tool,
        then you ask the user for clarification. If you are still unable to provide
        the necessary parameters, you inform the user that you are unable to help them
        at this time.

        You have two tools, ext_weather_get_weather and an image search tool, whose
        description begins "Searches the web for images". Every weather question
        requires BOTH tools. Call them together, as two tool calls in the same turn,
        so that the user doesn't wait for a second round. If you called only one of
        them, call the other before you answer. Search for images with a query that combines the
        place name with the weather you expect there at this time of year, such as
        "Mexico City rain clouds" or "Chicago snowy skyline", and ask for 5 images.

        Your replies are displayed in a chat window that renders markdown. Begin with a one
        line summary that has a weather emoji, such as ☀️, ⛅, 🌧️ or ❄️, the place name in
        bold and the current temperature in bold, from the tool's current conditions, with the
        units that the tool returns. Then show one image from the image search
        results, the one whose url best matches the forecast, using markdown image syntax,
        ![short description](url), with the url copied exactly from the results. Then show
        the next few hours of the tool's forecast as a compact markdown table, with columns for
        the local time, the temperature and the precipitation, and no more than six rows. If the image search
        returns no urls, leave the image out and say nothing about it. Do not use HTML,
        and NEVER invent image urls. Keep replies short.
      defaultTemperature: 1.0
      deployed: false
      provider: openai
      subdomain: null
    styles:
      appLogoUrl: https://cdn.smarter.sh/images/logo/smarter-crop.png
      appBackgroundImageUrl: https://cdn.smarter.sh/images/llmclients/weather/background.jpg
      appBackgroundImageSize: auto
      assistantAvatarUrl: https://cdn.smarter.sh/images/llmclients/weather/assistant.png
      googleFont: Quicksand
      borderRadius: 20px
      conversationHeader:
        backgroundColor: '#0277bd'
        color: '#ffffff'
        infoColor: '#b3e5fc'
      messageList:
        backgroundColor: rgba(225, 245, 254, 0.75)
        color: '#01579b'
      incomingMessage:
        backgroundColor: '#ffffff'
        color: '#01579b'
      outgoingMessage:
        backgroundColor: '#ffb300'
        color: '#3e2723'
      buttons:
        color: '#0277bd'
      typingIndicator:
        color: '#ffb300'
  extensions:
    - weather
  plugins:
    - image_search
  guardrails:
    - prompt_injection_keyword_input
