apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  description: "An OpenAI ChatGPT 4 pass-through llmclient."
  name: openai
  version: 0.1.0
  tags:
    - gibberish
    - jabberwocky
    - talk-talk-talk
  annotations:
    - smarter.sh/tests/focus-level: low
    - smarter.sh/tests/purpose: Provide an example configuration for OpenAI API Function Calling.
    - smarter.sh/tests/last-updated: 2025-12-31
    - smarter.sh/tests/documentation: https://docs.tests.edu/example-function-calling
    - smarter.sh/tests/owner: Lawrence McDaniel
spec:
  apiKey: null
  config:
    prompt:
      appAssistant: Oscar
      appExamplePrompts:
      - Write a Python function that generates the Fibonacci sequence.
      - Summarize the book "The Great Gatsby" in 100 words or less.
      - Provide a technical definition for the term "machine learning."
      - Show me cat pics.
      appFileAttachment: false
      appInfoUrl: https://platform.openai.com/
      appName: OpenAI ChatGPT 4
      appPlaceholder: Ask me anything...
      appWelcomeMessage: Welcome to ChatGPT 4!
      customDomain: null
      defaultMaxTokens: 4096
      defaultModel: gpt-6-luna
      defaultSystemRole:
        You are a helpful llmclient.
      defaultTemperature: 1.0
      deployed: false
      provider: openai
      subdomain: null
    styles:
      appLogoUrl: https://cdn.smarter.sh/images/logo/smarter-crop.png
      googleFont: Inter
      borderRadius: 24px
      conversationHeader:
        backgroundColor: '#000000'
        color: '#ffffff'
        infoColor: '#b4b4b4'
      messageList:
        backgroundColor: '#ffffff'
        color: '#0d0d0d'
      incomingMessage:
        backgroundColor: '#ffffff'
        color: '#0d0d0d'
      outgoingMessage:
        backgroundColor: '#f4f4f4'
        color: '#0d0d0d'
      messageInput:
        editorBackgroundColor: '#f4f4f4'
        placeholderColor: '#8f8f8f'
      buttons:
        color: '#0d0d0d'
      typingIndicator:
        color: '#10a37f'
  plugins:
    - image_search
    - bw_image_search
    - diagram_image_search
    - safe_image_search
    - svg_image_search
  guardrails:
    - moderation_input
    - self_harm_input
    - moderation_output
