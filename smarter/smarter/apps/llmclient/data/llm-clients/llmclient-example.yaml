apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  description: "An example llmclient with tool calling and Smarter Plugins."
  name: example
  version: 0.1.0
  tags:
    - gibberish
    - jabberwocky
    - talk-talk-talk
  annotations:
    - smarter.sh/tests/focus-level: low
    - smarter.sh/tests/purpose: Provide an example configuration for OpenAI API Function Calling.
    - smarter.sh/tests/last-updated: 2025-12-31
    - smarter.sh/tests/documentation: https://docs.tests.edu/example-function-calling
    - smarter.sh/tests/owner: Lawrence McDaniel
spec:
  apiKey: null
  config:
    prompt:
      appAssistant: Lawrence
      appExamplePrompts:
      - What is the weather in San Francisco?
      - What is an Everlasting Gobstopper?
      - example function calling configuration
      appFileAttachment: false
      appInfoUrl: https://smarter.sh
      appName: Smarter Demo
      appPlaceholder: Ask me anything...
      appWelcomeMessage: Welcome to the Smarter demo!
      customDomain: null
      defaultMaxTokens: 4096
      defaultModel: gpt-6-luna
      defaultSystemRole: You are a helpful llmclient. When given the opportunity to utilize
        function calling, you should always do so. This will allow you to provide the
        best possible responses to the user. If you are unable to provide a response,
        you should prompt the user for more information. If you are still unable to
        provide a response, you should inform the user that you are unable to help them
        at this time.

        Your replies are displayed in a chat window that renders GitHub flavored markdown.
        Use **bold** for key facts, bulleted lists for several items, and a small table when
        you present structured data from a function. When a function returns
        an image url, show the image with markdown image syntax, ![description](https://...).
      defaultTemperature: 1.0
      deployed: false
      provider: openai
      subdomain: null
    styles:
      appLogoUrl: https://cdn.smarter.sh/images/logo/smarter-crop.png
      appBackgroundImageUrl: https://cdn.smarter.sh/cms/img/techdots.png
      assistantAvatarUrl: https://cdn.smarter.sh/images/llmclients/example/assistant.png
      googleFont: Montserrat
      borderRadius: 14px
      conversationHeader:
        backgroundColor: '#f15a29'
        color: '#ffffff'
        infoColor: '#ffe3d1'
      messageList:
        backgroundColor: rgba(255, 255, 255, 0.7)
        color: '#3a2a1a'
      incomingMessage:
        backgroundColor: '#ffffff'
        color: '#3a2a1a'
        borderColor: '#f7c9b5'
      outgoingMessage:
        backgroundColor: '#fdb913'
        color: '#3a2a00'
      buttons:
        color: '#f15a29'
      typingIndicator:
        color: '#f15a29'
  extensions:
    - weather
  plugins:
    - everlasting_gobstopper
    - example_configuration
    - image_search
  guardrails:
    - prompt_injection_keyword_input
    - moderation_input
    - moderation_output
