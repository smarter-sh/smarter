apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  description: "A Meta AI Muse Spark pass-through llmclient."
  name: metaai
  version: 0.1.0
  tags:
    - gibberish
    - jabberwocky
    - talk-talk-talk
  annotations:
    - smarter.sh/tests/focus-level: low
    - smarter.sh/tests/purpose: Provide an example configuration for OpenAI API Function Calling.
    - smarter.sh/tests/last-updated: 2025-12-31
    - smarter.sh/tests/documentation: https://docs.tests.edu/example-function-calling
    - smarter.sh/tests/owner: Lawrence McDaniel
spec:
  apiKey: null
  config:
    prompt:
      appAssistant: Muse
      appExamplePrompts:
      - Write a Python function that generates the Fibonacci sequence.
      - Summarize the book "The Great Gatsby" in 100 words or less.
      - Provide a technical definition for the term "machine learning."
      appFileAttachment: false
      appInfoUrl: https://developers.meta.com/ai/
      appName: Meta AI Muse Spark
      appPlaceholder: Ask me anything...
      appWelcomeMessage: Welcome to Muse Spark!
      customDomain: null
      defaultMaxTokens: 4096
      defaultModel: muse-spark-1.3-contributor
      defaultSystemRole:
        You are a helpful llmclient.
      defaultTemperature: 0.5
      deployed: false
      provider: metaai
      subdomain: null
    styles:
      appLogoUrl: https://cdn.smarter.sh/images/logo/smarter-crop.png
      googleFont: Inter
      borderRadius: 18px
      conversationHeader:
        backgroundColor: '#0866ff'
        color: '#ffffff'
        infoColor: '#cfe0ff'
      messageList:
        backgroundColor: '#ffffff'
        color: '#050505'
      incomingMessage:
        backgroundColor: '#f0f2f5'
        color: '#050505'
      outgoingMessage:
        backgroundColor: '#0866ff'
        color: '#ffffff'
      buttons:
        color: '#0866ff'
      typingIndicator:
        color: '#0866ff'
  extensions:
    - weather
  plugins: []
  guardrails:
    - moderation_input
    - self_harm_input
    - moderation_output
