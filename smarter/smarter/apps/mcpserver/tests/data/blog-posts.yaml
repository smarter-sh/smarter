  title:
    rendered: "Keeping Secrets Out of the Logs &#8211; a Review"
  content:
    rendered: |
      <p class="wp-block-paragraph">Every log message is reviewed for <strong>leaked credentials</strong> before a release.</p>
      <h2 class="wp-block-heading">How the review works</h2>
      <p>The scanner reads the init job's log, and flags passwords, tokens and api keys.</p>
      <div class="wp-block-syntaxhighlighter-code"><pre class="brush: bash">
      scan-log init-job.log
      </pre></div>
      <ul><li>Secrets are <code>SecretStr</code> values.</li><li>Connection strings are masked.</li></ul>
      <figure class="wp-block-table"><table><thead><tr><th>Leak</th><th>Fix</th></tr></thead>
      <tbody><tr><td>token prefix</td><td>removed</td></tr></tbody></table></figure>
      <blockquote><p>A log is public until proven otherwise.</p></blockquote>
      <figure class="wp-block-image"><img src="https://blog.example.com/x.png" alt=""/><figcaption>The scanner's report.</figcaption></figure>
      <ol><li>Scan.</li><li>Fix.</li></ol>
      <hr/>
