    content: |
      # Test CLI

      The test command-line interface applies manifests.
  - path: cmd/apply.go
    content: |
      package cmd

      // applyCmd applies a manifest.
      var applyCmd = &cobra.Command{
      	Use:   "apply -f <manifest.yaml>",
      	Short: "Apply a manifest",
      }

      func readManifest(path string) (string, error) {
      	return path, nil
      }
  - path: cmd/delete.go
    content: |
      package cmd

      // deleteCmd deletes a resource.
      var deleteCmd = &cobra.Command{
      	Use: "delete <kind> <name>",
      }
