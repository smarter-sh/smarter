# A self-hosted Qdrant vector database, which Smarter runs on its Kubernetes cluster:
# a knowledge base of a company's product documentation, e.g. PDFs and Markdown files.
# Deploy it, then add documents:
#
#   smarter apply -f qdrant-self-hosted.yaml
#   smarter deploy vectorstore example_knowledge_base
#   curl -H "Authorization: Token $SMARTER_API_KEY" -F files=@manual.pdf \
#     https://platform.smarter.sh/api/v1/vectorstores/<hashed id>/documents/
apiVersion: smarter.sh/v1
kind: Vectorstore
metadata:
  name: example_knowledge_base
  description: A self-hosted Qdrant vector database of product documentation, for retrieval-augmented generation.
  version: 1.0.0
  tags:
    - example
    - rag
    - qdrant
    - self-hosted
  annotations:
    - smarter.sh/vectorstore/builtin: "true"
spec:
  backend: qdrant
  hosting: self_hosted
  isActive: true
  index:
    dimension: 1536            # text-embedding-3-small's
    metric: cosine
    deletionProtection: false
  embeddings:
    provider: openai
    model: text-embedding-3-small
    chunkSize: 1000            # characters
    chunkOverlap: 200
    batchSize: 64
  selfHosted:
    storage: 10Gi
    cpu: 500m
    memory: 1Gi
  maintenance:
    snapshots: true
    snapshotIntervalHours: 24
    snapshotRetention: 7
