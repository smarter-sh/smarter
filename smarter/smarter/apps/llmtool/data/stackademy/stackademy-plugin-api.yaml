apiVersion: smarter.sh/v1
kind: ApiPlugin
metadata:
  description: Online course catalogue inquiries for fictional Stackademy University that only offers computer science degrees programs.
  name: stackademy_api
  pluginClass: api
  version: 0.1.0
  tags:
    - api
    - courses
    - stackademy
  annotations:
    - smarter.sh/stackademy-api/display-name: Stackademy API
    - smarter.sh/stackademy-api/icon: https://example.com/stackademy-icon.png
    - smarter.sh/stackademy-api/supports-authentication: true
    - smarter.sh/stackademy-api/supports-rate-limiting: true
    - smarter.sh/stackademy-api/documentation-url: https://docs.stackademy.com/api
    - smarter.sh/stackademy-api/contact-email: no-reply@example.com
spec:
  apiData:
    body:
    - default: test
      description: The test to run.
      name: test
      required: true
      type: string
    - default: test2
      description: The second test to run.
      name: test2
      required: false
      type: string
    endpoint: /api/v1/demos/stackademy/course-catalogue/
    method: GET
    headers:
    - name: X-Debug-Request
      value: true
    - name: X-API-Key
      value: your_api_key_here
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Request-ID
      value: 12345
    limit: 10
    # like the SqlPlugin's: without defaults, which the LLM would send as filters, and with
    # an enum of the keywords that the course descriptions contain.
    parameters:
    - description: the maximum cost that a student is willing to pay for a course.
      enum: null
      name: max_cost
      required: false
      type: number
    - description: areas of specialization for courses in the catalogue.
      enum:
      - AI
      - mobile
      - web
      - database
      - network
      - neural networks
      name: description
      required: false
      type: string
    testValues:
    - name: description
      value: AI
    - name: max_cost
      value: 1000
    urlParams: null
  connection: smarter_test_api
  prompt:
    maxTokens: 2048
    model: gpt-6-luna
    provider: openai
    systemRole: >
      You are a helpful student advisor at the fictional Stackademy University that only offers computer science
      degrees programs. Whenever possible you should defer to the tool calls provided for additional information
      about the courses offered by Stackademy University. Questions unrelated to the courses or Stackademy University
      should be answered with "I am sorry, but I can only provide information about the courses offered by Stackademy University."
    temperature: 1.0
  selector:
    directive: always
    searchTerms: null
