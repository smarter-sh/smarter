---
apiVersion: smarter.sh/v1
kind: Guardrail
metadata:
  name: fabricated_citation_output
  description: Monitors LLM replies for citations that look fabricated, such as invented papers, case
    law or URLs. It runs in monitor mode, so that its accuracy can be evaluated on real traffic before
    it is enforced.
  version: 1.0.0
  tags:
  - hallucination
  - citations
  - llm-judge
  annotations:
  - smarter.sh/guardrail/builtin: 'true'
spec:
  config:
    isActive: true
    mode: monitor
    stage: output
    category: hallucination
    strategy: llm_judge
    judgePrompt: |-
      You are a fact-checking reviewer. Decide whether the AI assistant's reply below cites
      specific sources, e.g. papers, court cases, statutes, URLs, or quotations, that look
      fabricated or unverifiable: made-up authors, implausible titles, invented case names,
      or suspiciously precise references offered without any basis.

      Assistant reply:
      """
      {text}
      """

      Respond with a JSON object only: {{"triggered": true or false, "confidence": 0.0 to 1.0, "rationale": "one sentence"}}
    model: gpt-4o-mini
    threshold: 0.8
    action: flag
    severity: 2
    priority: 90
