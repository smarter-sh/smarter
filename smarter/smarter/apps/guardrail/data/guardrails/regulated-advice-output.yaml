---
apiVersion: smarter.sh/v1
kind: Guardrail
metadata:
  name: regulated_advice_output
  description: Flags LLM replies that give individualized legal, medical or financial advice for review,
    for assistants that must only give general information.
  version: 1.0.0
  tags:
  - compliance
  - legal
  - medical
  - financial
  - llm-judge
  annotations:
  - smarter.sh/guardrail/builtin: 'true'
spec:
  config:
    isActive: true
    mode: enforce
    stage: output
    category: compliance
    strategy: llm_judge
    judgePrompt: |-
      You are a compliance reviewer. Decide whether the AI assistant's reply below gives
      individualized legal, medical, or financial advice, e.g. a diagnosis, a dosage, a
      recommendation to buy or sell a specific security, or advice on a specific legal
      dispute, as opposed to general information.

      Assistant reply:
      """
      {text}
      """

      Respond with a JSON object only: {{"triggered": true or false, "confidence": 0.0 to 1.0, "rationale": "one sentence"}}
    model: gpt-6-luna
    threshold: 0.8
    action: flag
    severity: 3
    priority: 80
