---
apiVersion: smarter.sh/v1
kind: Guardrail
metadata:
  name: secrets_leak_output
  description: Redacts credentials from the LLM's reply, in case the assistant reveals secrets from its
    tools, its context or its system prompt.
  version: 1.0.0
  tags:
  - secrets
  - security
  - data-leakage
  annotations:
  - smarter.sh/guardrail/builtin: 'true'
spec:
  config:
    isActive: true
    mode: enforce
    stage: output
    category: secrets
    strategy: detector
    detectors:
    - aws_access_key
    - api_key
    - private_key
    - jwt
    - password_assignment
    action: redact
    replacement: '[REDACTED SECRET]'
    severity: 5
    priority: 10
