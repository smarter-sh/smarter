---
apiVersion: smarter.sh/v1
kind: Guardrail
metadata:
  name: secrets_redaction_input
  description: Redacts credentials that users paste into their messages, such as AWS access keys, API
    keys, private keys, JSON web tokens and password assignments, before the message is sent to the LLM.
  version: 1.0.0
  tags:
  - secrets
  - security
  annotations:
  - smarter.sh/guardrail/builtin: 'true'
spec:
  config:
    isActive: true
    mode: enforce
    stage: input
    category: secrets
    strategy: detector
    detectors:
    - aws_access_key
    - api_key
    - private_key
    - jwt
    - password_assignment
    action: redact
    replacement: '[REDACTED SECRET]'
    severity: 5
    priority: 10
