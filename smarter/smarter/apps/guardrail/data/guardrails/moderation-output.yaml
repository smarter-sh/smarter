---
apiVersion: smarter.sh/v1
kind: Guardrail
metadata:
  name: moderation_output
  description: Replaces LLM replies that are hateful, harassing, violent or sexual, as classified by OpenAI's
    omni-moderation model, with a safe message.
  version: 1.0.0
  tags:
  - toxicity
  - moderation
  - trust-and-safety
  annotations:
  - smarter.sh/guardrail/builtin: 'true'
spec:
  config:
    isActive: true
    mode: enforce
    stage: output
    category: toxicity
    strategy: moderation
    categories:
    - harassment
    - harassment/threatening
    - hate
    - hate/threatening
    - sexual
    - violence
    - violence/graphic
    threshold: 0.7
    action: block
    message: Sorry, I can't provide that response.
    severity: 4
    priority: 30
