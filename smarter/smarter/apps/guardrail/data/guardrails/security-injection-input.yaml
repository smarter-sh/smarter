apiVersion: smarter.sh/v1
kind: Guardrail
metadata:
  annotations:
  - color: red
  - size: medium
  description: Blocks prompts that contain classic SQL/command-injection markers
    (tautologies, stacked statements, UNION-based extraction, shell metacharacters
    chained onto a command). Primarily aimed at deployments where the model's
    output — or a function/tool call it emits — can end up interpolated into a
    downstream query or shell command; catching the injection attempt at the
    guardrail layer is cheaper and safer than relying on the tool layer to
    sanitize it correctly every time.
  name: security_injection_input
  tags:
  - security
  - injection
  - tooling
  version: 1.0.0
spec:
  config:
    action: block
    category: custom
    confidence_threshold: 1.0
    config:
      flags:
      - IGNORECASE
    fallback_message: Your request contains patterns associated with SQL or
      command injection and could not be processed.
    guardrail_type: input
    is_active: true
    is_blocking: true
    match_strategy: regex
    pattern: ('\s*OR\s*'?1'?\s*=\s*'?1)|(;\s*DROP\s+TABLE)|(UNION\s+SELECT)|(--\s*$)|(\$\(.*\))|(;\s*rm\s+-rf\s+/)
    priority: 15
    severity: 5
