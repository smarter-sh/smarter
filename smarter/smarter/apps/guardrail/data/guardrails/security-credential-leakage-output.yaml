apiVersion: smarter.sh/v1
kind: Guardrail
metadata:
  annotations:
  - color: red
  - size: medium
  description: Blocks any completion that contains what looks like a live
    credential — an AWS access key, a generic API key/secret assignment, or
    a PEM private-key header. Covers the case where the model has been
    fine-tuned/prompted on internal docs or a tool result and echoes a real
    secret back to the end user. This is treated as blocking rather than
    redact-and-continue because a partially-redacted secret in a cached
    response is still a leak; the whole completion is discarded.
  name: security_credential_leakage_output
  tags:
  - security
  - pii
  - secrets
  version: 1.0.0
spec:
  config:
    action: block
    category: pii
    confidence_threshold: 1.0
    config:
      flags:
      - IGNORECASE
    fallback_message: The response was withheld because it appeared to contain
      credential material. Please rephrase your request.
    guardrail_type: output
    is_active: true
    is_blocking: true
    match_strategy: regex
    pattern: (AKIA[0-9A-Z]{16})|(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)|((?:api[_-]?key|secret[_-]?key|access[_-]?token)\s*[:=]\s*['"]?[A-Za-z0-9_\-]{16,})
    priority: 15
    severity: 5
