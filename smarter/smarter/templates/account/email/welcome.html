{% load i18n smarter_email %}{% get_current_language as LANGUAGE_CODE %}{% comment %}
  The welcome email, which account contacts are sent when their account is created. See
  smarter.apps.account.models.welcome_email_context. Mail clients strip <style> blocks, scripts and
  external stylesheets, and few play video, so the layout is tables with inline styles, the images are
  PNGs, and the video is a poster image that links to it.
  Context: branding, environment_platform_domain, first_name, send_password_email, unsubscribe_url.
{% endcomment %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <title>{{ branding.smarter_product_name }}</title>
</head>

<body style="margin:0; padding:0; background-color:#D5D9E2; font-family:Arial,Helvetica,sans-serif; color:#3F4254">
  <table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="100%"
    style="border-collapse:collapse; background-color:#D5D9E2">
    <tr>
      <td align="center" style="padding:40px 10px">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600"
          style="border-collapse:separate; width:100%; max-width:600px; background-color:#FFFFFF; border-radius:24px; overflow:hidden">

          <!-- logo -->
          <tr>
            <td align="center" style="padding:36px 40px 28px 40px">
              <a href="{{ branding.smarter_project_website_url }}" rel="noopener" target="_blank">
                <img alt="{{ branding.smarter_product_name }}" height="60"
                  src="{% smarter_logo_url %}" style="height:60px; border:0" />
              </a>
            </td>
          </tr>

          <!-- hero -->
          <tr>
            <td align="center" style="background-color:#1E1E2D; padding:40px 40px 36px 40px; text-align:center">
              <p style="margin:0 0 14px 0; color:#FFFFFF; font-size:30px; font-weight:700; line-height:1.25">
                {% blocktranslate with product_name=branding.smarter_product_name trimmed %}Welcome to {{ product_name }}!{% endblocktranslate %}</p>
              <p style="margin:0; color:#B5B5C3; font-size:15px; line-height:1.6">{{ branding.smarter_product_description }}</p>
            </td>
          </tr>

          <!-- illustration -->
          <tr>
            <td align="center" style="padding:32px 40px 8px 40px">
              <img alt="" width="520" src="{{ branding.smarter_project_cdn_url }}/images/smarter-welcome-email.png"
                style="width:100%; max-width:520px; height:auto; border:0" />
            </td>
          </tr>

          <!-- greeting -->
          <tr>
            <td style="padding:24px 50px 8px 50px; font-size:15px; line-height:1.6; color:#3F4254">
              <p style="margin:0 0 16px 0; color:#181C32; font-size:18px; font-weight:600">{% if first_name %}{% blocktranslate trimmed %}Howdy {{ first_name }},{% endblocktranslate %}{% else %}{% translate "Howdy," %}{% endif %}</p>
              <p style="margin:0 0 16px 0">
                {% blocktranslate with primary_contact=branding.primary_contact product_name=branding.smarter_product_name trimmed %}
                  I'm {{ primary_contact }}, the technical point of contact for {{ product_name }},
                  and I just created a new account for you. To get started, sign in with the
                  button below. Your username is this email address.
                {% endblocktranslate %}
                {% if send_password_email %}
                  {% translate "You should receive your password in a separate text-only email." %}
                {% endif %}
                {% translate "You can use the 'Forgot Password' link on the sign-in page to change your password at any time." %}
                {% blocktranslate with support_email=branding.support_email trimmed %}
                  If you have any questions, email me at
                  <a href="mailto:{{ support_email }}" style="font-weight:600">{{ support_email }}</a>.
                {% endblocktranslate %}</p>
            </td>
          </tr>

          <!-- call to action -->
          <tr>
            <td align="center" style="padding:8px 50px 12px 50px">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background-color:#F1416C; border-radius:8px">
                    <a href="{{ branding.login_url }}" target="_blank" rel="noopener"
                      style="display:inline-block; padding:14px 30px; color:#FFFFFF; font-size:16px; font-weight:700; text-decoration:none; font-family:Arial,Helvetica,sans-serif">{% translate "Sign In" %}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- what's included -->
          <tr>
            <td style="padding:24px 40px 8px 40px">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                style="background-color:#F5F8FA; border-radius:16px">
                <tr>
                  <td style="padding:22px 24px 8px 24px; font-size:14px; line-height:1.6; color:#3F4254">
                    <p style="margin:0 0 8px 0; color:#181C32; font-size:18px; font-weight:600">{% translate "What's included:" %}</p>
                    <ul style="margin:0 0 12px 0; padding-left:20px">
                      <li style="margin-bottom:8px">
                        {% blocktranslate with product_name=branding.smarter_product_name login_url=branding.login_url trimmed %}
                          <strong>An account on {{ product_name }}
                          <a href="{{ login_url }}" target="_blank" rel="noopener">platform</a></strong>
                          for the duration of this course. Every prompt is a real, billable request to an LLM
                          provider, so please experiment freely, but don't run automated load against it.
                        {% endblocktranslate %}
                      </li>
                      <li style="margin-bottom:8px">
                        {% blocktranslate trimmed %}
                          <strong>Your own AI resources.</strong> You can create, change and delete your own
                          LLMClients, plugins, connections and secrets, and you are encouraged to experiment
                          with them while you are attending this course.
                        {% endblocktranslate %}
                      </li>
                      <li style="margin-bottom:8px">
                        {% blocktranslate trimmed %}
                          <strong>Thousands of LLMs from nine providers:</strong> Anthropic, Cohere, Fireworks AI,
                          Google AI (Gemini), Hugging Face, Meta AI (Llama), Mistral, OpenAI and Together AI, all
                          through a single interface, so that you can compare models hands-on.
                        {% endblocktranslate %}
                      </li>
                      <li style="margin-bottom:8px">
                        {% blocktranslate trimmed %}
                          <strong><a href="https://docs.smarter.sh/smarter-resources/smarter-llmtool.html" rel="noopener" target="_blank">Plugins</a>
                          for LLM tool calling</strong> that connect an LLM to SQL databases, remote REST APIs,
                          web search, image search, Agent Skills and static data. Your data stays where it is:
                          the LLM only sees the query results and responses that it asks for.
                          <a href="https://docs.smarter.sh/smarter-framework/smarter-extensions.html" rel="noopener" target="_blank">Extensions</a>,
                          which the platform administrator installs, add tools written in Python.
                        {% endblocktranslate %}
                      </li>
                      <li style="margin-bottom:8px">
                        {% blocktranslate with product_name=branding.smarter_product_name trimmed %}
                          <strong>A no-code approach to authoring AI resources.</strong> Every resource in {{ product_name }}
                          is a short
                          <a href="https://docs.smarter.sh/smarter-framework/smarter-manifests.html" rel="noopener" target="_blank">YAML manifest</a>,
                          so you can build and manage a working AI application without writing code.
                        {% endblocktranslate %}
                      </li>
                      <li style="margin-bottom:8px">
                        {% blocktranslate trimmed %}
                          <strong>A web Prompt Engineering Workbench</strong> for designing, testing and debugging
                          the prompts of your AI applications interactively.
                        {% endblocktranslate %}
                      </li>
                    </ul>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- open source, built for production -->
          <tr>
            <td style="padding:28px 50px 8px 50px; font-size:14px; line-height:1.6; color:#3F4254">
              <p style="margin:0 0 8px 0; color:#181C32; font-size:18px; font-weight:600">{% translate "Open Source, Built for Production" %}</p>
              <p style="margin:0 0 12px 0">
                {% blocktranslate with product_name=branding.smarter_product_name trimmed %}
                  <strong>{{ product_name }} is more than a teaching tool.</strong>
                  It is free, open source software, licensed under the GNU AGPL v3, and it was built to run
                  in production: on Kubernetes, with cost accounting, secrets management and per-account
                  access control. Running at scale, security and cost management may be out of scope for
                  this course, but you will face them once you complete it, and the source code and
                  documentation are there for you to explore, during the course and after.
                {% endblocktranslate %}</p>
              <p style="margin:0 0 8px 0">
                {% blocktranslate with product_name=branding.smarter_product_name trimmed %}
                  Some links to help you get started
                  on your journey to mastering {{ product_name }}:
                {% endblocktranslate %}</p>
              <ul style="margin:0 0 8px 0; padding-left:20px">
                <li style="margin-bottom:6px">{% blocktranslate trimmed %}<strong>Online documentation</strong> - <a href="https://docs.smarter.sh/" rel="noopener" target="_blank">https://docs.smarter.sh/</a>{% endblocktranslate %}</li>
                <li style="margin-bottom:6px">{% blocktranslate trimmed %}<strong>Cost accounting</strong> of every LLM request, by account, user and chat session <a href="https://docs.smarter.sh/smarter-platform/cost-accounting.html" rel="noopener" target="_blank">[learn more]</a>{% endblocktranslate %}</li>
                <li style="margin-bottom:6px">{% blocktranslate trimmed %}<strong>Runs on Kubernetes</strong>, on-premise or in the cloud <a href="https://docs.smarter.sh/smarter-framework/technologies/kubernetes.html" rel="noopener" target="_blank">[learn more]</a>{% endblocktranslate %}</li>
                <li style="margin-bottom:6px">{% blocktranslate trimmed %}<strong>Developer tools</strong>: a command-line interface, a REST API, and SDKs for Python, Node.js and Go <a href="https://docs.smarter.sh/smarter-framework/apis-and-sdks.html" rel="noopener" target="_blank">[learn more]</a>{% endblocktranslate %}</li>
                <li style="margin-bottom:6px">{% blocktranslate with slack_url=branding.url_slack trimmed %}<strong>Slack</strong> - join The Smarter Project's Slack workspace for real-time questions and discussion with other users and contributors <a href="{{ slack_url }}" rel="noopener" target="_blank">[join]</a>{% endblocktranslate %}</li>
                <li style="margin-bottom:6px">{% blocktranslate trimmed %}<strong>Source code</strong> on GitHub, where contributions are welcome <a href="https://github.com/smarter-sh/" rel="noopener" target="_blank">[learn more]</a>{% endblocktranslate %}</li>
                <li style="margin-bottom:6px">{% blocktranslate trimmed %}<strong>Deployment guides</strong> for <a href="https://docs.smarter.sh/smarter-platform/installation/production-deployment.html" rel="noopener" target="_blank">production</a>, a <a href="https://docs.smarter.sh/smarter-platform/installation/quick-start.html" rel="noopener" target="_blank">Quick Start</a> for evaluation, and <a href="https://docs.smarter.sh/smarter-framework/guides/developer-setup.html" rel="noopener" target="_blank">running from source</a> for developers.{% endblocktranslate %}</li>
              </ul>
            </td>
          </tr>

          <!-- video -->
          <tr>
            <td align="center" style="padding:16px 50px 8px 50px">
              <a href="{{ branding.smarter_project_cdn_url }}/videos/about.mp4" rel="noopener" target="_blank">
                <img alt="" width="500" src="{{ branding.smarter_project_cdn_url }}/videos/about-poster.png"
                  style="width:100%; max-width:500px; height:auto; border:0; border-radius:8px" />
              </a>
            </td>
          </tr>

          <!-- getting started -->
          <tr>
            <td style="padding:28px 50px 4px 50px">
              <p style="margin:0; color:#181C32; font-size:18px; font-weight:600">{% translate "Getting Started" %}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 40px 8px 40px">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                style="border-collapse:separate; background-color:#F5F8FA; border-radius:16px">
                <tr>
                  <td style="padding:18px 24px 14px 24px; border-bottom:1px dashed #E4E6EF; font-size:13px; line-height:1.5; color:#5E6278">
                    <a href="{{ branding.learn_url }}" target="_blank" rel="noopener"
                      style="color:#181C32; font-size:14px; font-weight:600">{% translate "Quick Start Tutorial" %}</a>
                    <p style="margin:3px 0 0 0">
                      {% blocktranslate with product_name=branding.smarter_product_name percent="80%" trimmed %}
                        This page will give you an introduction to the {{ percent }} of {{ product_name }} concepts that you will use
                        on a daily basis.
                      {% endblocktranslate %}</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:14px 24px; border-bottom:1px dashed #E4E6EF; font-size:13px; line-height:1.5; color:#5E6278">
                    <a href="{{ branding.workbench_exmample_url }}" target="_blank" rel="noopener"
                      style="color:#181C32; font-size:14px; font-weight:600">{% translate "Example LLMClients" %}</a>
                    <p style="margin:3px 0 0 0">
                      {% blocktranslate trimmed %}
                        Try the example LLMClients in your account, such as the Stackademy course catalog
                        assistants, which answer questions from a SQL database and from a REST API.
                      {% endblocktranslate %}</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:14px 24px; border-bottom:1px dashed #E4E6EF; font-size:13px; line-height:1.5; color:#5E6278">
                    <a href="{{ branding.smarter_project_docs_url }}" target="_blank" rel="noopener"
                      style="color:#181C32; font-size:14px; font-weight:600">{% translate "Documentation" %}</a>
                    <p style="margin:3px 0 0 0">
                      {% blocktranslate with product_name=branding.smarter_product_name trimmed %}
                        Learn more about {{ product_name }} manifests, plugins, extensions, the command-line interface, and
                        the API.
                      {% endblocktranslate %}</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:14px 24px 18px 24px; font-size:13px; line-height:1.5; color:#5E6278">
                    <a href="{{ branding.url_slack }}" target="_blank" rel="noopener"
                      style="color:#181C32; font-size:14px; font-weight:600">{% translate "Slack Community" %}</a>
                    <p style="margin:3px 0 0 0">
                      {% blocktranslate with product_name=branding.smarter_product_name trimmed %}
                        Ask questions and talk with other {{ product_name }} users and contributors in real time,
                        in The Smarter Project's Slack workspace.
                      {% endblocktranslate %}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- signature -->
          <tr>
            <td align="center"
              style="font-size:13px; text-align:center; padding:28px 30px 10px 30px; font-weight:500; color:#A1A5B7; font-family:Arial,Helvetica,sans-serif">
              <p style="margin:0 0 6px 0; color:#181C32; font-size:16px; font-weight:600">{{ branding.primary_contact }}</p>
              <p style="margin:0 0 4px 0">{% blocktranslate with product_name=branding.smarter_product_name trimmed %}Technical point of contact for {{ product_name }}.{% endblocktranslate %}</p>
              <p style="margin:0">{% blocktranslate with support_email=branding.support_email contact_url=branding.contact_url trimmed %}Email me at <a href="mailto:{{ support_email }}" style="font-weight: 600">{{ support_email }}</a>, or visit <a href="{{ contact_url }}" rel="noopener" target="_blank" style="font-weight: 600">my website</a>.{% endblocktranslate %}</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="text-align:center; padding:10px 0 6px 0">
              <a href="{{ branding.url_linkedin }}" target="_blank" rel="noopener" style="text-decoration:none; margin-right:10px">
                <img alt="LinkedIn" height="24" src="{% absolute_static 'assets/media/email/icon-linkedin.png' %}" style="height:24px; border:0" /></a>
              <a href="{{ branding.url_twitter }}" target="_blank" rel="noopener" style="text-decoration:none; margin-right:10px">
                <img alt="X" height="24" src="{% absolute_static 'assets/media/email/icon-twitter.png' %}" style="height:24px; border:0" /></a>
              <a href="{{ branding.url_slack }}" target="_blank" rel="noopener" style="text-decoration:none">
                <img alt="Slack" height="24" src="{% absolute_static 'assets/media/email/icon-slack.png' %}" style="height:24px; border:0" /></a>
            </td>
          </tr>
          <tr>
            <td align="center"
              style="font-size:12px; padding:6px 30px 0 30px; text-align:center; font-weight:500; color:#A1A5B7; font-family:Arial,Helvetica,sans-serif">
              <p style="margin:0">{% blocktranslate with product_name=branding.smarter_product_name trimmed %}{{ product_name }} is free, open source software, licensed under the <a href="https://www.gnu.org/licenses/agpl-3.0.html" rel="noopener" target="_blank">GNU AGPL v3</a>.{% endblocktranslate %}</p>
            </td>
          </tr>
          {% include "account/email/unsubscribe-footer.html" %}
          <tr>
            <td style="padding:0 0 30px 0; font-size:0; line-height:0">&nbsp;</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
