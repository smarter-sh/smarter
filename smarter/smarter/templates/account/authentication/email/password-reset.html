{% load i18n smarter_email %}{% get_current_language as LANGUAGE_CODE %}{% comment %}
  The email with a user's password reset link. See smarter.apps.account.password_reset. Mail clients
  strip <style> blocks, scripts and external stylesheets, so the layout is tables with inline styles,
  and the images are PNGs. It is sent because the user asked for it, so it has no unsubscribe link.
  Context: branding, password_reset (url).
{% endcomment %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <title>{% translate "Reset Your Password" %}</title>
</head>

<body style="margin:0; padding:0; background-color:#D5D9E2; font-family:Arial,Helvetica,sans-serif; color:#3F4254">
  <table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="100%"
    style="border-collapse:collapse; background-color:#D5D9E2">
    <tr>
      <td align="center" style="padding:40px 10px">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600"
          style="border-collapse:separate; width:100%; max-width:600px; background-color:#FFFFFF; border-radius:24px; overflow:hidden">

          <!-- logo -->
          <tr>
            <td align="center" style="padding:36px 40px 28px 40px">
              <a href="{{ branding.root_url }}" rel="noopener" target="_blank">
                <img alt="{{ branding.smarter_product_name }}" height="60"
                  src="{% smarter_logo_url %}" style="height:60px; border:0" />
              </a>
            </td>
          </tr>

          <!-- hero -->
          <tr>
            <td align="center" style="background-color:#1E1E2D; padding:40px 40px 36px 40px; text-align:center">
              <p style="margin:0 0 8px 0; color:#FF8A65; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase">
                {{ branding.smarter_product_name }}</p>
              <p style="margin:0; color:#FFFFFF; font-size:30px; font-weight:700; line-height:1.25">
                {% translate "Reset Your Password" %}</p>
            </td>
          </tr>

          <!-- message -->
          <tr>
            <td style="padding:32px 50px 8px 50px; font-size:15px; line-height:1.6; color:#3F4254">
              <p style="margin:0 0 16px 0">{% translate "We received a request to reset your password. If you didn't make the request, just ignore this email. Otherwise, you can reset your password using the link below." %}</p>
            </td>
          </tr>

          <!-- call to action -->
          <tr>
            <td align="center" style="padding:8px 50px 12px 50px">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background-color:#F1416C; border-radius:8px">
                    <a href="{{ password_reset.url }}" target="_blank" rel="noopener"
                      style="display:inline-block; padding:14px 30px; color:#FFFFFF; font-size:16px; font-weight:700; text-decoration:none; font-family:Arial,Helvetica,sans-serif">{% translate "Reset Password" %}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:14px 0 0 0; color:#7E8299; font-size:13px">
                {% translate "This link will expire in 24 hours, so be sure to use it right away." %}</p>
            </td>
          </tr>

          <!-- help -->
          <tr>
            <td style="padding:28px 50px 8px 50px; font-size:13px; line-height:1.6; color:#7E8299">
              <p style="margin:0">
                {% blocktranslate with support_email=branding.support_email trimmed %}
                  Need help? Email the platform's administrator at <a href="mailto:{{ support_email }}" style="color:#7E8299; font-weight:600">{{ support_email }}</a>.
                {% endblocktranslate %}</p>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td align="center"
              style="font-size:12px; padding:20px 30px 30px 30px; text-align:center; font-weight:500; color:#A1A5B7; font-family:Arial,Helvetica,sans-serif">
              <p style="margin:0">{% blocktranslate with product_name=branding.smarter_product_name trimmed %}{{ product_name }} is free, open source software, licensed under the <a href="https://www.gnu.org/licenses/agpl-3.0.html" rel="noopener" target="_blank">GNU AGPL v3</a>.{% endblocktranslate %}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
