<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smarter Manifest Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />

    <link href="/assets/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
    <link href="/assets/css/style.bundle.css" rel="stylesheet" type="text/css" />
    <link href="/common-styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <!--
    only used for development via 'npm run dev'. In production, this file is rendered
    by Django.

    See:
    - smarter.apps.dashboard.templatetags.react_manifest_editor
    - templates/common/manifest_detail.html, e.g. smarter.apps.guardrail.views.detailview.GuardrailDetailView
    -->
    <script id="smarter-manifest-editor-data" type="application/json">
      "apiVersion: smarter.sh/v1\nkind: Guardrail\nmetadata:\n  name: example_guardrail\n  description: An example Guardrail.\n  version: 1.0.0\nspec:\n  config:\n    stage: input\n    strategy: keyword\n    keywords:\n    - ignore all previous instructions\n    action: block\nstatus:\n  dependencies: []\n"
    </script>
    <div
      id="smarter-manifest-editor-root"
      smarter-manifest-data-id="smarter-manifest-editor-data"
      smarter-apply-api-url="/api/v1/cli/apply/"
      smarter-validate-api-url="/api/v1/cli/validate/"
      smarter-delete-api-url="/api/v1/cli/delete/__kind__/"
      smarter-kind-placeholder="__kind__"
      django-csrf-cookie-name="csrftoken"
      django-session-cookie-name="sessionid"
      django-cookie-domain="localhost"
      react-debug-mode="true"
      smarter-request-id="abcd1234"
    ></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  <script src="/assets/plugins/global/plugins.bundle.js"></script>
  <script src="/assets/js/scripts.bundle.js"></script>
</html>
