default_language_version:
  # default language version for each language
  python: python3.13
# Install the commit-msg hook too, so that commitlint checks each commit message.
# semantic-release versions Smarter Chat from the conventional commit messages.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
        # the message catalogs are in Spanish and French.
        exclude: '\.svg$|^node_modules/|^dist/|^CHANGELOG\.md$|^\.storybook/public/mockServiceWorker\.js$|^locale/|^src/catalogs\.gen\.ts$'

  # Prettier and ESLint, with this repository's own configuration, from its node_modules (make init),
  # or from the Smarter React workspace's, two directories up, when it is inside one.
  - repo: local
    hooks:
      - id: react-prettier
        name: prettier
        entry: bash -c 'PATH="$PWD/node_modules/.bin:$PWD/../../node_modules/.bin:$PATH" prettier --write --ignore-unknown "$@"' --
        language: system
        # not at commit-msg, where its only file would be .git/COMMIT_EDITMSG.
        stages: [pre-commit]
        exclude: ^CHANGELOG\.md$
      - id: react-eslint
        name: eslint
        entry: bash -c 'PATH="$PWD/node_modules/.bin:$PWD/../../node_modules/.bin:$PATH" eslint --max-warnings=0 --no-warn-ignored "$@"' --
        language: system
        files: \.(ts|tsx|js)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # See https://pre-commit.com/hooks.html for more hooks
      #- id: check-added-large-files
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional", "@commitlint/config-angular"]
ci:
  # for more information, see https://pre-commit.ci
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [react-prettier, react-eslint, commitlint]
  submodules: false
