---
#------------------------------------------------------------------------------
# For local development, you can use the following docker-compose file
# to run the application. This file will start a MariaDB database, a Redis
# server, Celery and Beat workers, and the application itself. The application
# will be available at http://localhost:9357.
#------------------------------------------------------------------------------
services:
  smarter-mariadb:
    container_name: smarter-mariadb
    mem_limit: 2g
    cpus: 0.5
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: smarter
      MYSQL_DATABASE: smarter
      MYSQL_USER: smarter
      MYSQL_PASSWORD: smarter
    ports:
      - 3306:3306
    volumes:
      - ./mariadb-data:/var/lib/mysql

  smarter-redis:
    container_name: smarter-redis
    cpus: 0.25
    mem_limit: 1g
    image: redis:latest
    # the ACL users of the tool worker, tools, and of the Extension worker, extensions, with the Helm chart's
    # rules (redis.master.preExecCmds in values.yaml).
    # A list, not a string: compose splits a string command like a shell, and stops at the > of the password.
    command:
      [
        "redis-server",
        "--requirepass",
        "smarter",
        "--user",
        "tools",
        "on",
        ">smarter-tools",
        "~tools_celery_task_queue*",
        "~celery-task-meta-*",
        "%R~django*:1:smarter:extension:archive:*",
        "~tools_cache:*",
        "%W~stream:logs:*",
        "&logs:*",
        "&celery-task-meta-*",
        "+@all",
        "-@dangerous",
        "-@admin",
        "-scan",
        "-randomkey",
        "-pubsub",
        "-subscribe",
        "-psubscribe",
        "-ssubscribe",
        "--user",
        "extensions",
        "on",
        ">smarter-extensions",
        "~extensions_celery_task_queue*",
        "~celery-task-meta-*",
        "%R~django*:1:smarter:extension:archive:*",
        "~extensions_cache:*",
        "%W~stream:logs:*",
        "&logs:*",
        "&celery-task-meta-*",
        "+@all",
        "-@dangerous",
        "-@admin",
        "-scan",
        "-randomkey",
        "-pubsub",
        "-subscribe",
        "-psubscribe",
        "-ssubscribe",
      ]
    ports:
      - 6379:6379

  smarter-api:
    container_name: smarter-api
    mem_limit: 4g
    cpus: 1
    user: smarter_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # future use. The worker and beat services use the same Dockerfile as this app service,
        # but we can optionally set the SCHEMA build argument to something other than "APP"
        # in order to fine tune the build requirements.
        SCHEMA: APP
        ENVIRONMENT: ${SMARTER_ENVIRONMENT:-local}
        DOCKER_COLLECT_STATIC_FILES: ${DOCKER_COLLECT_STATIC_FILES}
    image: smarter
    command: watchmedo auto-restart --directory=./smarter --pattern=*.py --recursive -- uvicorn smarter.asgi:application --host 0.0.0.0 --port 9357 --lifespan off
    # volumes:
    #   - type: bind
    #     source: ./smarter
    #     target: /smarter
    #     consistency: cached
    ports:
      - 9357:9357
    depends_on:
      - smarter-mariadb
      - smarter-redis
    env_file:
      - ./.env
    volumes:
      # the local overrides file, overrides/settings.yaml, read-only. Its values overwrite
      # Smarter's Django settings. See smarter/smarter/settings/overrides.py.
      - ./overrides:/home/smarter_user/overrides:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=app
      # smarter-mariadb's MYSQL_ROOT_PASSWORD, as whom initialize_platform creates the Stackademy
      # course database, with the pre script of its scripts/scripts.yaml.
      - SMARTER_SUBSYSTEM_SQL_ROOT_PASSWORD=smarter

  smarter-worker:
    container_name: smarter-worker
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # future use. The worker and beat services use the same Dockerfile as the app service,
        # but we can optionally set the SCHEMA build argument to something other than "APP"
        # in order to fine tune the build requirements.
        SCHEMA: APP
        ENVIRONMENT: ${SMARTER_ENVIRONMENT:-local}
        DOCKER_COLLECT_STATIC_FILES: ${DOCKER_COLLECT_STATIC_FILES}
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=4 --loglevel=info -Q default_celery_task_queue -E
    depends_on:
      - smarter-mariadb
      - smarter-redis
      - smarter-api
    env_file:
      - ./.env
    volumes:
      # the local overrides file, overrides/settings.yaml, read-only. Its values overwrite
      # Smarter's Django settings. See smarter/smarter/settings/overrides.py.
      - ./overrides:/home/smarter_user/overrides:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker
    # volumes:
    #   - type: bind
    #     source: ./smarter
    #     target: /smarter
    #     consistency: cached
    healthcheck:
      test: ["CMD", "celery", "-A", "smarter.workers.celery.app", "inspect", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  # Serves the infrastructure queue: tasks that deploy, verify and destroy cloud, Kubernetes and
  # DNS resources, which can take many minutes. Its own worker, so that they never block the
  # operational tasks of smarter-worker, such as prompt history, charges and budgets.
  smarter-worker-infrastructure:
    container_name: smarter-worker-infrastructure
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # future use. The worker and beat services use the same Dockerfile as the app service,
        # but we can optionally set the SCHEMA build argument to something other than "APP"
        # in order to fine tune the build requirements.
        SCHEMA: APP
        ENVIRONMENT: ${SMARTER_ENVIRONMENT:-local}
        DOCKER_COLLECT_STATIC_FILES: ${DOCKER_COLLECT_STATIC_FILES}
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=4 --loglevel=info -Q infrastructure_celery_task_queue -E -n infrastructure@%h
    depends_on:
      - smarter-mariadb
      - smarter-redis
      - smarter-api
    env_file:
      - ./.env
    volumes:
      # the local overrides file, overrides/settings.yaml, read-only. Its values overwrite
      # Smarter's Django settings. See smarter/smarter/settings/overrides.py.
      - ./overrides:/home/smarter_user/overrides:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker
    # volumes:
    #   - type: bind
    #     source: ./smarter
    #     target: /smarter
    #     consistency: cached
    healthcheck:
      test: ["CMD", "celery", "-A", "smarter.workers.celery.app", "inspect", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  # the tool worker (ADR-038): it executes tool calls that the app has resolved, when
  # SMARTER_APP_LLMTOOL_TOOL_RUNNER=remote, and the tests' round trips through Celery. It never reads
  # the database: each call brings what it needs. Here it shares .env with the other services, for
  # convenience; a deployment gives it only the broker's url (see the Helm chart's workerTools).
  # It runs the image that the other services build, and has no build of its own, so that
  # make docker-build exports no fifth copy, and CI's cache override needs no entry for it.
  smarter-worker-tools:
    container_name: smarter-worker-tools
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    image: smarter
    pull_policy: never
    # no -E: task events would copy each call's arguments, which hold its credentials.
    # without mingle, gossip, heartbeats or remote control, whose keys its Redis user can't reach.
    command: celery -A smarter.workers.celery.app worker --concurrency=4 --loglevel=info -Q tools_celery_task_queue -n tools@%h --without-mingle --without-gossip --without-heartbeat
    depends_on:
      - smarter-redis
    env_file:
      - ./.env
    volumes:
      - ./overrides:/home/smarter_user/overrides:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker
      - SMARTER_DATABASE_UNAVAILABLE=true
      # its own Redis user, which may touch only its own keys (ADR-030, rule 8).
      - SMARTER_SUBSYSTEM_REDIS_USERNAME=tools
      - SMARTER_SUBSYSTEM_REDIS_PASSWORD=smarter-tools
      # @cache_results' own cache (cache-results reads it), as the Helm chart's smarter.toolWorkerEnv sets it:
      # the cache's database, as the same user, under the keys that its ACL rule ~tools_cache:* allows.
      - 'CACHE_RESULTS_CACHE={"BACKEND": "django_redis.cache.RedisCache", "LOCATION": "redis://tools:smarter-tools@smarter-redis:6379/1", "KEY_PREFIX": "tools_cache", "OPTIONS": {"SOCKET_CONNECT_TIMEOUT": 2, "SOCKET_TIMEOUT": 5}}'
    healthcheck:
      # it takes no remote control, so celery inspect ping can't reach it.
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null"]
      interval: 30s
      timeout: 30s
      retries: 3

  # the Extension worker (issue #1077): it runs Extensions' tool calls, which the app sends to its own queue,
  # each in a process of its own (--max-tasks-per-child=1), as the Redis user extensions, which can't read
  # the tool worker's queue. Otherwise it is the tool worker: no database, the same image.
  smarter-worker-extensions:
    container_name: smarter-worker-extensions
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    image: smarter
    pull_policy: never
    # no -E: task events would copy each call's arguments, which hold its credentials.
    # without mingle, gossip, heartbeats or remote control, whose keys its Redis user can't reach.
    command: celery -A smarter.workers.celery.app worker --concurrency=2 --loglevel=info -Q extensions_celery_task_queue -n extensions@%h --max-tasks-per-child=1 --without-mingle --without-gossip --without-heartbeat
    depends_on:
      - smarter-redis
    env_file:
      - ./.env
    volumes:
      - ./overrides:/home/smarter_user/overrides:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker
      - SMARTER_DATABASE_UNAVAILABLE=true
      # its own Redis user, which may touch only its own keys (ADR-030, rule 8).
      - SMARTER_SUBSYSTEM_REDIS_USERNAME=extensions
      - SMARTER_SUBSYSTEM_REDIS_PASSWORD=smarter-extensions
      # @cache_results' own cache, as for the tool worker, under the keys that ~extensions_cache:* allows.
      - 'CACHE_RESULTS_CACHE={"BACKEND": "django_redis.cache.RedisCache", "LOCATION": "redis://extensions:smarter-extensions@smarter-redis:6379/1", "KEY_PREFIX": "extensions_cache", "OPTIONS": {"SOCKET_CONNECT_TIMEOUT": 2, "SOCKET_TIMEOUT": 5}}'
      - SMARTER_APP_TOOLS_WORKER_QUEUE=extensions_celery_task_queue
    healthcheck:
      # it takes no remote control, so celery inspect ping can't reach it.
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null"]
      interval: 30s
      timeout: 30s
      retries: 3

  smarter-beat:
    container_name: smarter-beat
    mem_limit: 1g
    cpus: 0.5
    user: smarter_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # future use. The worker and beat services use the same Dockerfile as the app service,
        # but we can optionally set the SCHEMA build argument to something other than "APP"
        # in order to fine tune the build requirements.
        SCHEMA: APP
        ENVIRONMENT: ${SMARTER_ENVIRONMENT:-local}
        DOCKER_COLLECT_STATIC_FILES: ${DOCKER_COLLECT_STATIC_FILES}
    image: smarter
    command: celery -A smarter.workers.celerybeat beat --loglevel=info
    depends_on:
      - smarter-mariadb
      - smarter-redis
      - smarter-api
    env_file:
      - ./.env
    volumes:
      # the local overrides file, overrides/settings.yaml, read-only. Its values overwrite
      # Smarter's Django settings. See smarter/smarter/settings/overrides.py.
      - ./overrides:/home/smarter_user/overrides:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=beat
    # volumes:
    #   - type: bind
    #     source: ./smarter
    #     target: /smarter
    #     consistency: cached
    healthcheck:
      test: ["CMD", "celery", "-A", "smarter.workers.celerybeat", "inspect", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
