# -----------------------------------------------------------------------------------
# Purpose: the MariaDB passwords, in the Secret that the Bitnami MariaDB subchart reads.
#
# The subchart reads them from mariadb.auth.existingSecret, which values.yaml sets to this
# Secret's name, <release>-mariadb: the name that the subchart gives the Secret it would
# otherwise create itself, so that the MariaDB pod's spec, and the pod, stay the same.
#
# The passwords are the platform's own, from smarter.env in _helpers.tpl: on a cluster that
# smarter-infrastructure built, those of its Kubernetes Secrets mysql-root and mysql-smarter.
# MariaDB sets its root password from mariadb-root-password only when it creates its data
# directory, on a fresh install, and the init job (job-init.yaml) connects as root with the same
# password, then creates the platform's database and user with mariadb-password. Without a value,
# mariadb.auth.rootPassword and mariadb.auth.password apply, and then the passwords that this
# Secret already holds, so an upgrade never changes them.
# -----------------------------------------------------------------------------------
{{- if .Values.mariadb.enabled }}
{{- $env := include "smarter.env" . | fromYaml }}
{{- $name := printf "%s-mariadb" .Release.Name }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $currentRoot := get $current "mariadb-root-password" | b64dec }}
{{- $currentPassword := get $current "mariadb-password" | b64dec }}
{{- $rootPassword := $env.SMARTER_SUBSYSTEM_SQL_ROOT_PASSWORD | default .Values.mariadb.auth.rootPassword | default $currentRoot }}
{{- $password := $env.SMARTER_SUBSYSTEM_SQL_PASSWORD | default .Values.mariadb.auth.password | default $currentPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $name }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ $name }}"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
type: Opaque
stringData:
  mariadb-root-password: {{ $rootPassword | quote }}
  mariadb-password: {{ $password | quote }}
  mariadb-replication-password: {{ $rootPassword | quote }}
{{- end }}
