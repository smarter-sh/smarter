# -----------------------------------------------------------------------------------
# Purpose: the platform's environment for the pre-upgrade migrate Job (job-migrate.yaml).
#
# The migrate Job's own settings, from the same template as secret-env.yaml's
# (smarter.podEnv in _helpers.tpl, for the kind job-migrate: only its own credentials,
# ADR-038), in a Secret of its own that is a pre-upgrade hook. Helm applies
# secret-env.yaml only after the pre-upgrade hooks, so a migrate Job that read it would
# run the new release's image with the previous release's settings. When a release
# renames a setting, the new code doesn't find it, and the Job fails before it migrates:
# v0.46.16 renamed SECRET_KEY to DJANGO_SECRET_KEY and SMARTER_MYSQL_* to
# SMARTER_SUBSYSTEM_SQL_*, and its migrate Job stopped with "DJANGO_SECRET_KEY is not set".
#
# - Its hook weight is lower than the Job's, so Helm creates it first.
# - before-hook-creation replaces the previous upgrade's copy. hook-succeeded deletes it
#   once every pre-upgrade hook has passed. A failed upgrade keeps it, with the failed Job.
# - Upgrades only, like the Job.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- if .Values.databaseInit.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.global.appName }}-env-migrate"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-env-migrate"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
type: Opaque
stringData:
  {{- /* the migrate Job's settings: see smarter.podEnv in _helpers.tpl */}}
  {{- range $key, $value := include "smarter.podEnv" (dict "root" . "pod" "job-migrate") | fromYaml }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
