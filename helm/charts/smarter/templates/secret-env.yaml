# -----------------------------------------------------------------------------------
# Purpose: Secret that holds the platform's environment, .Values.env.
#
# Every pod reads it with envFrom, so the platform's credentials (SECRET_KEY, the
# database and AWS passwords, the LLM providers' api keys, ...) are stored once, in a
# Kubernetes Secret, rather than as literal values in each Deployment's, Job's and
# CronJob's pod spec, where anyone who may read those objects could read them.
# smarter_settings (smarter.common.conf) reads the same variables either way.
#
# The pods' checksum/env annotation changes when this Secret's content does, so a
# changed value rolls the pods that read it.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.global.appName }}-env"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-env"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
type: Opaque
stringData:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
