# -----------------------------------------------------------------------------------
# Purpose: the Secrets that hold each kind of pod's environment, <appName>-env-<pod>
# (ADR-038, phase 3, issue #1084).
#
# One Secret per kind of pod, as SERVICE_TYPE names it: the app (api), smarter-worker
# (worker), smarter-worker-infrastructure, Celery Beat, the bastion, the init Job and the
# backup Job. Each holds .Values.env and the derived settings (smarter.env in
# _helpers.tpl), without the credentials that its kind doesn't hold: see smarter.podEnv,
# which reads files/credentials.json, the map of each credential to the kinds of pod
# that hold it. A pod reads its own Secret with envFrom, or a few keys of it with
# secretKeyRef, so no pod's environment holds another's credentials, e.g. Celery Beat
# never sees the SMTP password, and only the init Job, the backup Job and the bastion
# see the database administrator's.
#
# The other kinds have Secrets of their own: the migrate Job (secret-env-migrate.yaml,
# a pre-upgrade hook), the tool worker (secret-env-tools.yaml), the Extension worker
# (secret-env-extensions.yaml) and the Slack bot (secret-env-slack-bot.yaml).
#
# Each pod's checksum/env annotation is its own Secret's content, so a changed value
# rolls only the pods that hold it.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- $pods := list "api" "worker" "worker-infrastructure" "beat" "bastion" }}
{{- if .Values.databaseInit.enabled }}
{{- $pods = append $pods "job-init" }}
{{- end }}
{{- if .Values.databaseScheduledBackup.enabled }}
{{- $pods = append $pods "job-backup" }}
{{- end }}
{{- range $index, $pod := $pods }}
{{- if $index }}
---
{{- end }}
{{- $name := include "smarter.podEnvName" (dict "root" $ "pod" $pod) }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $name }}"
  namespace: "{{ $.Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ $.Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ $.Values.namespace }}"
    meta.helm.sh/application-version: "{{ $.Chart.Version }}"
  labels:
    helm.sh/chart: "{{ $.Chart.Name }}-{{ $.Chart.Version }}"
    app.kubernetes.io/name: "{{ $name }}"
    app.kubernetes.io/application-group: "{{ $.Values.global.appName }}"
type: Opaque
stringData:
  {{- range $key, $value := include "smarter.podEnv" (dict "root" $ "pod" $pod) | fromYaml }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
