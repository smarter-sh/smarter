# -----------------------------------------------------------------------------------
# Job Manifest for Smarter Database Initialization
#
# This file defines a Kubernetes Job to initialize the MariaDB database for the Smarter app.
#
# - Maintainer: <your team/contact>
# - Purpose: Creates the database if it does not exist, typically run as a Helm hook.
# - Usage: Only rendered if databaseInit.enabled is set in values.yaml.
# - Notes: Update resource requests/limits and SQL logic as needed for your environment.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- if .Values.databaseInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-smarter-job-db-init-{{ now | unixEpoch }}"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
    "helm.sh/hook": post-upgrade,post-install
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-job-init"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}-job-init"
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        jobTimestamp: "{{ now | unixEpoch }}"
    spec:
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      automountServiceAccountToken: true
      containers:
        - resources:
            requests:
              memory: "500Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
          args:
            - |
              # Run every step, even after a failure, then exit non-zero if any step failed,
              # so that a failed step fails the Job (and the Helm hook) instead of being hidden.
              # The mariadb commands carry passwords, so they don't run through run(), which echoes its command.
              # The steps' output is also written to a log file, which is emailed when the Job completes,
              # to databaseInit.notifyEmail, or to smarter_settings.email_admin, and posted to the Slack
              # channel databaseInit.notifySlackChannel, if any. The steps run in a subshell (they are piped to tee), so their exit status is passed back in a file.
              {
                status=0
                run() {
                  echo "--- $*"
                  "$@" || { echo "FAILED: $*"; status=1; }
                }
                # The credentials come from the environment, i.e. the Secret in secret-env.yaml, never from
                # this template, so they aren't written into the Job's spec. The root password is passed
                # in MYSQL_PWD, where the mariadb client reads it, which keeps it off the command line.
                # The client doesn't count MYSQL_PWD as a password, so it already skips checking the server's
                # certificate, with a warning on every call. --skip-ssl-verify-server-cert says so explicitly
                # and silences the warning; it changes nothing. The database runs inside the cluster, where the
                # network policies on app.kubernetes.io/application-group protect it, and has no public CA.
                # Revisit this if the database moves to a managed service such as RDS, or outside the cluster's
                # network: then pass the password in --defaults-extra-file and verify with --ssl-ca.
                db() {
                  MYSQL_PWD="$SMARTER_MYSQL_ROOT_PASSWORD" mariadb --default-character-set=utf8mb4 --skip-ssl-verify-server-cert \
                    -u "$SMARTER_MYSQL_ROOT_USERNAME" --host "$SMARTER_MYSQL_HOST" --port "${SMARTER_MYSQL_PORT:-3306}" -e "$1"
                }
                db "CREATE DATABASE IF NOT EXISTS $SMARTER_MYSQL_DATABASE CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" || status=1
                db "ALTER DATABASE $SMARTER_MYSQL_DATABASE CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" || status=1
                db "CREATE USER IF NOT EXISTS '$SMARTER_MYSQL_USER'@'%' IDENTIFIED BY '$SMARTER_MYSQL_PASSWORD';" || status=1
                db "ALTER USER '$SMARTER_MYSQL_USER'@'%' IDENTIFIED BY '$SMARTER_MYSQL_PASSWORD';" || status=1
                db "GRANT ALL PRIVILEGES ON $SMARTER_MYSQL_DATABASE.* TO '$SMARTER_MYSQL_USER'@'%'; FLUSH PRIVILEGES;" || status=1
                {{- $backupPassword := .Values.env.SMARTER_MYSQL_BACKUP_PASSWORD | default "" }}
                {{- if and $backupPassword (not (hasPrefix "SET-ME" $backupPassword)) }}
                # the read-only account that the nightly backup, job-mysql-backup.yaml, dumps the database with.
                # SHOW CREATE ROUTINE exists in MariaDB 11.3 and later. On an older server, the grant without it
                # still dumps every table, view, trigger and event.
                backup_user="${SMARTER_MYSQL_BACKUP_USERNAME:-smarter_backup}"
                db "CREATE USER IF NOT EXISTS '$backup_user'@'%' IDENTIFIED BY '$SMARTER_MYSQL_BACKUP_PASSWORD';" || status=1
                db "ALTER USER '$backup_user'@'%' IDENTIFIED BY '$SMARTER_MYSQL_BACKUP_PASSWORD';" || status=1
                db "GRANT SELECT, SHOW VIEW, TRIGGER, EVENT, SHOW CREATE ROUTINE ON $SMARTER_MYSQL_DATABASE.* TO '$backup_user'@'%';" \
                  || { echo "This server has no SHOW CREATE ROUTINE privilege. Granting $backup_user the rest."; db "GRANT SELECT, SHOW VIEW, TRIGGER, EVENT ON $SMARTER_MYSQL_DATABASE.* TO '$backup_user'@'%';"; } \
                  || status=1
                {{- end }}
                run python manage.py migrate
                # initialize_platform does all of the platform's initialization, and this Job adds none of its
                # own: every example resource, and Stackademy, including its course database, which it creates
                # as SMARTER_MYSQL_ROOT_USERNAME. It reads the admin username and password from
                # SMARTER_ADMIN_USERNAME and SMARTER_ADMIN_PASSWORD.
                run python manage.py initialize_platform
                echo $status > /tmp/job-init.status
              } 2>&1 | tee /tmp/job-init.log
              status=$(cat /tmp/job-init.status 2>/dev/null || echo 1)
              python manage.py email_job_log --file /tmp/job-init.log --job "{{ .Release.Name }}-smarter-job-init {{ .Chart.Version }}" --status "$status" --to "{{ .Values.databaseInit.notifyEmail | default "" }}" --slack-channel "{{ .Values.databaseInit.notifySlackChannel | default "" }}" || true
              exit $status

          command:
            - /bin/sh
            - -c
          # the platform's environment, from the Secret in secret-env.yaml
          envFrom:
            - secretRef:
                name: "{{ .Values.global.appName }}-env"
          env:
            # Python block-buffers stdout when it is piped, here to tee, so the commands' summaries
            # would otherwise come out after all of their logging, which goes to unbuffered stderr.
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- range $env := .Values.app.env }}
            - name: {{ $env.name }}
              value: {{ $env.value | quote }}
            {{- end }}
          image: '{{ .Values.env.SMARTER_DOCKER_IMAGE | default (printf "%s:%s" .Values.global.image.repository .Values.global.image.tag) }}'
          imagePullPolicy: {{ .Values.global.image.pullPolicy | default "Always" }}
          name: "{{ .Values.global.appName }}-job-init"
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Never
      schedulerName: default-scheduler
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
{{- end }}
