# -----------------------------------------------------------------------------------
# Job Manifest for Smarter Database Initialization
#
# This file defines a Kubernetes Job to initialize the MariaDB database for the Smarter app.
#
# - Maintainer: <your team/contact>
# - Purpose: Creates the database if it does not exist, typically run as a Helm hook.
# - Usage: Only rendered if databaseInit.enabled is set in values.yaml.
# - Notes: Update resource requests/limits and SQL logic as needed for your environment.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- if .Values.databaseInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-smarter-job-db-init-{{ now | unixEpoch }}"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
    "helm.sh/hook": post-upgrade,post-install
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-job-init"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}-job-init"
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        jobTimestamp: "{{ now | unixEpoch }}"
    spec:
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      automountServiceAccountToken: true
      containers:
        - resources:
            requests:
              memory: "500Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
          args:
            - |
              # Run every step, even after a failure, then exit non-zero if any step failed,
              # so that a failed step fails the Job (and the Helm hook) instead of being hidden.
              # The mariadb commands carry passwords, so they don't run through run(), which echoes its command.
              # The steps' output is also written to a log file, which is emailed when the Job completes,
              # to databaseInit.notifyEmail, or to smarter_settings.email_admin. The steps run in a
              # subshell (they are piped to tee), so their exit status is passed back in a file.
              {
                status=0
                run() {
                  echo "--- $*"
                  "$@" || { echo "FAILED: $*"; status=1; }
                }
                mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "CREATE DATABASE IF NOT EXISTS {{ .Values.env.SMARTER_MYSQL_DATABASE }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" || status=1
                mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "ALTER DATABASE {{ .Values.env.SMARTER_MYSQL_DATABASE }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" || status=1
                mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "CREATE USER IF NOT EXISTS '{{ .Values.env.SMARTER_MYSQL_USER }}'@'%' IDENTIFIED BY '{{ .Values.env.SMARTER_MYSQL_PASSWORD }}';" || status=1
                mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "ALTER USER '{{ .Values.env.SMARTER_MYSQL_USER }}'@'%' IDENTIFIED BY '{{ .Values.env.SMARTER_MYSQL_PASSWORD }}';" || status=1
                mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "GRANT ALL PRIVILEGES ON {{ .Values.env.SMARTER_MYSQL_DATABASE }}.* TO '{{ .Values.env.SMARTER_MYSQL_USER }}'@'%'; FLUSH PRIVILEGES;" || status=1
                {{- $backupUsername := .Values.env.SMARTER_MYSQL_BACKUP_USERNAME | default "smarter_backup" }}
                {{- $backupPassword := .Values.env.SMARTER_MYSQL_BACKUP_PASSWORD | default "" }}
                {{- if and $backupPassword (not (hasPrefix "SET-ME" $backupPassword)) }}
                # the read-only account that the nightly backup, job-mysql-backup.yaml, dumps the database with.
                # SHOW CREATE ROUTINE exists in MariaDB 11.3 and later. On an older server, the grant without it
                # still dumps every table, view, trigger and event.
                mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "CREATE USER IF NOT EXISTS '{{ $backupUsername }}'@'%' IDENTIFIED BY '{{ $backupPassword }}';" || status=1
                mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "ALTER USER '{{ $backupUsername }}'@'%' IDENTIFIED BY '{{ $backupPassword }}';" || status=1
                mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "GRANT SELECT, SHOW VIEW, TRIGGER, EVENT, SHOW CREATE ROUTINE ON {{ .Values.env.SMARTER_MYSQL_DATABASE }}.* TO '{{ $backupUsername }}'@'%';" \
                  || { echo "This server has no SHOW CREATE ROUTINE privilege. Granting {{ $backupUsername }} the rest."; mariadb --default-character-set=utf8mb4 -u "{{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME }}" --password="{{ .Values.env.SMARTER_MYSQL_ROOT_PASSWORD }}" --host "{{ .Values.env.SMARTER_MYSQL_HOST }}" --port {{ .Values.env.SMARTER_MYSQL_PORT }} -e "GRANT SELECT, SHOW VIEW, TRIGGER, EVENT ON {{ .Values.env.SMARTER_MYSQL_DATABASE }}.* TO '{{ $backupUsername }}'@'%';"; } \
                  || status=1
                {{- end }}
                run python manage.py makemigrations
                run python manage.py migrate
                # initialize_platform does all of the platform's initialization, and this Job adds none of its
                # own: every example resource, and Stackademy, including its course database, which it creates
                # as SMARTER_MYSQL_ROOT_USERNAME. It reads the admin username and password from
                # SMARTER_ADMIN_USERNAME and SMARTER_ADMIN_PASSWORD.
                run python manage.py initialize_platform
                echo $status > /tmp/job-init.status
              } 2>&1 | tee /tmp/job-init.log
              status=$(cat /tmp/job-init.status 2>/dev/null || echo 1)
              python manage.py email_job_log --file /tmp/job-init.log --job "{{ .Release.Name }}-smarter-job-init {{ .Chart.Version }}" --status "$status" --to "{{ .Values.databaseInit.notifyEmail | default "" }}" || true
              exit $status

          command:
            - /bin/sh
            - -c
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $env := .Values.app.env }}
            - name: {{ $env.name }}
              value: {{ $env.value | quote }}
            {{- end }}
          image: '{{ .Values.env.SMARTER_DOCKER_IMAGE | default (printf "%s:%s" .Values.global.image.repository .Values.global.image.tag) }}'
          imagePullPolicy: {{ .Values.global.image.pullPolicy | default "Always" }}
          name: "{{ .Values.global.appName }}-job-init"
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Never
      schedulerName: default-scheduler
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
{{- end }}
