# -----------------------------------------------------------------------------------
# Deployment Manifest for the Smarter Celery Tool Worker (ADR-038)
#
# This file defines the Deployment resource for the Celery worker that serves the tools
# queue: the tool calls that the app has resolved, such as an API, SQL or MCP call or a web
# search page fetch, each with the credentials it needs. Extensions' calls go to the
# Extension worker, deployment-worker-extensions.yaml, instead (issue #1077). It
# runs what tool calls run, code and requests chosen by manifest authors, extension
# authors and the LLM, so it holds nothing else of the platform's:
#
# - its environment is its own Secret, secret-env-tools.yaml: the broker's and the
#   cache's url, and settings that aren't secret. No database, no Django or Fernet key,
#   no LLM provider's key, no AWS key (smarter.toolsEnv in _helpers.tpl);
# - its ServiceAccount, <appName>-tools, has no IAM role and no Kubernetes permissions,
#   and its token isn't mounted;
# - its pods are in the application-group <appName>-tools, not <appName>, so that the
#   platform's network policies don't apply to them. smarter-infrastructure's policies
#   for <appName>-tools let them reach Redis, MariaDB's port for SQL plugins, DNS and the
#   internet, and nothing else in the VPC.
#
# - Usage: Managed via Helm; values are set in values.yaml (workerTools). Off by
#   default. With it, the app's pods send their tool calls here
#   (SMARTER_APP_LLMTOOL_TOOL_RUNNER=remote, set by smarter.env).
# - The queue name must match env.SMARTER_APP_TOOLS_TASKS_CELERY_TASK_QUEUE.
# - No -E: task events would copy each call's arguments, its credentials, to the events
#   stream.
# - No database: no smarter.waitForDatabase init container.
# -----------------------------------------------------------------------------------
{{- $tools := .Values.workerTools | default dict }}
{{- if $tools.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}-worker-tools"
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
    meta.helm.sh/application-version: {{ .Chart.Version }}
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-worker-tools"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}-tools"
  name: "{{ .Values.global.appName }}-worker-tools"
  namespace: {{ .Values.namespace }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ $tools.replicaCount | default 2 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Values.global.appName }}-worker-tools"
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/env: "{{ include (print $.Template.BasePath "/secret-env-tools.yaml") . | sha256sum }}"
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}-worker-tools"
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}-tools"
        deploymentTimestamp: "{{ now | unixEpoch }}"
        meta.helm.sh/application-version: {{ .Chart.Version }}
    spec:
      serviceAccountName: "{{ $.Values.global.appName }}-tools"
      automountServiceAccountToken: false
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      containers:
        - name: "{{ .Values.global.appName }}-worker-tools"
          image: '{{ .Values.env.SMARTER_DOCKER_IMAGE | default (printf "%s:%s" .Values.global.image.repository .Values.global.image.tag) }}'
          command: ["celery", "-A", "smarter.workers.celery.app", "worker", "--concurrency={{ $tools.concurrency | default 4 }}", "--loglevel=info", "-Q", "{{ .Values.env.SMARTER_APP_TOOLS_TASKS_CELERY_TASK_QUEUE | default "tools_celery_task_queue" }}", "-n", "tools@%h", "--without-mingle", "--without-gossip", "--without-heartbeat"]
          imagePullPolicy: {{ .Values.global.image.pullPolicy | default "Always" }}
          resources:
            {{- toYaml ($tools.resources | default .Values.worker.resources) | nindent 12 }}
          # liveness looks for the worker's process. The other workers' pings the worker through Redis
          # (smarter.workers.liveness, #940), but the tool worker takes no remote control, and its Redis
          # user can't reach the channels that a ping uses (ADR-030, rule 8): a ping always fails, and
          # Kubernetes restarted it every four minutes (2026-11-27). A worker stuck on a dead connection,
          # #940's case, is caught by the broker's socket timeout and health check instead
          # (CELERY_BROKER_TRANSPORT_OPTIONS).
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # the tool worker's environment, from its own Secret in secret-env-tools.yaml
          envFrom:
            - secretRef:
                name: "{{ .Values.global.appName }}-env-tools"
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          # the platform's writable directories. Extensions are staged and extracted in /tmp.
          volumeMounts:
            {{- include "smarter.writableVolumeMounts" . | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        {{- include "smarter.writableVolumes" . | nindent 8 }}
      dnsPolicy: ClusterFirst
      # no service links: the tool worker has no use for the namespace's services' addresses.
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      shareProcessNamespace: false
{{- end }}
