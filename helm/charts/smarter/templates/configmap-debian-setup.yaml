# -----------------------------------------------------------------------------------
# ConfigMap Manifest for Debian Setup Script
#
# This file defines a ConfigMap containing the install.sh script for setting up
# a Debian-based Bastion or Job server in the Smarter project.
#
# - Maintainer: The Smarter Project, https://smarter.sh
# - Purpose: Provides a shell script to install required packages and AWS CLI.
# - Usage: Mounted into Bastion/Job Pods. install.sh installs the Bastion's
#   administration tools; install.sh --backup installs only what the MariaDB
#   backup Job needs (job-mysql-backup.yaml).
# - Notes: The AWS CLI version is pinned, and the download is verified against the
#   AWS CLI team's PGP signature. Set AWS_CLI_VERSION to install another version.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  namespace: {{ .Values.namespace }}
  name: debian-setup-script
data:
  install.sh: |
    #!/bin/bash
    ################################################################################
    # The Smarter Project - https://smarter.sh
    # install.sh
    #
    # This script installs the necessary packages and tools for the Smarter Bastion
    # Server. It is designed to be run on a minimal Debian-based Linux distribution
    # and will install the required packages and tools to enable basic administration
    # of the MariaDB database and AWS resources that are only accessible from within
    # the cluster.
    #
    # usage:
    #   install.sh            the Bastion's administration tools
    #   install.sh --backup   only what backup-to-s3.sh needs
    #
    # The output is kept short, because the backup Job emails it: package managers
    # and unzip run quietly, and their errors still go to stderr.
    ################################################################################
    set -euo pipefail

    # the AWS CLI release to install. Pinned, so that a new release can't change
    # or break the backup without a chart change.
    AWS_CLI_VERSION="${AWS_CLI_VERSION:-2.37.9}"

    # the fingerprint of the AWS CLI team's PGP key, from
    # https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html
    AWS_CLI_KEY_FINGERPRINT="FB5DB77FD5C118B80511ADA8A6310ACC4672475C"

    PACKAGES=(ca-certificates curl unzip gnupg mariadb-client)
    if [ "${1:-}" != "--backup" ]; then
      PACKAGES+=(less vim git openssh-client iputils-ping net-tools dnsutils htop lsof tcpdump
        wget rsync jq nano zip tar sudo procps traceroute socat iproute2)
    fi

    echo "Smarter Bastion/Job Server: Installing packages: ${PACKAGES[*]}"
    apt-get -qq update
    DEBIAN_FRONTEND=noninteractive apt-get -qq install -y --no-install-recommends "${PACKAGES[@]}" > /dev/null
    rm -rf /var/lib/apt/lists/*

    echo "Smarter Bastion/Job Server: Installing AWS CLI ${AWS_CLI_VERSION}"
    case "$(uname -m)" in
      x86_64) AWS_CLI_ARCH="x86_64" ;;
      aarch64 | arm64) AWS_CLI_ARCH="aarch64" ;;
      *) echo "FAILED: the AWS CLI has no Linux build for $(uname -m)"; exit 1 ;;
    esac
    AWS_CLI_ZIP_URL="https://awscli.amazonaws.com/awscli-exe-linux-${AWS_CLI_ARCH}-${AWS_CLI_VERSION}.zip"

    WORK_DIR="$(mktemp -d)"
    trap 'rm -rf "${WORK_DIR}"' EXIT
    curl -fsSL --retry 3 --retry-delay 2 "${AWS_CLI_ZIP_URL}" -o "${WORK_DIR}/awscliv2.zip"
    curl -fsSL --retry 3 --retry-delay 2 "${AWS_CLI_ZIP_URL}.sig" -o "${WORK_DIR}/awscliv2.zip.sig"

    # verify the download against the AWS CLI team's signature before running it.
    export GNUPGHOME="${WORK_DIR}/gnupg"
    mkdir -m 700 "${GNUPGHOME}"
    cat > "${WORK_DIR}/aws-cli.asc" <<'AWS_CLI_PUBLIC_KEY'
    -----BEGIN PGP PUBLIC KEY BLOCK-----

    mQINBF2Cr7UBEADJZHcgusOJl7ENSyumXh85z0TRV0xJorM2B/JL0kHOyigQluUG
