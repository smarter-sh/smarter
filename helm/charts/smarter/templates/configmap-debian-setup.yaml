    AWS_CLI_PUBLIC_KEY
    gpg --batch --quiet --import "${WORK_DIR}/aws-cli.asc" 2> /dev/null
    if ! gpg --batch --with-colons --fingerprint | grep -q "^fpr:::::::::${AWS_CLI_KEY_FINGERPRINT}:"; then
      echo "FAILED: the embedded AWS CLI public key does not have the fingerprint ${AWS_CLI_KEY_FINGERPRINT}"
      exit 1
    fi
    if ! gpg --batch --quiet --verify "${WORK_DIR}/awscliv2.zip.sig" "${WORK_DIR}/awscliv2.zip" 2> /dev/null; then
      echo "FAILED: ${AWS_CLI_ZIP_URL} does not match the AWS CLI team's signature"
      exit 1
    fi
    unset GNUPGHOME

    unzip -q "${WORK_DIR}/awscliv2.zip" -d "${WORK_DIR}"
    "${WORK_DIR}/aws/install" --update > /dev/null

    echo "Smarter Bastion/Job Server: Installed $(aws --version) and $(mariadb-dump --version)"
    echo "Smarter Bastion/Job Server: Setup script completed"
