# -----------------------------------------------------------------------------------
# Purpose: Secret that holds the user's own Django settings, .Values.djangoSettings.
#
# Its one key, settings.yaml, is .Values.djangoSettings as YAML. Every pod that loads
# Django's settings mounts it read-only at /home/smarter_user/user-settings/ (see
# smarter.userSettingsVolumes in _helpers.tpl), where smarter.settings.user applies it
# after all of Smarter's settings, so that each of its settings supersedes Smarter's in
# every environment. A DJANGO_<SETTING> variable in .Values.env supersedes it in turn.
#
# A Secret, not a ConfigMap, so that a setting may hold a password, e.g. a database's
# in DATABASES. Anyone who may read the namespace's Secrets may read it, as they may
# read secret-env.yaml's.
#
# The api's, workers' and beat's checksum/django-settings annotation changes when its
# content does, so that a changed setting rolls them.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.global.appName }}-django-settings"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-django-settings"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
type: Opaque
stringData:
  settings.yaml: |
    {{- toYaml (.Values.djangoSettings | default dict) | nindent 4 }}
