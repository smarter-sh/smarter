# -----------------------------------------------------------------------------------
# Purpose: Secret that holds the Extension worker's environment (issue #1077).
#
# The Extension worker, deployment-worker-extensions.yaml, reads this Secret, and not the
# platform's, secret-env.yaml: it holds only the Redis user extensions' credentials and the
# broker's url built from them, its queue, and a few settings that aren't secret. See
# smarter.extensionsEnv in _helpers.tpl.
# -----------------------------------------------------------------------------------
{{- if (.Values.workerTools | default dict).enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.global.appName }}-env-extensions"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-env-extensions"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}-tools"
type: Opaque
stringData:
  {{- range $key, $value := include "smarter.extensionsEnv" . | fromYaml }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
