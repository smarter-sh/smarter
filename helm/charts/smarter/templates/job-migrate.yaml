# -----------------------------------------------------------------------------------
# Job Manifest for Smarter Database Migrations, before an upgrade's rollout
#
# Runs `python manage.py migrate` as a Helm pre-upgrade hook, so that the new release's
# schema exists before its pods start and take requests. Without it, the new pods serve
# requests during the rollout with code that reads columns that the post-upgrade init
# Job (job-init.yaml) hasn't added yet, and answer 500 "Unknown column" until it does
# (smarter-sh/smarter#1007).
#
# - Purpose: migrate the database, and nothing else. Migrating the schema is part of
#   what Django needs to start, not platform initialization: that stays in job-init.yaml,
#   which runs `manage.py initialize_platform` after the rollout (CLAUDE.md, rule 10).
# - Usage: rendered when databaseInit.enabled is set in values.yaml, like job-init.yaml.
# - Upgrades only. A pre-install hook runs before any of the chart's resources exist,
#   including the Secret in secret-env.yaml that holds the database's credentials, so it
#   couldn't start. On a fresh install there are no older pods, and job-init.yaml creates
#   the database and its user, then migrates, while the new pods wait for it in their
#   init container (smarter.waitForDatabase in _helpers.tpl). On an upgrade, job-init.yaml's
#   migrate then finds nothing to do.
# - The Job reads the new release's settings, from secret-env-migrate.yaml, a pre-upgrade
#   hook Secret that Helm creates just before it. Not from secret-env.yaml: Helm applies that
#   one only after the pre-upgrade hooks, so the Job would run the new image with the
#   previous release's settings, and fail on every setting the release renamed.
# - The older pods run against the new schema until the rollout replaces them. That is safe
#   for additive migrations. A removal or a rename needs two releases: one whose code stops
#   reading the column, then one that drops it.
# - A failed migration fails `helm upgrade` before the rollout, so the older pods keep
#   serving, and the failed Job is kept for `kubectl logs`.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- if .Values.databaseInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-smarter-job-migrate-{{ now | unixEpoch }}"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-job-migrate"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
spec:
  # a migration that fails part way is not retried blindly: MariaDB's DDL isn't transactional.
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}-job-migrate"
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        jobTimestamp: "{{ now | unixEpoch }}"
    spec:
      serviceAccountName: "{{ $.Values.global.appName }}-job-migrate"
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      # migrations never call Kubernetes, so the Job's token isn't mounted.
      automountServiceAccountToken: false
      containers:
        - resources:
            requests:
              memory: "500Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
          command:
            - python
            - manage.py
            - migrate
            - --no-input
          # the new release's environment, from the hook Secret in secret-env-migrate.yaml (see above)
          envFrom:
            - secretRef:
                name: "{{ .Values.global.appName }}-env-migrate"
          env:
            # the kind of pod, which smarter_settings names, and checks, when it starts.
            - name: SERVICE_TYPE
              value: "job-migrate"
            {{- include "smarter.egressProxyEnv" $ | nindent 12 }}
            # no IAM role, by design (ADR-038): boto3 mustn't ask the node's metadata service for one.
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- range $env := .Values.api.env }}
            - name: {{ $env.name }}
              value: {{ $env.value | quote }}
            {{- end }}
          image: '{{ .Values.env.SMARTER_DOCKER_IMAGE | default (printf "%s:%s" .Values.global.image.repository .Values.global.image.tag) }}'
          imagePullPolicy: {{ .Values.global.image.pullPolicy | default "Always" }}
          name: "{{ .Values.global.appName }}-job-migrate"
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "smarter.writableVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "smarter.writableVolumes" . | nindent 8 }}
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
{{- end }}
