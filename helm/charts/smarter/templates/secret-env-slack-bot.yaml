# -----------------------------------------------------------------------------------
# Purpose: Secret that holds the optional Slack bot's tokens (ADR-038, phase 3).
#
# The Slack bot, the slack-bot subchart (slackBot.enabled), reads its two tokens from
# this Secret, <appName>-env-slack-bot, and from nothing else: the bot token,
# SMARTER_SUBSYSTEM_SLACK_BOT_TOKEN (xoxb-...), and the app-level token,
# SMARTER_SUBSYSTEM_SLACK_APP_TOKEN (xapp-...), which env sets. The bot isn't one of
# Smarter's kinds of pod and runs none of its code, so it gets no other setting, and
# no Smarter pod gets the app token (smarter.podEnv in _helpers.tpl).
# -----------------------------------------------------------------------------------
{{- if (.Values.slackBot | default dict).enabled }}
{{- $env := include "smarter.env" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.global.appName }}-env-slack-bot"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-env-slack-bot"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
type: Opaque
stringData:
  {{- range $key := list "SMARTER_SUBSYSTEM_SLACK_BOT_TOKEN" "SMARTER_SUBSYSTEM_SLACK_APP_TOKEN" }}
  {{- if hasKey $env $key }}
  {{ $key }}: {{ get $env $key | quote }}
  {{- end }}
  {{- end }}
{{- end }}
