# -----------------------------------------------------------------------------------
# Purpose: the platform's bootstrap secrets (issue #1099).
#
# One key per Smarter Secret that the init Job creates, named after it, e.g. openai_api_key, from
# .Values.bootstrapSecrets. Only the init Job, job-init.yaml, mounts it, as files, at
# smarter_settings.bootstrap_secrets_dir, where manage.py initialize_bootstrap_secrets turns each file
# into the Smarter admin's Secret of its name. Every service then reads that Secret, never an
# environment variable, and no other pod receives the values. An empty value is left out.
# -----------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.global.appName }}-bootstrap-secrets"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-bootstrap-secrets"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
type: Opaque
stringData:
  {{- range $name, $value := (.Values.bootstrapSecrets | default dict) }}
  {{- if $value }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
