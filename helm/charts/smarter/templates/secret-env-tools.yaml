# -----------------------------------------------------------------------------------
# Purpose: Secret that holds the tool worker's environment (ADR-038).
#
# The tool worker, deployment-worker-tools.yaml, reads this Secret, and not the
# platform's, secret-env.yaml: it holds only the broker's and the cache's url and a few
# settings that aren't secret. See smarter.toolsEnv in _helpers.tpl.
# -----------------------------------------------------------------------------------
{{- if (.Values.workerTools | default dict).enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.global.appName }}-env-tools"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-env-tools"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}-tools"
type: Opaque
stringData:
  {{- range $key, $value := include "smarter.toolsEnv" . | fromYaml }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
