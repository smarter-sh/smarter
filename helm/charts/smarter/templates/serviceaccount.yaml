###############################################################################
# The platform's ServiceAccounts
#
# {{ .Values.global.appName }}: the app, the Celery workers, beat and the init job.
#   - Kubernetes: kubectl, which Smarter runs to manage LLMClient ingresses,
#     LLMHosts and vectorstores, authenticates as this ServiceAccount, with
#     the Role in templates/rbac.yaml, and a read-only ClusterRole.
#   - AWS: with serviceAccount.awsRoleArn, the EKS pod identity webhook
#     gives the pods that IAM role (IRSA), and boto3 assumes it. Then the
#     pods need no AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY in env. Static
#     keys win over the role, so leave them out when the role is set.
#
# {{ .Values.global.appName }}-backup: the MariaDB backup CronJob. With
#   databaseScheduledBackup.awsRoleArn, its own IAM role, which only writes
#   the backups. It has no Kubernetes permissions.
#
# Both roles are created by smarter-infrastructure, one per environment.
###############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.global.appName }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  {{- with .Values.serviceAccount.awsRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ . }}"
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.global.appName }}-backup"
  namespace: "{{ .Release.Namespace }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-backup"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  {{- with .Values.databaseScheduledBackup.awsRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ . }}"
  {{- end }}
