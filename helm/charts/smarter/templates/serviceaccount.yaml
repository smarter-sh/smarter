###############################################################################
# The platform's ServiceAccounts: one per kind of pod (ADR-038, phase 3, #1084)
#
# {{ .Values.global.appName }}-<pod>: the app (api), smarter-worker (worker),
#   smarter-worker-infrastructure, Celery Beat, the init Job and the migrate Job.
#   - Kubernetes: kubectl, which Smarter runs to manage LLMClient ingresses,
#     LLMHosts and vectorstores, authenticates as the pod's ServiceAccount,
#     whose Role (templates/rbac.yaml) allows only what that kind of pod does.
#     Celery Beat and the migrate Job don't call Kubernetes, and mount no token.
#   - AWS: with serviceAccount.awsRoleArns, or awsRoleArn, the EKS pod identity
#     webhook gives the pods their kind's IAM role (IRSA), and boto3 assumes it.
#     Then the pods need no AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY in env.
#     Static keys win over the role, so leave them out when the role is set.
#     Each kind's role allows only what its code does in AWS (ADR-038, phase 3,
#     step 4). Celery Beat and the migrate Job make no AWS call: their
#     ServiceAccounts have no role.
#   The migrate Job's is a pre-upgrade hook, like its Secret
#   (secret-env-migrate.yaml): Helm runs the Job before it applies the
#   release's other resources, so a ServiceAccount among them wouldn't exist yet
#   on the first upgrade that names it.
#
# {{ .Values.global.appName }}-backup: the MariaDB backup CronJob. With
#   databaseScheduledBackup.awsRoleArn, its own IAM role, which only writes
#   the backups. It has no Kubernetes permissions.
#
# The IAM roles are created by smarter-infrastructure, one per environment.
###############################################################################
{{- $pods := list "api" "worker" "worker-infrastructure" "beat" }}
{{- if .Values.databaseInit.enabled }}
{{- $pods = append $pods "job-init" }}
{{- end }}
{{- range $index, $pod := $pods }}
{{- if $index }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ $.Values.global.appName }}-{{ $pod }}"
  namespace: "{{ $.Release.Namespace }}"
  labels:
    helm.sh/chart: "{{ $.Chart.Name }}-{{ $.Chart.Version }}"
    app.kubernetes.io/name: "{{ $.Values.global.appName }}-{{ $pod }}"
    app.kubernetes.io/application-group: "{{ $.Values.global.appName }}"
  {{- $roleArn := "" }}
  {{- if ne $pod "beat" }}
  {{- $roleArn = get ($.Values.serviceAccount.awsRoleArns | default dict) $pod | default $.Values.serviceAccount.awsRoleArn }}
  {{- end }}
  {{- with $roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ . }}"
  {{- end }}
{{- if eq $pod "beat" }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- if .Values.databaseInit.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.global.appName }}-job-migrate"
  namespace: "{{ .Release.Namespace }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-job-migrate"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  annotations:
    # before the migrate Job (job-migrate.yaml) and its Secret, and kept: a hook resource that
    # Helm deletes after the hook would be gone if the Job is retried by hand.
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.global.appName }}-backup"
  namespace: "{{ .Release.Namespace }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-backup"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  {{- with .Values.databaseScheduledBackup.awsRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ . }}"
  {{- end }}
{{- if (.Values.workerTools | default dict).enabled }}
---
# {{ .Values.global.appName }}-tools: the tool worker (ADR-038). No IAM role, no Kubernetes
#   permissions, and its token isn't mounted: the code that a tool call runs there has no
#   credential of the platform's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.global.appName }}-tools"
  namespace: "{{ .Release.Namespace }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-tools"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}-tools"
automountServiceAccountToken: false
{{- end }}
