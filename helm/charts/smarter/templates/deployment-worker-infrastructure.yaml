# -----------------------------------------------------------------------------------
# Deployment Manifest for the Smarter Celery Infrastructure Worker
#
# This file defines the Deployment resource for the Celery worker that serves the
# infrastructure queue: tasks that deploy, verify and destroy cloud, Kubernetes and
# DNS resources, such as an LLMClient's DNS record, ingress and certificate, an
# LLMHost's node group, or a vectorstore's database. They can take many minutes.
# They run in their own worker so that they never block the operational tasks of
# the {{ .Values.global.appName }}-worker, such as prompt history, charges and budgets.
#
# - Usage: Managed via Helm; values are set in values.yaml (workerInfrastructure),
#   and default to those of the worker.
# - The queue name must match env.SMARTER_INFRASTRUCTURE_TASKS_CELERY_TASK_QUEUE.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- $infra := .Values.workerInfrastructure | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}-worker-infrastructure"
    meta.helm.sh/release-namespace: {{ .Values.namespace }}
    meta.helm.sh/application-version: {{ .Chart.Version }}
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-worker-infrastructure"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  name: "{{ .Values.global.appName }}-worker-infrastructure"
  namespace: {{ .Values.namespace }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ $infra.replicaCount | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Values.global.appName }}-worker-infrastructure"
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}-worker-infrastructure"
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        deploymentTimestamp: "{{ now | unixEpoch }}"
        meta.helm.sh/application-version: {{ .Chart.Version }}
    spec:
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      containers:
        - name: "{{ .Values.global.appName }}-worker-infrastructure"
          image: '{{ .Values.env.SMARTER_DOCKER_IMAGE | default (printf "%s:%s" .Values.global.image.repository .Values.global.image.tag) }}'
          command: ["celery", "-A", "smarter.workers.celery.app", "worker", "--concurrency=4", "--loglevel=info", "-Q", "{{ .Values.env.SMARTER_INFRASTRUCTURE_TASKS_CELERY_TASK_QUEUE | default "infrastructure_celery_task_queue" }}", "-E", "-n", "infrastructure@%h"]
          imagePullPolicy: {{ .Values.global.image.pullPolicy | default "Always" }}
          resources:
            {{- toYaml ($infra.resources | default .Values.worker.resources) | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $env := .Values.worker.env }}
            - name: {{ $env.name }}
              value: {{ $env.value | quote }}
            {{- end }}
          volumeMounts:
            {{- toYaml .Values.worker.extraVolumeMounts | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        {{- toYaml .Values.worker.extraVolumes | nindent 8 }}
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      shareProcessNamespace: false
