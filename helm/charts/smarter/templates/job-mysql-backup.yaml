# -----------------------------------------------------------------------------------
# Purpose: CronJob to perform scheduled MariaDB database backups to S3.
#
# This file defines a Kubernetes CronJob that runs a backup script
# to back up the MariaDB database. The backup script is stored in a
# ConfigMap and mounted into the Job. The backup runs on a Debian image,
# installs only the tools it needs (install.sh --backup: the MariaDB client and a
# pinned, signature-verified AWS CLI), and executes the backup script.
#
# databaseScheduledBackup in values.yaml sets the S3 location (s3Uri, by default
# s3://$SMARTER_S3_BUCKET/backups/sql) and awsCliVersion. The backup dumps the
# database as the read-only account SMARTER_MYSQL_BACKUP_USERNAME (smarter_backup),
# which job-init.yaml creates when SMARTER_MYSQL_BACKUP_PASSWORD is set. Until it is
# set, the backup dumps as the root account. The backup container receives only the
# environment variables that the backup needs.
#
# When the backup completes, the Job emails the result, with the backup's log
# attached, in the same way that job-init.yaml does: with manage.py email_job_log,
# to databaseScheduledBackup.notifyEmail, or to smarter_settings.email_admin, and
# posts it to the Slack channel databaseScheduledBackup.notifySlackChannel, if any,
# with the log in the message's thread. A successful backup's email and Slack
# message name the backup file, its size and where in S3 it was saved. The Debian image has no Django, so the backup runs as an init container,
# which writes its log, exit status and summary to a shared volume, and always exits
# 0, so that the email container runs after a failed backup too. The email
# container then exits with the backup's status. A failed backup fails the pod, and
# the Job retries it in a new pod, up to backoffLimit times, each of which emails.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- if .Values.databaseScheduledBackup.enabled }}
{{- $backupPassword := .Values.env.SMARTER_MYSQL_BACKUP_PASSWORD | default "" }}
{{- $useBackupAccount := and $backupPassword (not (hasPrefix "SET-ME" $backupPassword)) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Values.global.appName }}-mysql-backup"
  namespace: "{{ .Values.namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}-mysql-backup"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
spec:
  schedule: {{ .Values.databaseScheduledBackup.schedule | quote }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: "{{ .Values.global.appName }}-mysql-backup"
            app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        spec:
          affinity:
            {{- toYaml .Values.global.affinity | nindent 12 }}
          tolerations:
            {{- toYaml .Values.global.tolerations | nindent 12 }}
          automountServiceAccountToken: true

          volumes:
            - name: debian-setup-script
              configMap:
                name: debian-setup-script
                defaultMode: 0755
            - name: mysql-backup-script
              configMap:
                name: mysql-backup-script
                defaultMode: 0755
            - name: job-log
              emptyDir: {}
            {{- include "smarter.writableVolumes" . | nindent 12 }}

          initContainers:
            - name: mysql-backup
              # the current Debian stable release: a pinned release, e.g. bullseye, stops installing
              # once its packages leave the security mirror, at the end of its long-term support.
              image: debian:stable-slim
              workingDir: /home/
              command:
                - /bin/bash
                - -c
                - |
                    # The backup's output is also written to /job/backup.log, which the email
                    # container sends. The steps run in a subshell (they are piped to tee), so
                    # their exit status is passed back in a file. This container always exits 0.
                    {
                      echo "Waiting for configMap mounts..."
                      for i in $(seq 1 10); do
                        if [ -f /home/setup/install.sh ]; then break; fi
                        echo "Still waiting..."
                        sleep 1
                      done

                      ls -l /home/setup || true
                      ls -l /home/backup || true

                      /home/setup/install.sh --backup && /home/backup/backup-to-s3.sh
                      status=$?
                      if [ $status -eq 0 ]; then
                        echo "Backup completed successfully!"
                      else
                        echo "FAILED: the backup exited with status $status"
                      fi
                      echo $status > /job/backup.status
                    } 2>&1 | tee /job/backup.log
                    exit 0

              imagePullPolicy: {{ .Values.global.image.pullPolicy | default "Always" }}

              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 512Mi
              volumeMounts:
                - name: debian-setup-script
                  mountPath: /home/setup/install.sh
                  subPath: install.sh
                - name: mysql-backup-script
                  mountPath: /home/backup/backup-to-s3.sh
                  subPath: backup-to-s3.sh
                - name: job-log
                  mountPath: /job

              # only what the backup needs: the database, the backup account, the S3 location
              # and the AWS credentials, not the platform's other secrets. The root account is
              # passed only when no backup account is configured (SMARTER_MYSQL_BACKUP_PASSWORD).
              # The passwords and AWS keys are read from the Secret in secret-env.yaml.
              env:
                - name: SMARTER_MYSQL_HOST
                  value: {{ .Values.env.SMARTER_MYSQL_HOST | quote }}
                - name: SMARTER_MYSQL_PORT
                  value: {{ .Values.env.SMARTER_MYSQL_PORT | default "3306" | quote }}
                - name: SMARTER_MYSQL_DATABASE
                  value: {{ .Values.env.SMARTER_MYSQL_DATABASE | quote }}
                {{- if $useBackupAccount }}
                - name: SMARTER_MYSQL_BACKUP_USERNAME
                  value: {{ .Values.env.SMARTER_MYSQL_BACKUP_USERNAME | default "smarter_backup" | quote }}
                - name: SMARTER_MYSQL_BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "{{ $.Values.global.appName }}-env"
                      key: SMARTER_MYSQL_BACKUP_PASSWORD
                      optional: true
                {{- else }}
                - name: SMARTER_MYSQL_ROOT_USERNAME
                  value: {{ .Values.env.SMARTER_MYSQL_ROOT_USERNAME | quote }}
                - name: SMARTER_MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "{{ $.Values.global.appName }}-env"
                      key: SMARTER_MYSQL_ROOT_PASSWORD
                      optional: true
                {{- end }}
                - name: SMARTER_S3_BUCKET
                  value: {{ .Values.env.SMARTER_S3_BUCKET | default "" | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: "{{ $.Values.global.appName }}-env"
                      key: AWS_ACCESS_KEY_ID
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: "{{ $.Values.global.appName }}-env"
                      key: AWS_SECRET_ACCESS_KEY
                      optional: true
                - name: AWS_REGION
                  value: {{ .Values.env.AWS_REGION | quote }}
                - name: BACKUP_SUMMARY_FILE
                  value: /job/backup-summary.txt
                {{- with .Values.databaseScheduledBackup }}
                {{- if .s3Uri }}
                - name: SMARTER_MYSQL_BACKUP_S3_URI
                  value: {{ .s3Uri | quote }}
                {{- end }}
                {{- if .awsCliVersion }}
                - name: AWS_CLI_VERSION
                  value: {{ .awsCliVersion | quote }}
                {{- end }}
                {{- end }}

          containers:
            - name: email-backup-log
              image: '{{ .Values.env.SMARTER_DOCKER_IMAGE | default (printf "%s:%s" .Values.global.image.repository .Values.global.image.tag) }}'
              imagePullPolicy: {{ .Values.global.image.pullPolicy | default "Always" }}
              command:
                - /bin/sh
                - -c
              args:
                - |
                  # a backup that never wrote its status, e.g. one killed for running out of memory, failed.
                  status=$(cat /job/backup.status 2>/dev/null || echo 1)
                  python manage.py email_job_log --file /job/backup.log --summary /job/backup-summary.txt --job "{{ .Values.global.appName }}-mysql-backup {{ .Chart.Version }}" --status "$status" --to "{{ .Values.databaseScheduledBackup.notifyEmail | default "" }}" --slack-channel "{{ .Values.databaseScheduledBackup.notifySlackChannel | default "" }}" || true
                  exit $status
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              # The pod's security context would also apply to the Debian init container, which
              # installs packages as root, so the Smarter image's settings are set here instead.
              securityContext:
                {{- toYaml (merge (deepCopy .Values.global.containerSecurityContext) .Values.global.podSecurityContext) | nindent 16 }}
              volumeMounts:
                - name: job-log
                  mountPath: /job
                  readOnly: true
                {{- include "smarter.writableVolumeMounts" . | nindent 16 }}
              # the platform's environment, from the Secret in secret-env.yaml
              envFrom:
                - secretRef:
                    name: "{{ .Values.global.appName }}-env"
              env:
                {{- range $env := .Values.app.env }}
                - name: {{ $env.name }}
                  value: {{ $env.value | quote }}
                {{- end }}

          restartPolicy: Never
{{- end }}
