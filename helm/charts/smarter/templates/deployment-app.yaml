# -----------------------------------------------------------------------------------
# Deployment Manifest for Smarter Application
#
# This file defines the main Deployment resource for the Smarter app.
#
# - Maintainer: <your team/contact>
# - Purpose: Deploys the main application container with Helm templating.
# - Usage: Managed via Helm; values are set in values.yaml.
# - Notes: Update resource requests/limits and environment variables as needed.
#   The uvicorn worker count and concurrency limit come from app.workers and
#   app.limitConcurrency in values.yaml.
#
# Important: labels are referenced by other resources, in this repo as well as
# external repos including https://github.com/smarter-sh/smarter-infrastructure.
# Do not arbitrarily change labels without updating all references.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    meta.helm.sh/release-name: "{{ .Values.global.appName }}"
    meta.helm.sh/release-namespace: "{{ .Values.namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/name: "{{ .Values.global.appName }}"
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  name: "{{ .Values.global.appName }}"
  namespace: "{{ .Values.namespace }}"
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.app.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Values.global.appName }}"
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/env: "{{ include (print $.Template.BasePath "/secret-env.yaml") . | sha256sum }}"
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}"
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        meta.helm.sh/application-version: "{{ .Chart.Version }}"
        deploymentTimestamp: "{{ now | unixEpoch }}"
    spec:
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      containers:
        - name: "{{ .Values.global.appName }}"
          image: '{{ .Values.env.SMARTER_DOCKER_IMAGE | default (printf "%s:%s" .Values.global.image.repository .Values.global.image.tag) }}'
          command:
            - "uvicorn"
            - "smarter.asgi:application"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "{{ .Values.deployment.containerPort }}"
            - "--workers={{ .Values.app.workers | default 2 }}"
            {{- if .Values.app.limitConcurrency }}
            - "--limit-concurrency={{ .Values.app.limitConcurrency }}"
            {{- end }}
            - "--timeout-keep-alive=15"
            - "--timeout-graceful-shutdown=30"
          imagePullPolicy: '{{ .Values.global.image.pullPolicy | default "Always" }}'
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          # the platform's environment, from the Secret in secret-env.yaml
          envFrom:
            - secretRef:
                name: "{{ .Values.global.appName }}-env"
          env:
            {{- range $env := .Values.app.env }}
            - name: {{ $env.name }}
              value: {{ $env.value | quote }}
            {{- end }}
            {{- /* Web server only: see app.databaseReadTimeout in values.yaml. */}}
            {{- if .Values.app.databaseReadTimeout }}
            - name: SMARTER_DATABASE_READ_TIMEOUT
              value: {{ .Values.app.databaseReadTimeout | quote }}
            {{- end }}
          volumeMounts:
            {{- toYaml .Values.app.extraVolumeMounts | nindent 12 }}
          # The probes, tuned for a server that loads in about 10 seconds:
          #
          # - startupProbe: /healthz/ is answered in asgi.py, before Django (see
          #   smarter.lib.django.healthz), as soon as a uvicorn worker has loaded the app. It is
          #   checked every 2 seconds, so the pod starts as soon as it's up, with a budget of
          #   5 + 2 x 90 seconds for a slow start. Liveness and readiness wait for it.
          # - readinessProbe: /readiness/ goes through Django and its middleware, so the pod takes
          #   traffic once it can serve it, and is taken out of the service, not restarted, while
          #   it can't, e.g. while its Redis or database stalls.
          # - livenessProbe: restarts a pod whose process is hung. /healthz/ needs no thread, query
          #   or cache lookup, so a busy pod still answers it in milliseconds.
          startupProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.deployment.containerPort }}
              httpHeaders:
              - name: Host
                value: localhost
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readiness/
              port: {{ .Values.deployment.containerPort }}
              httpHeaders:
              - name: Host
                value: localhost
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.deployment.containerPort }}
              httpHeaders:
              - name: Host
                value: localhost
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # the service stops sending new requests to a terminating pod a few seconds after it is
          # told to stop. preStop waits for that, before uvicorn stops accepting connections, and
          # terminationGracePeriodSeconds leaves room for uvicorn's 30 second graceful shutdown.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - containerPort: {{ .Values.deployment.containerPort }}
              protocol: TCP
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        {{- toYaml .Values.app.extraVolumes | nindent 8 }}
      terminationGracePeriodSeconds: 45
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      shareProcessNamespace: false
