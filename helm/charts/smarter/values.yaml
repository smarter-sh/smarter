# -----------------------------------------------------------------------------
# Global Configuration
# -----------------------------------------------------------------------------
global:
  appName: smarter
  image:
    pullPolicy: Always
    repository: lpm0073/smarter
    tag: v9999.9999.9999.dev9999
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-group
                operator: In
                values:
                  - smarter
  defaultStorageClass: gp3
  imagePullSecrets:
    - name: dockerhub-secret

  tolerations:
    - key: "node-group"
      operator: "Equal"
      value: "smarter"
      effect: "NoSchedule"

  # The security contexts of the pods that run the Smarter image: the app, the Celery
  # workers, beat and the init job. They run as smarter_user, the user that the Dockerfile
  # creates (uid and gid 1000), which reads the image's code through its group. runAsGroup
  # must stay 1000: with only runAsUser set, the process's group would be root's, and it
  # could not read the code. The root filesystem is read-only; the directories that the
  # processes write are emptyDirs (templates/_helpers.tpl, smarter.writableVolumes).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL


# -----------------------------------------------------------------------------
# Smarter Application Configuration
# -----------------------------------------------------------------------------
app:
  replicaCount: 2
  # The number of uvicorn worker processes in each app pod (uvicorn --workers). Each worker
  # is a separate Python process that loads all of Django, about 420 MB at rest, and runs
  # Python on at most one core at a time, so match it to resources.requests.cpu (one worker
  # per core) and grow resources.requests.memory with it. Django's synchronous code runs on
  # a thread pool inside each worker, so a worker that waits on an LLM provider keeps
  # serving other requests. Capacity beyond that comes from more pods (hpa), not more
  # workers per pod.
  workers: 2
  # The most concurrent connections and tasks that each uvicorn worker accepts
  # (uvicorn --limit-concurrency). Above it, uvicorn answers 503 at once instead of
  # accepting the request. Without a limit, every request gets its own thread for
  # Django's synchronous code, so under load a pod accepts work until it runs out
  # of memory and is killed, dropping every request in flight. With a limit, an
  # overloaded pod sheds the excess, its CPU and memory stay bounded, and the
  # HorizontalPodAutoscaler adds pods. Leave it empty to disable the limit.
  limitConcurrency: 100
  # Seconds that the web server waits for the platform database to answer a read or
  # a write (env SMARTER_DATABASE_READ_TIMEOUT, PyMySQL's read_timeout and
  # write_timeout). A query that the database never answers would otherwise hold
  # the request's thread forever. Rendered only into the app Deployment, never
  # into app.env or the global env map: app.env also reaches the init job and the
  # backup job's email container, and the workers, beat and the init job run
  # migrations, management commands and tasks that can legitimately take longer
  # than a web request. Leave it empty for no timeout.
  databaseReadTimeout: 60
  # Threads in each uvicorn worker that run streamed chat prompts (env
  # SMARTER_PROMPT_THREADS). A prompt holds its thread while it waits on the LLM
  # and its tools, so a worker runs this many prompts at once and queues the next
  # ones. The pool is the prompts' own, apart from the event loop's default
  # executor (6 threads on a 2-vCPU node), where Django renders error pages.
  # Keep it below limitConcurrency. Rendered only into the app Deployment: only
  # the web server streams prompts. Leave it empty for the default, 32.
  promptThreads: 32
  resources:
    requests:
      # One core per uvicorn worker (app.workers).
      cpu: "1"
      # About 420 MB for each of the 2 uvicorn workers (app.workers), plus headroom for
      # the threads and buffers of requests in flight. The scheduler only places a pod
      # on a node with this much memory free, and the HorizontalPodAutoscaler measures
      # memory utilization against it.
      memory: "1280Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  extraVolumeMounts: []
  # A PodDisruptionBudget that keeps voluntary disruptions (node drains, cluster
  # upgrades, Karpenter or cluster-autoscaler consolidation) from evicting more than
  # maxUnavailable app pods at a time. See templates/pdb-app.yaml.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

names:
  mysqlName: mysql
  mariadbName: mariadb

service:
  port: 8000
  targetPort: 8000

# Memory requests match what the processes use once they are running, because the
# scheduler places pods by their requests. Requests below real use let it put too many
# pods on one node, which then runs out of memory, and the kubelet evicts the pods that
# use the most memory above their requests. Each Celery worker process loads Django;
# the infrastructure worker used about 1.1Gi with 4 of them, and beat about 380Mi.
worker:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "1280Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# The Celery worker of the infrastructure queue, which deploys, verifies and destroys
# cloud, Kubernetes and DNS resources. See templates/deployment-worker-infrastructure.yaml.
workerInfrastructure:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "1280Mi"
    limits:
      # 2, the minimum that Django settings recommend. Each of its 4 concurrent tasks runs kubectl and
      # the aws cli, which are CPU bound while they start, and slowed one another down on 1.
      cpu: "2"
      memory: "2Gi"

beat:
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

database:
  type: mysql   # Options: mysql, mariadb, external

## @param deployTimestamp Deployment timestamp for forcing pod restarts
deployTimestamp: ""

deployment:
  containerPort: 8000

# -----------------------------------------------------------------------------
# Horizontal Pod Autoscaler Configuration
# ----------------------------------------------------------------------------
# minReplicas, targetMemoryUtilizationPercentage and behavior apply to the app's
# HorizontalPodAutoscaler (templates/hpa-app.yaml); maxReplicas and
# targetCPUUtilizationPercentage apply to it and to the Celery worker's
# (templates/hpa-worker.yaml).
hpa:
  minReplicas: 3
  maxReplicas: 25
  targetCPUUtilizationPercentage: 75
  # Measured against app.resources.requests.memory. The 2 uvicorn workers of an idle
  # pod already use about 66% of their 1280Mi request, and Python rarely returns memory
  # to the operating system, so a lower target would keep the app scaled out after
  # the load is gone. Leave it empty to scale on CPU only.
  targetMemoryUtilizationPercentage: 90
  # Rendered as the autoscaling/v2 spec.behavior of the app's HorizontalPodAutoscaler.
  # Scale up by up to 100% a minute; scale down only after 5 minutes of lower load.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

# -----------------------------------------------------------------------------
# Backing Services Configuration
# -----------------------------------------------------------------------------
databaseInit:
  enabled: true   # post-install/post-upgrade Job: create db + user, migrate, initialize platform
  notifyEmail: "" # the Job emails its log here when it completes. Empty: smarter_settings.email_admin
  # the Slack channel, e.g. smarter, that the Job also posts its outcome to, with its log in the message's
  # thread. Empty: don't post. Needs env.SMARTER_SLACK_BOT_TOKEN, and a bot with the scopes chat:write and
  # files:write that is a member of the channel.
  notifySlackChannel: ""

databaseScheduledBackup:
  enabled: true
  schedule: "0 2 * * *" # Every day at 2am UTC
  notifyEmail: ""        # the Job emails the backup's result and log here. Empty: smarter_settings.email_admin
  # the Slack channel, e.g. smarter, that the Job also posts the backup's result to, with its log in the
  # message's thread. Empty: don't post. Needs env.SMARTER_SLACK_BOT_TOKEN, and a bot with the scopes
  # chat:write and files:write that is a member of the channel.
  notifySlackChannel: ""
  # where backups are uploaded, e.g. s3://my-private-bucket/backups/sql. Empty: s3://<env.SMARTER_S3_BUCKET>/backups/sql.
  # Use a private bucket: the backup is a full copy of the database. The environment bucket that
  # serves static assets is often public-read, so don't rely on the default there.
  s3Uri: ""
  awsCliVersion: ""      # the AWS CLI release to install. Empty: the version pinned in configmap-debian-setup.yaml

# -----------------------------------------------------------------------------
# Optional Slack bot (the slack-bot subchart, helm/charts/slack-bot)
# -----------------------------------------------------------------------------
# A single pod that answers questions in a Slack workspace with a deployed
# LLMClient, through its chat api. It connects to Slack with Socket Mode, so it
# needs no Ingress. It reads env.SMARTER_SLACK_BOT_TOKEN and
# env.SMARTER_SLACK_APP_TOKEN. Enable it in one environment only: two bots with
# the same Slack app would each receive part of the messages. The deploy workflow
# enables it in prod only, when the repository secrets SLACK_BOT_TOKEN,
# SLACK_APP_TOKEN and SLACK_BOT_AGENT_URL are set.
# See helm/charts/slack-bot/values.yaml for the other values.
slackBot:
  enabled: false
  # The deployed LLMClient that answers, e.g.
  # https://smarter-developer.<account-number>.api.<root-domain>/. Required when enabled.
  agentUrl: ""

externalDatabase:
  host: ""        # Will use .Values.env.SMARTER_MYSQL_HOST if empty
  port: 3306      # Will use .Values.env.SMARTER_MYSQL_PORT if empty
  database: ""    # Will use .Values.env.SMARTER_MYSQL_DATABASE if empty
  username: ""    # Will use .Values.env.SMARTER_MYSQL_USER if empty
  password: ""    # Will use .Values.env.SMARTER_MYSQL_PASSWORD if empty

mysql:
  enabled: false
  nameOverride: "mariadb"               # every resource becomes <release>-mariadb = smarter-mariadb
  primary:
    # Smarter stores emoji and other 4-byte characters (prompts, manifests,
    # chat history), which need utf8mb4. The Bitnami chart's default my.cnf sets
    # character-set-server=UTF8, which is the 3-byte utf8mb3. Command-line flags
    # take precedence over my.cnf.
    extraFlags: "--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  image:
    pullPolicy: Always
  initdbScripts: {}
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  nodeSelector: {}
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: "gp3"
    accessModes:
      - ReadWriteOnce
  podSecurityContext:
    enabled: true
    fsGroup: 1001
  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1"
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

mariadb:
  enabled: true
  nameOverride: "mariadb"               # every resource becomes <release>-mariadb = smarter-mariadb
  primary:
    # Smarter stores emoji and other 4-byte characters (prompts, manifests,
    # chat history), which need utf8mb4. The Bitnami chart's default my.cnf sets
    # character-set-server=UTF8, which is the 3-byte utf8mb3. Command-line flags
    # take precedence over my.cnf. The init Job also creates the database, or
    # alters it, with utf8mb4 as its default.
    extraFlags: "--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
    podLabels:
      app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
    image:
      pullPolicy: Always
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    nodeSelector: {}
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "gp3"
      accessModes:
        - ReadWriteOnce


# -----------------------------------------------------------------------------
# Redis Configuration
# -----------------------------------------------------------------------------
redis:
  enabled: true
  external:
    host: ""
    port: 6379
    password: ""
  fullnameOverride: "smarter-redis"
  auth:
    enabled: true
    password: "smarter"
  architecture: standalone
  master:
    disableCommands: []
    podLabels:
      app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
    containerSecurityContext:
      enabled: true
    persistence:
      enabled: true
      size: 10Gi
      storageClass: gp3
    podSecurityContext:
      enabled: true
    resources:
      requests:
        cpu: "250m"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "4Gi"
    service:
      headless:
        sessionAffinity: None
  replica:
    disableCommands: []
    podLabels:
      app.kubernetes.io/application-group: "{{ .Values.global.appName }}"


# ----------------------------------------------------------------------------
# Monitoring Components
# Enable/disable and configure Prometheus, Grafana, and Loki
# ----------------------------------------------------------------------------
prometheus:
  enabled: false
  server:
    podLabels:
      app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
    persistentVolume:
      enabled: false  # For demo/dev. Set to true and configure storage for production.

grafana:
  enabled: false
  podLabels:
    app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  adminPassword: "admin"  # Change for production!
  persistence:
    enabled: false  # For demo/dev. Set to true and configure storage for production.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-server
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100

loki:
  enabled: false
  podLabels:
      app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
  persistence:
    enabled: false  # For demo/dev. Set to true and configure storage for production.
