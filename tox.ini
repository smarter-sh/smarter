#------------------------------------------------------------------------------
# tox: run Smarter's Python linters in isolated virtual environments.
#
#   tox            # flake8 and pylint
#   tox -e flake8  # one of them
#
# The unit tests don't run here: they need the smarter-app Docker container,
# with its MariaDB and Redis. Run them with `make docker-test` or
# `make coverage`. The pre-commit hooks (.pre-commit-config.yaml) are the lint
# standard; these environments run the same flake8 configuration (.flake8),
# and pylint (.pylintrc) as `make python-lint` does.
#------------------------------------------------------------------------------
[tox]
envlist = flake8,pylint
skip_missing_interpreters = true

[testenv:flake8]
skip_install = true
deps = flake8
commands = flake8 smarter/smarter

[testenv:pylint]
skip_install = true
deps = -rsmarter/requirements/local.txt
commands = pylint smarter/smarter
