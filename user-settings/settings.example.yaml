# LOCAL DEVELOPMENT ONLY. NOT for prod, alpha, or any other environment on AWS:
# for those, use DJANGO_<SETTING> variables in env in helm/charts/smarter/values.yaml.
# -----------------------------------------------------------------------------
# Your own Django settings, for your local Docker Compose containers.
#
# WARNING: a user-defined setting is a hammer. It replaces Smarter's value of
# that setting outright, however carefully that value was built. Many of
# Smarter's settings are computed per environment (the database, the caches,
# storage, allowed hosts, CORS and CSRF origins, cookie security, the Content
# Security Policy), and nothing derived from the old value is computed again.
# A list or dictionary is replaced whole, not merged. Only the type is
# checked, never the meaning: a wrong value can stop the platform, or quietly
# weaken its security. Read how Smarter sets a setting in
# smarter/smarter/settings/ before you override it, prefer a SMARTER_* setting
# where one exists, and change as few as you can.
#
# Only your local Docker Compose containers read this directory: it is never
# built into the Docker image, and the deployed pods never see it.
#
# Copy this file to user-settings/settings.yaml (which git ignores), then
# uncomment and edit the settings that you want. Every setting in it
# supersedes Smarter's value of that setting, in every environment:
# smarter/smarter/settings/base.py, base_aws.py and the environment's own module
# (local.py here). A DJANGO_<SETTING> environment variable, e.g. in .env,
# supersedes this file in turn.
#
# - Keys are Django setting names, in upper case.
# - A value replaces Smarter's whole setting. A list or a dictionary, such as
#   LOGGING or CACHES, is not merged with Smarter's: write all of it.
# - Docker Compose mounts this directory read-only into smarter-api and the
#   worker and beat containers. Restart them to pick up a change:
#   docker compose restart smarter-api smarter-worker smarter-worker-infrastructure smarter-beat
#
# On Kubernetes, write each setting as a DJANGO_* variable in env in the Helm
# chart's values. See https://docs.smarter.sh, Configuration, User-Defined
# Django Settings.
#
# Below is one example of each kind of value. Each one also shows the same
# setting as a DJANGO_* environment variable, where one can express it.
# -----------------------------------------------------------------------------

# --- An integer ---------------------------------------------------------------
# Sign users out after an hour.
# SESSION_COOKIE_AGE: 3600
#   as a variable: DJANGO_SESSION_COOKIE_AGE=3600

# --- A float ------------------------------------------------------------------
# A setting of a package of your own: Smarter logs a warning for a name that
# neither Django nor Smarter defines, in case it is a typo, and sets it anyway.
# MY_PACKAGE_SAMPLE_RATE: 0.25
#   as a variable: DJANGO_MY_PACKAGE_SAMPLE_RATE=0.25

# --- A boolean ----------------------------------------------------------------
# true or false, unquoted. (YAML also reads yes, no, on and off as booleans.)
# SESSION_COOKIE_SECURE: true
# APPEND_SLASH: false
#   as a variable: DJANGO_SESSION_COOKIE_SECURE=true  (1, true, yes or on is true; anything else is false)

# --- A string -----------------------------------------------------------------
# TIME_ZONE: America/Vancouver
# DEFAULT_FROM_EMAIL: "Smarter <no-reply@example.com>"
#   as a variable: DJANGO_TIME_ZONE=America/Vancouver
#
# Quote a string that YAML would read as something else: a number, a boolean,
# null, or a value that starts with a special character such as @, * or {.
# SECURE_REFERRER_POLICY: "same-origin"
# MY_PACKAGE_VERSION_LABEL: "1.10"     # unquoted, YAML reads the float 1.1
# MY_PACKAGE_ANSWER: "no"              # unquoted, YAML reads the boolean false

# --- A string on several lines ------------------------------------------------
# | keeps the line breaks; > folds them into spaces.
# MY_PACKAGE_BANNER: |
#   This platform is for authorized users only.
#   Activity is logged.

# --- None ---------------------------------------------------------------------
# null (or ~) is Python's None.
# SECURE_PROXY_SSL_HEADER: null
#   as a variable: DJANGO_SECURE_PROXY_SSL_HEADER=None

# --- A list of strings --------------------------------------------------------
# Either one item per line:
# ADMINS:
#   - ops@example.com
#   - oncall@example.com
# or in brackets, on one line:
# SILENCED_SYSTEM_CHECKS: ["security.W001", "security.W003"]
#   as a variable: DJANGO_SILENCED_SYSTEM_CHECKS=security.W001,security.W003
#   (comma-separated for a setting that is a list; a JSON list also works:
#   DJANGO_SILENCED_SYSTEM_CHECKS='["security.W001", "security.W003"]')

# --- An empty list or dictionary ----------------------------------------------
# INTERNAL_IPS: []
# MESSAGE_TAGS: {}

# --- A tuple, or a list of pairs ----------------------------------------------
# YAML has no tuples: write a list. Django accepts a list wherever it takes a
# tuple, e.g. SECURE_PROXY_SSL_HEADER's (header, value) pair.
# SECURE_PROXY_SSL_HEADER: ["HTTP_X_FORWARDED_PROTO", "https"]
# LANGUAGES:
#   - ["en", "English"]
#   - ["es", "Spanish"]
#   as a variable: DJANGO_SECURE_PROXY_SSL_HEADER='("HTTP_X_FORWARDED_PROTO", "https")'  (a Python literal)

# --- A dictionary -------------------------------------------------------------
# Keys are strings unless YAML reads them as something else: MESSAGE_TAGS's
# keys are the integers of Django's message levels.
# MESSAGE_TAGS:
#   40: danger
#   30: warning
#   as a variable: DJANGO_MESSAGE_TAGS='{"40": "danger"}' is not the same: JSON keys are
#   always strings. Use a Python literal for integer keys: DJANGO_MESSAGE_TAGS='{40: "danger"}'

# --- A nested dictionary, with lists inside -----------------------------------
# This replaces Smarter's whole Content Security Policy.
# SECURE_CSP_REPORT_ONLY:
#   default-src: ["'self'"]
#   script-src: ["'self'", "https://cdn.example.com"]
#   img-src: ["'self'", "data:", "https:"]
#   object-src: ["'none'"]
#   report-uri: ["https://platform.example.com/csp-report/"]
#   as a variable, the whole dictionary as JSON on one line, which is hard to
#   (read, and to quote in a shell: prefer the file for nested settings.)

# --- A Python object, such as a class or a function ---------------------------
# YAML can't hold one. Django settings name them by their dotted path, as a
# string, and import them themselves.
# TEST_RUNNER: django.test.runner.DiscoverRunner
