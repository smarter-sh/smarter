[mypy]
# pydantic.mypy types a model's constructor by its field names and aliases, as Pydantic accepts them
# with validate_by_name, rather than by its aliases only.
plugins = mypy_django_plugin.main, pydantic.mypy
# third-party packages without type information, e.g. knox and taggit, are treated as untyped.
ignore_missing_imports = True
# check the bodies of functions without annotations too, e.g. every test method, as pyright (Pylance)
# does. Without it, mypy skipped them, and the pre-commit hook passed modules that Pylance reported.
check_untyped_defs = True

[mypy.plugins.django-stubs]
django_settings_module = smarter.settings.local
