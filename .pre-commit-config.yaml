default_language_version:
  # default language version for each language
  python: python3.14
# Install the commit-msg hook too, so that commitlint checks each commit message.
# semantic-release versions Smarter from the conventional commit messages.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/DanielNoord/pydocstringformatter
    rev: v1.0.0
    hooks:
      - id: pydocstringformatter
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
        exclude: '\.svg$|^smarter/smarter/static/|^helm/|^docs/source/example-manifests/|package-lock\.json$|^smarter/react/storybook/public/mockServiceWorker\.js$'
  # The React apps in smarter/react, with the workspace's own Prettier and ESLint (and their
  # configuration in smarter/react), so that the hooks and `npm run format` / `npm run lint`
  # always agree. They need smarter/react's node_modules: make react-install.
  - repo: local
    hooks:
      - id: react-prettier
        name: prettier (smarter/react)
        entry: bash -c 'cd smarter/react && npx --no-install prettier --write --ignore-unknown "${@#smarter/react/}"' --
        language: system
        files: ^smarter/react/
        exclude: ^smarter/react/(package-lock\.json|storybook/public/|packages/[^/]+/CHANGELOG\.md$)
      - id: react-eslint
        name: eslint (smarter/react)
        entry: bash -c 'cd smarter/react && npx --no-install eslint --max-warnings=0 --no-warn-ignored "${@#smarter/react/}"' --
        language: system
        files: ^smarter/react/.*\.(ts|tsx|js)$
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: [--no-error-on-unmatched-pattern]
        exclude: "^smarter/|^helm/|^docs/source/example-manifests/"
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: ["--settings-path=pyproject.toml"]
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args: [--remove-all-unused-imports]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # See https://pre-commit.com/hooks.html for more hooks
      #- id: check-added-large-files
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-json
        exclude: ".*/reactapp/.*"
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
        exclude: "smarter/smarter/static/|smarter/smarter/templates/"
      - id: check-yaml
        exclude: ^helm/charts/smarter/values\.yaml$|^smarter/smarter/apps/api/v1/cli/tests/data/api-connection\.yaml$|^helm/charts/smarter/templates/.*\.yaml$|^docs/source/example-manifests/
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional", "@commitlint/config-angular"]
ci:
  # for more information, see https://pre-commit.ci
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [helmlint, shellcheck, markdown-link-check, commitlint]
  submodules: false
