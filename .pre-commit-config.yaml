default_language_version:
  # default language version for each language
  python: python3.14
# Install the commit-msg hook too, so that commitlint checks each commit message.
# semantic-release versions Smarter from the conventional commit messages.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/DanielNoord/pydocstringformatter
    rev: v1.0.0
    hooks:
      - id: pydocstringformatter
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
  # codespell's dictionary is English, so it skips the message catalogs of the other languages.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
        exclude: '\.svg$|^smarter/smarter/static/|^helm/|^docs/source/example-manifests/|package-lock\.json$|^smarter/smarter/locale/(?!en/)'
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: [--no-error-on-unmatched-pattern]
        exclude: "^smarter/|^helm/|^docs/source/example-manifests/"
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
  - repo: https://github.com/PyCQA/isort
    rev: 10.0.0b2
    hooks:
      - id: isort
        args: ["--settings-path=pyproject.toml"]
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        # --in-place: without it, autoflake only prints a diff and passes. A package's __init__.py
        # re-exports its modules' names, and released migrations are never edited.
        args: [--in-place, --remove-all-unused-imports, --ignore-init-module-imports]
        exclude: /migrations/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll"]
  # mypy checks the whole package on every run, not only the changed files, so that a change
  # can't break the types of a module it didn't touch. Its Django plugin imports the settings,
  # which need every requirement, so it runs in the project's venv (make python-init) rather
  # than in an environment of its own.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd smarter && ../venv/bin/python -m mypy --config-file ../mypy.ini smarter'
        language: system
        types: [python]
        files: ^smarter/
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # See https://pre-commit.com/hooks.html for more hooks
      #- id: check-added-large-files
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-json
        exclude: ".*/reactapp/.*"
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
        exclude: "smarter/smarter/static/|smarter/smarter/templates/"
      - id: check-yaml
        exclude: ^helm/charts/smarter/values\.yaml$|^smarter/smarter/apps/api/v1/cli/tests/data/api-connection\.yaml$|^helm/charts/[^/]+/templates/.*\.yaml$|^docs/source/example-manifests/
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # The latest Node.js release can be a prerelease (v27.0.0-alpha), whose version nodeenv
        # cannot parse, so the hook's environment failed to install. The latest LTS is a release.
        language_version: lts
        additional_dependencies: ["@commitlint/config-conventional", "@commitlint/config-angular"]
ci:
  # for more information, see https://pre-commit.ci
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [helmlint, shellcheck, markdown-link-check, commitlint]
  submodules: false
