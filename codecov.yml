---
#------------------------------------------------------------------------------
# Codecov configuration
#
# .github/workflows/test.yml uploads the Python coverage report, under the
# python flag, for the README's badge. The unit tests run with coverage inside
# the smarter-api container, where the repository's smarter/ folder is
# /home/smarter_user/smarter/. The python-report job combines the shards' data
# and already maps those paths back to the repository's, so the fix below only
# matters for a report made inside the container. carryforward keeps the last
# coverage when a commit uploads none, so that the badge doesn't go blank. The
# web console's coverage is smarter-sh/smarter-console's.
#------------------------------------------------------------------------------
fixes:
  - "/home/smarter_user/smarter/::smarter/"

flags:
  python:
    paths:
      - smarter/smarter/
    carryforward: true
