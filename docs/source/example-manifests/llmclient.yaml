apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  description:
    To create and deploy an example Smarter llmclient. Prompt with example
    function calling to trigger the example Static Plugin
  name: example_llmclient
  version: 0.1.0
spec:
  apiKey: snake_case_api_key_name
  config:
    prompt:
      allowedOrigins:
        - https://www.example.com
      appAssistant: Elle
      appExamplePrompts:
        - What is the weather in New York?
        - Tell me a joke
        - whats the current price of Apple stock?
        - How many days ago was 29-Feb-1972?
      appFileAttachment: false
      appInfoUrl: https://example.com
      appName: Example LLMClient
      appPlaceholder: Ask me anything...
      appWelcomeMessage: Welcome to the Example LLMClient! How can I help you today?
      customDomain: null
      defaultMaxTokens: 2048
      defaultModel: gpt-6-luna
      defaultSystemRole:
        You are a helpful llmclient. When given the opportunity to utilize
        function calling, you should always do so. This will allow you to provide the
        best possible responses to the user. If you are unable to provide a response,
        you should prompt the user for more information. If you are still unable to
        provide a response, you should inform the user that you are unable to help them
        at this time.
      defaultTemperature: 1.0
      deployed: false
      provider: openai
      subdomain: example-llmclient
    styles:
      appLogoUrl: https://cdn.smarter.sh/images/logo/smarter-crop.png
      appBackgroundImageUrl: https://cdn.smarter.sh/cms/img/techdots.png
      appBackgroundImageSize: cover
      # assistantAvatarUrl: https://cdn.smarter.sh/images/llmclients/example/assistant.png  # coming soon: upload, then uncomment
      # userAvatarUrl: https://cdn.smarter.sh/images/llmclients/example/user.png  # coming soon: upload, then uncomment
      fontFamily: '"Montserrat", system-ui, sans-serif'
      googleFont: Montserrat
      fontSize: 15px
      borderRadius: 14px
      mainContainer:
        backgroundColor: '#ffffff'
        color: '#3a2a1a'
        borderColor: '#f15a29'
      conversationHeader:
        backgroundColor: '#231f20'
        color: '#ffffff'
        infoColor: '#fdb913'
        borderColor: '#f15a29'
      messageList:
        backgroundColor: rgba(255, 255, 255, 0.8)
        color: '#3a2a1a'
      incomingMessage:
        backgroundColor: '#fff7e6'
        color: '#3a2a1a'
        borderColor: '#fdd9a0'
        linkColor: '#d4380d'
      outgoingMessage:
        backgroundColor: '#f15a29'
        color: '#ffffff'
        borderColor: '#d4380d'
        linkColor: '#fff3b0'
      messageInput:
        backgroundColor: '#ffffff'
        editorBackgroundColor: '#fff1e0'
        color: '#3a2a1a'
        placeholderColor: '#a07a5a'
        borderColor: '#fdd9a0'
      buttons:
        color: '#f15a29'
      typingIndicator:
        color: '#f15a29'
  extensions:
    - weather
    - date-calculator
    - stockprice
  plugins:
    - everlasting_gobstopper
    - example_configuration
