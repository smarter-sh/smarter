<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Exhibit: phase 2, the month-end commentary sends the model three totals instead of the general ledger">
<title>Exhibit: phase 2, the month-end commentary sends the model three totals instead of the general ledger</title>
<defs><linearGradient id="dk-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1C24"/><stop offset="1" stop-color="#24203A"/></linearGradient><radialGradient id="dk-orange" cx="0.04" cy="1.12" r="0.62"><stop offset="0" stop-color="#EA580C" stop-opacity="0.32"/><stop offset="0.55" stop-color="#EA580C" stop-opacity="0.08"/><stop offset="1" stop-color="#EA580C" stop-opacity="0"/></radialGradient><radialGradient id="dk-purple" cx="0.98" cy="-0.06" r="0.5"><stop offset="0" stop-color="#7239EA" stop-opacity="0.3"/><stop offset="1" stop-color="#7239EA" stop-opacity="0"/></radialGradient><marker id="dk-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker><marker id="dk-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3DD68C"/></marker><marker id="dk-arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker></defs>
<rect width="1200" height="800" rx="24" fill="url(#dk-bg)"/>
<rect width="1200" height="800" rx="24" fill="url(#dk-orange)"/>
<rect width="1200" height="800" rx="24" fill="url(#dk-purple)"/>
<rect x="50" y="52" width="26" height="4" rx="2" fill="#3DD68C"/>
<text x="88" y="59" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="18" font-weight="600" fill="#3DD68C" text-anchor="start">Shadow AI · phase 2</text>
<text x="48" y="116" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-1.2">Send the rows, not the table.</text>
<text x="50" y="154" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="18" font-weight="400" fill="#C9CAD3" text-anchor="start">The month-end commentary, before and after. The same question; about 90,000 tokens, then about a thousand.</text>
<rect x="50" y="196" width="540" height="470" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="50" y="214" width="4" height="434" rx="2" fill="#F87171"/>
<text x="78" y="236" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#F87171" text-anchor="start">Before: paste the ledger</text>
<text x="78" y="262" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="14" font-weight="400" fill="#8D8FA0" text-anchor="start">a notebook, through its Proxy</text>
<rect x="78" y="286" width="484" height="210" rx="14" fill="#14151B" stroke="#F87171" stroke-opacity="0.45" stroke-width="1.2"/>
<text x="98" y="314" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8D8FA0" text-anchor="start">prompt</text>
<text x="98" y="342" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">Write the month-end commentary.</text>
<text x="98" y="368" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#F87171" text-anchor="start">line_id,entry_date,gl_account,…</text>
<text x="98" y="392" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#F87171" text-anchor="start">1,2024-12-11,1000,…,750.00,0.00</text>
<text x="98" y="416" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#F87171" text-anchor="start">2,2024-12-11,4000,…,0.00,750.00</text>
<text x="98" y="440" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#F87171" text-anchor="start">… 2,502 lines of gl_entries</text>
<text x="98" y="474" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F87171" text-anchor="start">≈ 88,000 tokens, every run</text>
<text x="78" y="534" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C9CAD3" text-anchor="start">The whole ledger goes to the AI provider,</text>
<text x="78" y="557" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C9CAD3" text-anchor="start">whatever the question. The cost grows with the</text>
<text x="78" y="580" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C9CAD3" text-anchor="start">table, not with the answer.</text>
<rect x="412" y="626" width="150" height="24" rx="12" fill="#F87171" fill-opacity="0.16"/>
<text x="487.0" y="642.5" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F87171" text-anchor="middle">leaves the company</text>
<rect x="610" y="196" width="540" height="470" rx="18" fill="#3DD68C" fill-opacity="0.08" stroke="#3DD68C" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="638" y="236" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#3DD68C" text-anchor="start">After: ask Ledger</text>
<text x="638" y="262" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="14" font-weight="400" fill="#8D8FA0" text-anchor="start">Accounting's LLMClient, with SqlPlugins</text>
<rect x="638" y="290" width="484" height="80" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="654" y="304" width="52" height="52" rx="14" fill="#A78BFA" fill-opacity="0.18"/>
<g transform="translate(667,317) scale(1.0833)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></g>
<text x="720" y="325" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#A78BFA" text-anchor="start">The model asks for a tool</text>
<text x="720" y="349" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9CAD3" text-anchor="start">stackademy_accounting_results · Q4 2025</text>
<path d="M880,370 L880,388" fill="none" stroke="#3DD68C" stroke-width="2.4" stroke-opacity="0.85"/>
<rect x="638" y="388" width="484" height="80" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="654" y="402" width="52" height="52" rx="14" fill="#3DD68C" fill-opacity="0.18"/>
<g transform="translate(667,415) scale(1.0833)" fill="none" stroke="#3DD68C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></g>
<text x="720" y="423" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#3DD68C" text-anchor="start">Smarter runs the reviewed query</text>
<text x="720" y="447" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9CAD3" text-anchor="start">as Accounting's read-only database user</text>
<path d="M880,468 L880,486" fill="none" stroke="#3DD68C" stroke-width="2.4" stroke-opacity="0.85"/>
<rect x="638" y="486" width="484" height="80" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="654" y="500" width="52" height="52" rx="14" fill="#3DD68C" fill-opacity="0.18"/>
<g transform="translate(667,513) scale(1.0833)" fill="none" stroke="#3DD68C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 15h18M9.5 9.5V20"/></g>
<text x="720" y="521" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="16" font-weight="700" fill="#3DD68C" text-anchor="start">Three totals come back</text>
<text x="720" y="545" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#C9CAD3" text-anchor="start">revenue · expenses · net_income</text>
<text x="638" y="606" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C9CAD3" text-anchor="start">The ledger stays in the database. Ledger's guardrail,</text>
<text x="638" y="629" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C9CAD3" text-anchor="start">budget and chat history apply to every question.</text>
<rect x="50" y="690" width="1100" height="70" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="50" y="708" width="4" height="34" rx="2" fill="#3DD68C"/>
<text x="78" y="719" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9CAD3" text-anchor="start">The same pattern rebuilt the others: the live courses table instead of every course design (Stanley); HR's requisitions</text>
<text x="78" y="741" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9CAD3" text-anchor="start">instead of every salary; one student's records instead of 320; a read-only GitHub MCPClient instead of course folders.</text>
<text x="50" y="778" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="13" font-weight="400" fill="#8D8FA0" text-anchor="start">Source: departments/accounting/plugins/ and scripts/backoffice.sql in smarter-sh/stackademy.</text>
</svg>
