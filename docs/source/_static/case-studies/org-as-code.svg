<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="Exhibit: the organization, declared in a git repository">
<title>Exhibit: the organization, declared in a git repository</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker></defs>
<rect x="0" y="0" width="1080" height="470" fill="#FFFFFF"/>
<text x="24" y="34" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2328" text-anchor="start">The organization, declared in a git repository</text>
<text x="24" y="56" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">One repository holds the accounts, the people and every department's resources. owners.yaml says who applies each folder.</text>
<rect x="24" y="78" width="370" height="352" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<path d="M24,108 v-22 a8,8 0 0 1 8,-8 h354 a8,8 0 0 1 8,8 v22 z" fill="#EAF2F9"/>
<line x1="24" y1="108" x2="394" y2="108" stroke="#C9D1D9" stroke-width="1"/>
<text x="36" y="98" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F5F8B" text-anchor="start">smarter-sh/stackademy</text>
<text x="38" y="132" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">org/accounts/</text>
<text x="236" y="132" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">6 Account manifests</text>
<text x="38" y="158" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">org/users/</text>
<text x="236" y="158" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">10 User manifests</text>
<text x="38" y="184" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">owners.yaml</text>
<text x="236" y="184" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">folder → owner, account</text>
<text x="38" y="210" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">secrets/</text>
<text x="236" y="210" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">the demo password</text>
<text x="38" y="236" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">departments/it/</text>
<text x="236" y="236" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">PII guardrail</text>
<text x="38" y="262" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">departments/hr/</text>
<text x="236" y="262" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">assistant, plugins</text>
<text x="60" y="288" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">connections/</text>
<text x="236" y="288" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">database credentials</text>
<text x="38" y="314" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">departments/accounting/</text>
<text x="236" y="314" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">content/, admissions/</text>
<text x="38" y="340" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">departments/executive/</text>
<text x="236" y="340" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">Board Pack, orchestrator</text>
<text x="38" y="366" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">budgets/</text>
<text x="236" y="366" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">one per department</text>
<text x="38" y="392" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">scripts/</text>
<text x="236" y="392" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">the database, generated</text>
<rect x="440" y="176" width="196" height="138" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<path d="M440,206 v-22 a8,8 0 0 1 8,-8 h180 a8,8 0 0 1 8,8 v22 z" fill="#EAF2F9"/>
<line x1="440" y1="206" x2="636" y2="206" stroke="#C9D1D9" stroke-width="1"/>
<text x="452" y="196" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F5F8B" text-anchor="start">load_from_github</text>
<text x="452" y="226" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">run by initialize_platform:</text>
<text x="452" y="243" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">applies every manifest,</text>
<text x="452" y="260" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">in dependency order,</text>
<text x="452" y="277" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">as its folder's owner,</text>
<text x="452" y="294" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">in its owner's account</text>
<line x1="396" y1="236" x2="438" y2="236" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="676" y="92" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#57606A" text-anchor="start">Folder</text>
<text x="898" y="92" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#57606A" text-anchor="start">Applied as · in</text>
