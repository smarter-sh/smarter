<text x="898" y="338" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2328" text-anchor="start">Vera Jaramillo</text>
<text x="898" y="355" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">Stackademy Corp</text>
