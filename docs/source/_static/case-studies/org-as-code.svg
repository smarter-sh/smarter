<text x="24" y="456" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start" font-style="italic">Source: smarter-sh/stackademy; smarter.apps.account.repository_owners. owners.yaml is generated from the back office.</text>
