<text x="898" y="284" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2328" text-anchor="start">Tomas Hartigan</text>
<text x="898" y="301" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">Stackademy IT</text>
