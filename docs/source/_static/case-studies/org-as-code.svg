<text x="898" y="230" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1F2328" text-anchor="start">Odette Hartigan</text>
<text x="898" y="247" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">Stackademy Accounting</text>
