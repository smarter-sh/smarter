<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" role="img" aria-label="Exhibit: who may administer an account, before and after the review">
<title>Exhibit: who may administer an account, before and after the review</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker></defs>
<rect x="0" y="0" width="1060" height="430" fill="#FFFFFF"/>
<text x="24" y="34" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2328" text-anchor="start">Who may administer an account, before and after the review</text>
<text x="24" y="56" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">One rule, user_administers_account(), now decides it for every broker, api key and console control.</text>
<text x="32" y="96" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#57606A" text-anchor="start">Role or path</text>
<text x="380" y="96" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#CF222E" text-anchor="start">Before</text>
<text x="720" y="96" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1A7F37" text-anchor="start">After</text>
<rect x="24" y="108" width="1012" height="48" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="36" y="137" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="start">Platform superuser</text>
<rect x="372" y="117" width="320" height="30" rx="6" fill="#F6F8FA" stroke="#F6F8FA" stroke-width="1.2"/>
<text x="384" y="137" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">every account</text>
<rect x="712" y="117" width="316" height="30" rx="6" fill="#F6F8FA" stroke="#F6F8FA" stroke-width="1.2"/>
<text x="724" y="137" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">every account (unchanged)</text>
<rect x="24" y="164" width="1012" height="48" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="36" y="193" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="start">Staff user</text>
<rect x="372" y="173" width="320" height="30" rx="6" fill="#FFEBE9" stroke="#FFEBE9" stroke-width="1.2"/>
<text x="384" y="193" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#CF222E" text-anchor="start">every account, member or not</text>
<rect x="712" y="173" width="316" height="30" rx="6" fill="#DAFBE1" stroke="#DAFBE1" stroke-width="1.2"/>
<text x="724" y="193" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1A7F37" text-anchor="start">only accounts they belong to</text>
<rect x="24" y="220" width="1012" height="48" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="36" y="249" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="start">Account administrator</text>
<rect x="372" y="229" width="320" height="30" rx="6" fill="#FFEBE9" stroke="#FFEBE9" stroke-width="1.2"/>
<text x="384" y="249" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#CF222E" text-anchor="start">no such role</text>
<rect x="712" y="229" width="316" height="30" rx="6" fill="#DAFBE1" stroke="#DAFBE1" stroke-width="1.2"/>
<text x="724" y="249" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1A7F37" text-anchor="start">their one account</text>
<rect x="24" y="276" width="1012" height="48" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="36" y="305" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="start">Customer admin made superuser</text>
<rect x="372" y="285" width="320" height="30" rx="6" fill="#FFEBE9" stroke="#FFEBE9" stroke-width="1.2"/>
<text x="384" y="305" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#CF222E" text-anchor="start">every customer's account</text>
<rect x="712" y="285" width="316" height="30" rx="6" fill="#DAFBE1" stroke="#DAFBE1" stroke-width="1.2"/>
<text x="724" y="305" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1A7F37" text-anchor="start">demoted: their own accounts</text>
<rect x="24" y="332" width="1012" height="48" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="36" y="361" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="start">Api key for another user</text>
<rect x="372" y="341" width="320" height="30" rx="6" fill="#FFEBE9" stroke="#FFEBE9" stroke-width="1.2"/>
<text x="384" y="361" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#CF222E" text-anchor="start">any user, any account</text>
<rect x="712" y="341" width="316" height="30" rx="6" fill="#DAFBE1" stroke="#DAFBE1" stroke-width="1.2"/>
<text x="724" y="361" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1A7F37" text-anchor="start">users of their own account</text>
<text x="24" y="398" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">Before the review, a staff user of any customer account could add anyone, themselves included, to any other account as its administrator.</text>
<text x="24" y="416" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start" font-style="italic">Source: ADR-036 item 10; smarter.apps.account.models.user_profile.user_administers_account(); migration 0017.</text>
</svg>
