<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="Exhibit: the release of 0.46.0, and where it stopped">
<title>Exhibit: the release of 0.46.0, and where it stopped</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker></defs>
<rect x="0" y="0" width="1080" height="470" fill="#FFFFFF"/>
<text x="24" y="34" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2328" text-anchor="start">The release of 0.46.0, and where it stopped</text>
<text x="24" y="56" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">The release job published the version, then failed in its last step; everything that ships it was skipped.</text>
<rect x="24" y="90" width="186" height="70" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/>
<text x="117" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1A7F37" text-anchor="middle">Merge #1005</text>
<text x="117" y="140" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">to main</text>
<line x1="212" y1="125" x2="232" y2="125" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="234" y="90" width="186" height="70" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/>
<text x="327" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1A7F37" text-anchor="middle">Analyze</text>
<text x="327" y="140" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">commits → 0.46.0</text>
<line x1="422" y1="125" x2="442" y2="125" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="444" y="90" width="186" height="70" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/>
<text x="537" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1A7F37" text-anchor="middle">Tag v0.46.0</text>
<text x="537" y="140" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">and changelog commit</text>
<line x1="632" y1="125" x2="652" y2="125" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="654" y="90" width="186" height="70" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/>
<text x="747" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1A7F37" text-anchor="middle">GitHub release</text>
<text x="747" y="140" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">published</text>
<line x1="842" y1="125" x2="862" y2="125" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="864" y="90" width="186" height="70" rx="8" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.6"/>
<text x="957" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#CF222E" text-anchor="middle">Success step</text>
<text x="957" y="140" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">#1003 is not an issue</text>
<text x="24" y="196" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#CF222E" text-anchor="start">release job: failed</text>
<rect x="24" y="210" width="186" height="60" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="117" y="236" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606A" text-anchor="middle">Docker image</text>
<text x="117" y="256" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">never built</text>
<rect x="234" y="210" width="186" height="60" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="327" y="236" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606A" text-anchor="middle">Helm chart</text>
<text x="327" y="256" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">never published</text>
<rect x="444" y="210" width="186" height="60" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="537" y="236" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606A" text-anchor="middle">Deploy to prod</text>
<text x="537" y="256" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">never ran</text>
<rect x="654" y="210" width="186" height="60" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="747" y="236" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#57606A" text-anchor="middle">Notify</text>
<text x="747" y="256" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">never sent</text>
<path d="M942,162 C942,240 860,240 846,240" fill="none" stroke="#CF222E" stroke-width="1.6" marker-end="url(#arrow-red)"/>
<text x="24" y="312" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2328" text-anchor="start">Re-runs 2 and 3: main is ahead of the run (it has the release commit), so nothing is released and everything is skipped again.</text>
<rect x="24" y="330" width="1032" height="104" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.2"/>
<text x="40" y="356" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1A7F37" text-anchor="start">Recovery and fix</text>
<text x="40" y="378" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2328" text-anchor="start">Recovery: start Build by hand with tag v0.46.0, which builds the image and chart of the release that already exists.</text>
<text x="40" y="395" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2328" text-anchor="start">Fix: run semantic-release 25, whose GitHub plugin skips references that resolve to no issue. Proven on the next</text>
<text x="40" y="412" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2328" text-anchor="start">release, 0.46.0-alpha.18, whose success step completed.</text>
<text x="24" y="456" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start" font-style="italic">Source: GitHub Actions run 43651270572 of smarter-sh/smarter; .github/workflows/build.yml.</text>
</svg>
