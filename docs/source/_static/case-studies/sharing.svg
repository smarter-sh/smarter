<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Exhibit: what a member of Stackademy HR may read">
<title>Exhibit: what a member of Stackademy HR may read</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker></defs>
<rect x="0" y="0" width="1000" height="430" fill="#FFFFFF"/>
<text x="24" y="34" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2328" text-anchor="start">What a member of Stackademy HR may read</text>
<text x="24" y="56" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">A member reads an account's resources if their own account is that account, or descends from its share scope.</text>
<rect x="390" y="80" width="230" height="62" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/>
<text x="404" y="106" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A7F37" text-anchor="start">Smarter platform</text>
<text x="404" y="126" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">share scope: itself, the root</text>
<rect x="390" y="170" width="230" height="62" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="404" y="196" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#57606A" text-anchor="start">Stackademy Corp</text>
<text x="404" y="216" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">share scope: itself, its members</text>
<rect x="90" y="270" width="230" height="62" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/>
<text x="104" y="296" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A7F37" text-anchor="start">Stackademy IT</text>
<text x="104" y="316" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">share scope: Stackademy Corp</text>
<rect x="390" y="270" width="230" height="62" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/>
<text x="404" y="296" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A7F37" text-anchor="start">Stackademy HR</text>
<text x="404" y="316" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">share scope: itself</text>
<rect x="690" y="270" width="230" height="62" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="704" y="296" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#57606A" text-anchor="start">Stackademy Accounting</text>
<text x="704" y="316" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">share scope: itself</text>
<line x1="505" y1="142" x2="505" y2="168" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M505,232 V252 H205 V268" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="505" y1="232" x2="505" y2="268" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M505,252 H805 V268" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="632" y="92" width="179" height="18" rx="9" fill="#1A7F37" stroke="#1A7F37" stroke-width="1"/>
<text x="721.5" y="105" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">readable: shares with everyone</text>
<rect x="110" y="340" width="212" height="18" rx="9" fill="#1A7F37" stroke="#1A7F37" stroke-width="1"/>
<text x="216.0" y="353" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">readable: shares with Corp's subtree</text>
<rect x="410" y="340" width="163" height="18" rx="9" fill="#1A7F37" stroke="#1A7F37" stroke-width="1"/>
<text x="491.5" y="353" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">readable: their own account</text>
<rect x="710" y="340" width="190" height="18" rx="9" fill="#CF222E" stroke="#CF222E" stroke-width="1"/>
<text x="805.0" y="353" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">not readable: shares with no one</text>
<rect x="632" y="182" width="179" height="18" rx="9" fill="#CF222E" stroke="#CF222E" stroke-width="1"/>
<text x="721.5" y="195" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">not readable: its members only</text>
<text x="24" y="386" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2328" text-anchor="start">So Harper, HR's assistant, can use IT's PII guardrail and the platform's built-in resources, but not Accounting's connection, and Accounting can't use HR's.</text>
<text x="24" y="416" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start" font-style="italic">Source: ADR-036, smarter.apps.account.hierarchy.readable_account_ids().</text>
</svg>
