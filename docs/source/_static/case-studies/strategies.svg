<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" role="img" aria-label="Exhibit: the four orchestration strategies that Smarter runs">
<title>Exhibit: the four orchestration strategies that Smarter runs</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker></defs>
<rect x="0" y="0" width="1080" height="400" fill="#FFFFFF"/>
<text x="24" y="34" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2328" text-anchor="start">The four orchestration strategies that Smarter runs</text>
<text x="24" y="56" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">A summarizer, when there is one, answers last after any of them. Voting and debate are declared, but not yet run.</text>
<rect x="24" y="76" width="248" height="290" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="38" y="100" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F5F8B" text-anchor="start">Sequential</text>
<text x="38" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">each sees the answers before it</text>
<rect x="288" y="76" width="248" height="290" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="302" y="100" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F5F8B" text-anchor="start">Parallel</text>
<text x="302" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">each sees only the objective</text>
<rect x="552" y="76" width="248" height="290" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="566" y="100" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F5F8B" text-anchor="start">Router</text>
<text x="566" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">a router picks one assistant</text>
<rect x="816" y="76" width="248" height="290" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="830" y="100" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F5F8B" text-anchor="start">Supervisor</text>
<text x="830" y="118" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">a planner asks, one at a time</text>
