<rect x="50" y="52" width="26" height="4" rx="2" fill="#A78BFA"/>
<text x="88" y="59" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="18" font-weight="600" fill="#A78BFA" text-anchor="start">The board pack</text>
<text x="48" y="116" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-1.2">Four ways to run a team of assistants.</text>
<text x="50" y="154" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="18" font-weight="400" fill="#C9CAD3" text-anchor="start">A summarizer, when there is one, answers last after any of them. Voting and debate are declared, but not yet run.</text>
<rect x="50" y="196" width="260" height="370" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<text x="74" y="238" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="start">Sequential</text>
<text x="74" y="262" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="14" font-weight="400" fill="#8D8FA0" text-anchor="start">each sees the answers before it</text>
<rect x="330" y="196" width="260" height="370" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<text x="354" y="238" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="start">Parallel</text>
<text x="354" y="262" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="14" font-weight="400" fill="#8D8FA0" text-anchor="start">each sees only the objective</text>
<rect x="610" y="196" width="260" height="370" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<text x="634" y="238" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="start">Router</text>
<text x="634" y="262" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="14" font-weight="400" fill="#8D8FA0" text-anchor="start">a router picks one assistant</text>
<rect x="890" y="196" width="260" height="370" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<text x="914" y="238" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="start">Supervisor</text>
<text x="914" y="262" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="14" font-weight="400" fill="#8D8FA0" text-anchor="start">a planner asks, one at a time</text>
