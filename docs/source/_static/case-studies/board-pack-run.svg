<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-label="Exhibit: a run of the quarterly board pack">
<title>Exhibit: a run of the quarterly board pack</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606A"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker></defs>
<rect x="0" y="0" width="1080" height="540" fill="#FFFFFF"/>
<text x="24" y="34" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2328" text-anchor="start">A run of the quarterly board pack</text>
<text x="24" y="56" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606A" text-anchor="start">Four departments answer independently, each from its own records and on its own budget; Atlas writes the page.</text>
<rect x="24" y="196" width="170" height="100" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<path d="M24,226 v-22 a8,8 0 0 1 8,-8 h154 a8,8 0 0 1 8,8 v22 z" fill="#EAF2F9"/>
<line x1="24" y1="226" x2="194" y2="226" stroke="#C9D1D9" stroke-width="1"/>
<text x="36" y="216" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F5F8B" text-anchor="start">Vera Jaramillo</text>
<text x="36" y="246" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">CEO, starts a run:</text>
<text x="36" y="263" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Prepare the board pack</text>
<text x="36" y="280" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">for Q4 2025.</text>
<line x1="196" y1="246" x2="226" y2="246" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="211.0" y="240.0" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606A" text-anchor="middle">POST</text>
<rect x="228" y="176" width="200" height="140" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<path d="M228,206 v-22 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v22 z" fill="#FBEFFF"/>
<line x1="228" y1="206" x2="428" y2="206" stroke="#C9D1D9" stroke-width="1"/>
<text x="240" y="196" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F5F8B" text-anchor="start">Orchestrator</text>
<text x="240" y="226" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">stackademy_quarterly_</text>
<text x="240" y="243" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">board_pack</text>
<text x="240" y="260" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">strategy: parallel</text>
<text x="240" y="277" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Stackademy Corp</text>
<text x="240" y="334" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#CF222E" text-anchor="start">checks: the runner may use</text>
<text x="240" y="349" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#CF222E" text-anchor="start">every harness, or 403</text>
