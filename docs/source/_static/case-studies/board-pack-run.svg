<rect x="508" y="82" width="300" height="82" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="522" y="106" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F5F8B" text-anchor="start">Harper · Stackademy HR</text>
<text x="522" y="126" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">reads as stackademy_hr</text>
<text x="522" y="146" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1F2328" text-anchor="start">headcount, hiring</text>
