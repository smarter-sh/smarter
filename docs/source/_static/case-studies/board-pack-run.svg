<text x="1050" y="588" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="14" font-weight="400" fill="#C9CAD3" text-anchor="middle">one page, about 30 s</text>
<rect x="50" y="646" width="1100" height="80" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="50" y="664" width="4" height="44" rx="2" fill="#A78BFA"/>
<text x="78" y="678" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9CAD3" text-anchor="start">Each step is an ordinary prompt of its LLMClient, run as that LLMClient's owner: its tools, guardrail and budget apply.</text>
<text x="78" y="701" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9CAD3" text-anchor="start">The CFO, who isn't a member of HR, is refused: an orchestrator is never a way into an account its runner doesn't belong to.</text>
<text x="50" y="778" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="13" font-weight="400" fill="#8D8FA0" text-anchor="start">Source: ADR-037; smarter.apps.orchestrator.runtime; departments/executive/orchestrators/ in smarter-sh/stackademy.</text>
