<rect x="508" y="180" width="300" height="82" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="522" y="204" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F5F8B" text-anchor="start">Ledger · Stackademy Accounting</text>
<text x="522" y="224" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">reads as stackademy_accounting</text>
<text x="522" y="244" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1F2328" text-anchor="start">results, budgets, invoices</text>
<path d="M810,220 C850,220 850,246 878,246" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M430,246 C470,246 470,318 506,318" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="508" y="278" width="300" height="82" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="522" y="302" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F5F8B" text-anchor="start">Reel · Course Content</text>
<text x="522" y="322" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">reads as stackademy_content</text>
<text x="522" y="342" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1F2328" text-anchor="start">courses in production</text>
<path d="M810,318 C850,318 850,246 878,246" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M430,246 C470,246 470,416 506,416" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="508" y="376" width="300" height="82" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<text x="522" y="400" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F5F8B" text-anchor="start">Ada · Admissions</text>
<text x="522" y="420" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">reads as stackademy_admissions</text>
<text x="522" y="440" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1F2328" text-anchor="start">enrollments, contracts</text>
<path d="M810,416 C850,416 850,246 878,246" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="880" y="176" width="180" height="140" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.2"/>
<path d="M880,206 v-22 a8,8 0 0 1 8,-8 h164 a8,8 0 0 1 8,8 v22 z" fill="#DAFBE1"/>
<line x1="880" y1="206" x2="1060" y2="206" stroke="#C9D1D9" stroke-width="1"/>
<text x="892" y="196" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F5F8B" text-anchor="start">Atlas</text>
<text x="892" y="226" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">summarizer</text>
<text x="892" y="243" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">Stackademy Corp</text>
<text x="892" y="260" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">views of totals</text>
<text x="892" y="277" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2328" text-anchor="start">checks the figures</text>
<line x1="970" y1="318" x2="970" y2="366" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="880" y="368" width="180" height="56" rx="8" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.2"/>
<text x="970" y="392" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1A7F37" text-anchor="middle">The board pack</text>
<text x="970" y="410" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="middle">one page, about 30 s</text>
<text x="24" y="488" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">Each step is an ordinary prompt of its LLMClient, run as that LLMClient's owner: its tools, guardrail and budget apply.</text>
<text x="24" y="505" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="start">The CFO, who isn't a member of HR, is refused: an orchestrator is never a way into an account its runner doesn't belong to.</text>
<text x="24" y="526" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="start" font-style="italic">Source: ADR-037; smarter.apps.orchestrator.runtime; departments/executive/orchestrators/ in smarter-sh/stackademy.</text>
</svg>
