<rect x="50" y="740" width="1100" height="70" rx="18" fill="#23252E" fill-opacity="0.82" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="50" y="758" width="4" height="34" rx="2" fill="#3DD68C"/>
<text x="78" y="769" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9CAD3" text-anchor="start">Smarter, not the model, runs the query: it binds the model's values as parameters, connects as a read-only user,</text>
<text x="78" y="791" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9CAD3" text-anchor="start">and hands the rows back. Change a price in courses, and Stanley's next answer has it. There is no copy to update.</text>
<text x="50" y="838" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="13" font-weight="400" fill="#8D8FA0" text-anchor="start">Source: smarter-sh/stackademy, llm-clients/, plugins/sql/, connections/sql/ and budgets/.</text>
