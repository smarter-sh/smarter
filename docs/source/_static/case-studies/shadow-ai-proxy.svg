<text x="78" y="242" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9CAD3" text-anchor="start">in scripts, notebooks, a spreadsheet and a CI variable, and one invoice a month, charged to IT.</text>
