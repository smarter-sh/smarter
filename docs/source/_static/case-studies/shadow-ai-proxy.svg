<text x="78" y="819" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9CAD3" text-anchor="start">Nothing stops working, and from the first call each project has an owner, a key, a budget and its own charges.</text>
<text x="78" y="841" font-family="Inter, 'Helvetica Neue', Lato, Arial, sans-serif" font-size="15" font-weight="400" fill="#C9CAD3" text-anchor="start">The Proxy forwards prompts as they are, so a project that sends private data still does, until phase 2.</text>
