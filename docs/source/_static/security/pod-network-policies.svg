<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 842" width="1250" height="842" role="img" aria-labelledby="t d">
<title id="t">Which pods may talk to which</title>
<desc id="d">In the platform's namespace, a default-deny policy blocks all ingress and egress. Traefik, in its own namespace, may reach the application's pods on port 8000 only. The application's pods (smarter-api, the Celery workers, beat, the init Job and the bastion) may reach each other, MariaDB on 3306, Redis on 6379, Loki on 3100 and 9095, DNS in kube-system on 53, and the internet on 443, 80, 587 and 3306. MariaDB and Redis accept connections only from the application's pods. A pod in another namespace, or one without the chart's labels, can reach nothing.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C959F"/></marker><marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2980B9"/></marker></defs>
<rect width="1250" height="842" rx="14" fill="#F6F8FA"/>
<text x="625.0" y="34" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#24292F" text-anchor="middle">Which pods may talk to which</text>
<text x="625.0" y="54" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="middle">Calico enforces the namespace's network policies on every node: default deny, then only these paths</text>
