<text x="454" y="640" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#CF222E" text-anchor="start" font-style="italic">denied: the app's pods, MariaDB, Redis and Loki</text>
<text x="272" y="744" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">The policies select pods by the labels that the Helm chart sets: app.kubernetes.io/application-group and app.kubernetes.io/name.</text>
<text x="272" y="762" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606A" text-anchor="start">A pod that you add without them can reach nothing.</text>
