<title id="t">The Smarter ecosystem</title>
<desc id="d">The Smarter platform at the center, with the open-source packages around it and the registry each is published to: the smarter CLI and VS Code extension, the Python, Go and Node.js SDKs, the shared Python libraries smarter-types and cache-results, the npm chat and widget components, the website integrations, Smarter Extensions, and the platform's Docker image and Helm chart.</desc>
