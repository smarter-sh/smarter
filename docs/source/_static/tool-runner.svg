<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 890" width="1300" height="890" role="img" aria-labelledby="t d">
<title id="t">How an LLM tool call runs</title>
<desc id="d">When the LLM asks for a tool, the tool's code in the app, such as MCPToolkit.call() or ApiConnection.execute_query(), checks the permissions and the cache. On a cache miss it resolves the call: it reads the credential from its Smarter Secret, decrypts it, signs the acting user, and builds a ToolCall, such as an MCPToolCall, an ApiToolCall or an HttpToolCall, of plain values that travel as JSON. It hands the call to the tool runner, from get_tool_runner(), which finds the executor of the call's kind in TOOL_EXECUTORS: execute_mcp_call for MCP clients, execute_api_call for API plugins, and execute_http_call for the web search apis (Brave, Tavily), the Brave image search, and the checks of each image's url. The executor reads no database and no Secret: it calls the MCP server, the api, the search api or the image's host, through safe_http, to public addresses only. It returns a ToolCallResult, with a value, is_error, failure and status_code, and the tool's code in the app sends the signals, stores the result in the cache, and gives it to the LLM. Today the runner executes the call in the app's process; in phase 2 of ADR-038 a remote runner sends the same call to a worker that holds no credentials.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C959F"/></marker><marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2980B9"/></marker></defs>
