<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 910" width="1300" height="910" role="img" aria-labelledby="t d">
<title id="t">Who writes to the cluster and the cloud</title>
<desc id="d">Two paths from the app to the Kubernetes api and the cloud's apis. The LLMClient broker hands its ingresses, DNS records and certificates to Celery tasks on the infrastructure queue, which smarter-worker-infrastructure runs with the Kubernetes Role and the IAM role for Route53 and ACM. Celery Beat schedules the inventory and the vectorstores' maintenance on the same queue. The LLMHost broker's deploy, undeploy and delete, and the vectorstore broker's apply and delete, call the Kubernetes api from the app's own request, and the LLMHostCompute broker's deploy and delete create, scale and delete its EKS node group from the app too. The app also reads the cluster: an LLMHost's observation and logs, a vectorstore's conditions and logs, the MCPServer's status tools, smarter status, and its startup check. So phase 3 can move the Kubernetes Role to the infrastructure worker only after those three brokers hand their writes to infrastructure tasks, as the LLMClient's broker does; the app's reads need a read-only Role either way.</desc>
