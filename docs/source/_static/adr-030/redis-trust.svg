<text x="912" y="341" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">the app hands a forged result to the LLM</text>
<rect x="900" y="378" width="372" height="61" rx="9" fill="#FFFFFF" stroke="#D0D7DE"/>
<path d="M900,387 a9,9 0 0 1 9,-9 h354 a9,9 0 0 1 9,9 v17 h-372 z" fill="#FFEBE9"/>
<text x="912" y="396" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#CF222E" text-anchor="start">Read the session keys, database 2</text>
<text x="912" y="420" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">each is a valid sessionid cookie</text>
<rect x="900" y="457" width="372" height="61" rx="9" fill="#FFFFFF" stroke="#D0D7DE"/>
