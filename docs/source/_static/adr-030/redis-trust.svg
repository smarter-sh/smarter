<text x="912" y="499" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">a task that recurs, past every restart</text>
<rect x="900" y="536" width="372" height="61" rx="9" fill="#FFFFFF" stroke="#D0D7DE"/>
<path d="M900,545 a9,9 0 0 1 9,-9 h354 a9,9 0 0 1 9,9 v17 h-372 z" fill="#E7F6EC"/>
<text x="912" y="554" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#116329" text-anchor="start">Swap an Extension's archive: no</text>
<text x="912" y="578" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">the worker checks its sha256</text>
<path d="M178.0,600 L178.0,712 L860,712 L860,140 L898,140" fill="none" stroke="#CF222E" stroke-width="1.8" marker-end="url(#head-red)"/>
<text x="640" y="704" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#CF222E" text-anchor="middle" font-style="italic">with the url alone</text>
<rect x="28" y="740" width="1244" height="40" rx="9" fill="#FFFFFF" stroke="#D0D7DE"/>
<path d="M48,760 h34" stroke="#8C959F" stroke-width="1.8" marker-end="url(#head)"/>
<text x="92" y="764" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">holds the url, with every other credential</text>
