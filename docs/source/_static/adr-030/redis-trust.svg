<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" width="1300" height="800" role="img" aria-labelledby="t d">
<title id="t">Redis is the platform's least protected credential</title>
<desc id="d">Three columns. The pods that hold Redis's url: the app, both workers, beat, the Jobs and the tool worker, which holds no other credential. Redis itself, with one password, smarter, which is the chart's default and the deploy action's, both in this public repository, and no access control list, so every client may run every command on every database: database 0 holds the three task queues, the tool calls' results and RedBeat's schedule; database 1 the cache, with Extensions' archives and cached tool results; database 2 the users' sessions. Calico's network policies are what keeps other pods out. The last column is what code in the tool worker, such as an Extension, can do with the url alone: push a task to the infrastructure queue, which smarter-worker-infrastructure runs with the Kubernetes Role and the IAM role; read the other pending tool calls in its queue, with their decrypted credentials; write a tool call's result before the worker that took it does, so the app hands a forged result to the LLM; read the session keys, each of which is a valid session cookie; and add an entry to RedBeat's schedule, which recurs after every restart. An Extension's archive can't be swapped: the worker checks its sha256 against the call.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C959F"/></marker><marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2980B9"/></marker></defs>
<rect width="1300" height="800" rx="14" fill="#F6F8FA"/>
<text x="650.0" y="34" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#24292F" text-anchor="middle">Redis is the platform's least protected credential</text>
<text x="650.0" y="54" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606A" text-anchor="middle">every pod holds its url, the password is the public default, and Redis can't tell one client from another</text>
<text x="28" y="100" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980B9" text-anchor="start">1 · Who holds Redis's url</text>
