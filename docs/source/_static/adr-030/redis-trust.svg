<text x="912" y="166" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">delete_default_api, destroy_llmhost, …:</text>
<text x="912" y="183" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">run with the Kubernetes and IAM roles</text>
<rect x="900" y="220" width="372" height="61" rx="9" fill="#FFFFFF" stroke="#D0D7DE"/>
<path d="M900,229 a9,9 0 0 1 9,-9 h354 a9,9 0 0 1 9,9 v17 h-372 z" fill="#FFEBE9"/>
<text x="912" y="238" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#CF222E" text-anchor="start">Read the other pending tool calls</text>
<text x="912" y="262" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">each with its decrypted credentials</text>
<rect x="900" y="299" width="372" height="61" rx="9" fill="#FFFFFF" stroke="#D0D7DE"/>
<path d="M900,308 a9,9 0 0 1 9,-9 h354 a9,9 0 0 1 9,9 v17 h-372 z" fill="#FFEBE9"/>
