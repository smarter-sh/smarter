<text x="468" y="605.5" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#57606A" text-anchor="end" font-style="italic">the app waits for it</text>
<rect x="28" y="660" width="1244" height="112" rx="9" fill="#FFFFFF" stroke="#D0D7DE"/>
<path d="M28,669 a9,9 0 0 1 9,-9 h1226 a9,9 0 0 1 9,9 v17 h-1244 z" fill="#FFEBE9"/>
<text x="40" y="678" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#CF222E" text-anchor="start">Waits that still sleep in a task, against rule 2 (all on the infrastructure queue)</text>
<text x="40" y="702" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">verify_certificate: wait_until_issued(), 20 checks 30 s apart, up to 9½ minutes. Nothing queues it.</text>
<text x="40" y="719" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">register_custom_domain, verify_custom_domain: create_validation_records(), 120 checks 5 s apart, up to 10 minutes, then 2¼ minutes per record.</text>
<text x="40" y="736" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">create_custom_domain_dns_record: get_or_create_record(), 10 checks 15 s apart, up to 2¼ minutes.</text>
<text x="40" y="753" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#24292F" text-anchor="start">Each holds one of the infrastructure worker's 4 processes while it sleeps. deploy_default_api passes max_attempts=1, and complies.</text>
<rect x="28" y="784" width="1244" height="40" rx="9" fill="#FFFFFF" stroke="#D0D7DE"/>
