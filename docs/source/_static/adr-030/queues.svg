<text x="92" y="808" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">queues a task</text>
<path d="M207.3,804 h34" stroke="#8C959F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#head)"/>
<text x="251.3" y="808" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">the init Job; the app waiting for a result</text>
<path d="M543.5,804 h34" stroke="#1A7F37" stroke-width="1.8" marker-end="url(#head-green)"/>
<text x="587.5" y="808" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606A" text-anchor="start">the worker takes it; its result</text>
