<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 840" width="1300" height="840" role="img" aria-labelledby="t d">
<title id="t">Smarter's task queues, as built</title>
<desc id="d">Three columns. The senders: the app, which queues tasks from its brokers, chats and signals; Celery Beat, whose 20 schedule entries name 14 operational tasks and 6 infrastructure tasks; the infrastructure tasks themselves, which check again later with apply_async and a countdown; and the init Job. The queues, all in Redis's database 0: default_celery_task_queue with 33 operational tasks, infrastructure_celery_task_queue with 22 infrastructure tasks, and tools_celery_task_queue with one task, run_tool_call, whose results the app waits for in the result backend, also in Redis. The workers: smarter-worker runs the default queue and smarter-worker-infrastructure the infrastructure queue; both register all 56 of the platform's tasks, so either would run any task that lands on its queue. smarter-worker-tools runs the tools queue, and registers only run_tool_call. Four infrastructure tasks still wait by sleeping, against the ADR's second rule: verify_certificate, up to nine and a half minutes, though nothing queues it; register_custom_domain and verify_custom_domain, up to ten minutes for a certificate's validation records and two and a quarter minutes for each record; and create_custom_domain_dns_record, two and a quarter minutes.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C959F"/></marker><marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2980B9"/></marker></defs>
