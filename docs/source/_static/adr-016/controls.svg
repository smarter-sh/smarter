<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" width="1300" height="600" role="img" aria-labelledby="t d">
<title id="t">Smarter's security controls, layer by layer</title>
<desc id="d">Six panels, one per layer, each listing its controls with a state: in place, partial, or a known gap. 1 · The request, owned by Django first: ADR-016: TLS at Traefik, HSTS, X-Forwarded-Proto (done); unknown hosts refused: SmarterSecurityMiddleware (done); CORS and CSRF per deployed LLMClient (done); Secure, HttpOnly, SameSite session cookie (done); API keys stored as a digest; rate limits (done); sensitive files and 404 scanners blocked (done); Content Security Policy: report-only (partial). 2 · AI and tools, owned by ADR-038, the security pages: guardrails on prompts and replies (done); safe_http: public addresses only (SSRF) (done); tool calls in a worker with no credentials (done); the extension registry's index is signed (done); an Extension stays loaded in its process (gap); MCP catalogs, custom endpoints: in the app (gap). 3 · Data and secrets, owned by ADR-007, the security pages: Smarter Secrets encrypted with Fernet (done); settings' credentials are SecretStr: no test (partial); no secret, credential or PII in a log (done); backups and exports: private, encrypted S3 (done); Redis's password generated per environment (done); volumes, Kubernetes Secrets: not encrypted (gap). 4 · The pods, owned by the Helm chart, ADR-038: non-root, read-only root, no capabilities (done); seccomp RuntimeDefault, no escalation (done); startup checks refuse an unsafe start (done); the tool worker: no token, no IAM role (done); one Secret, ServiceAccount, IAM role: phase 3 (gap); the app writes to the cluster itself (gap). 5 · The network and the queues, owned by Calico, ADR-030, ADR-038: default deny; other namespaces kept out (done); MariaDB and Redis: the platform's pods only (done); egress open on 443: the proxy is phase 4 (gap); any Redis client can queue any task (gap); no Redis ACL: sessions readable by all (gap). 6 · The supply chain, owned by ADR-015, supply-chain.rst: exact pins with hashes; 14-day cooldown (done); pip-audit on every pull request (done); signed image and chart; SBOM, provenance (done); GitHub Actions pinned by SHA (done); no long-lived AWS keys but SES's (done); a bad package still runs in every pod (partial).</desc>
