---
#------------------------------------------------------------------------------
# Read a Kubernetes secret into the job's environment.
#
# Each key of the secret's data becomes an environment variable of the steps
# that follow, named in upper case (mysql_password becomes MYSQL_PASSWORD), for
# deploy/action.yml to pass to Helm.
#
# Every value is masked (::add-mask::) before it is written, so GitHub prints
# *** wherever it appears later in the log. GitHub masks only the repository's
# own secrets on its own: a value read from Kubernetes is printed in the clear
# unless it is masked here. This repository is public, and so are its
# workflow logs.
#
# Nothing is echoed but the secret's name, its namespace and its key names.
# Its metadata isn't: a secret created with kubectl apply carries the whole
# secret, base64 encoded, in its last-applied-configuration annotation.
#------------------------------------------------------------------------------
name: k8s get environment secret
description: Read a Kubernetes secret into masked environment variables.
branding:
  icon: "cloud"
  color: "orange"
inputs:
  eks-namespace:
    description: "The Kubernetes namespace of the secret. Example: smarter-ubc-prod"
    required: true
    type: string
  eks-secret-name:
    description: "The name of a secret stored in the Kubernetes cluster. Example: mysql-root"
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Read the secret into masked environment variables
      id: transform-secret
      shell: bash
      env:
        SECRET_NAME: ${{ inputs.eks-secret-name }}
        SECRET_NAMESPACE: ${{ inputs.eks-namespace }}
      run: |-
        set -euo pipefail
        secret_json=$(kubectl get secret "$SECRET_NAME" -n "$SECRET_NAMESPACE" -o json)

        echo "k8s secret $SECRET_NAMESPACE/$SECRET_NAME, keys:"
        while IFS= read -r key; do
          value=$(jq -r --arg k "$key" '.data[$k] | @base64d' <<<"$secret_json")
          # mask each line of the value, and the whole value, before anything can print it
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::add-mask::$line"
            fi
          done <<<"$value"
          name=$(tr '[:lower:]' '[:upper:]' <<<"$key")
          # the multiline syntax of GITHUB_ENV, with a random delimiter, so that a value
          # containing a newline or an equals sign can't add or change another variable
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "$name<<$delimiter"
            printf '%s\n' "$value"
            echo "$delimiter"
          } >>"$GITHUB_ENV"
          echo "  $name"
        done < <(jq -r '.data // {} | keys[]' <<<"$secret_json")
