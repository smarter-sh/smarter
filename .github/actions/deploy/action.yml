name: Deploy to Kubernetes
description: "Deploy the application to the specified Kubernetes environment"
branding:
  icon: "play-circle"
  color: "green"
inputs:
  ref:
    description: "The tag to check out and deploy, e.g. v0.36.26. Empty checks out the commit that started the run."
    required: false
    default: ""
  namespace-base:
    description: "The base name for the Kubernetes namespace (the environment name - alpha, beta, prod - will be appended to this)"
    required: false
    default: "smarter-ubc"
  anthropic-api-key:
    description: "The Anthropic API key"
    required: true
  authentication-backends:
    description: "The authentication backends to enable"
    required: false
  cohere-api-key:
    description: "The Cohere API key"
    required: false
  aws-access-key-id:
    description: "The AWS access key ID"
    required: true
  aws-secret-access-key:
    description: "The AWS secret access key"
    required: true
  aws-region:
    description: "The AWS region to deploy to"
    required: true
  aws-iam-role-arn:
    description: "The IAM role (IRSA) of the platform's pods. When set, the pods get no AWS access keys: the keys only deploy."
    required: false
  aws-backup-iam-role-arn:
    description: "The IAM role (IRSA) of the MariaDB backup CronJob"
    required: false
  brave-search-api-key:
    description: "The Brave Search API key"
    required: false
  debug-mode:
    description: "Whether to enable debug mode (true/false)"
    required: false
    default: "false"
  dockerhub-username:
    description: "The DockerHub username"
    required: true
  dockerhub-pat:
    description: "The DockerHub personal access token"
    required: false
  dockerhub-tag:
    description: "The DockerHub tag to use for the Docker image"
    required: false
    default: "latest"
  environment:
    description: "The environment to deploy: alpha, beta, next, prod"
    required: true
  eks-cluster-name:
    description: "The name of the EKS cluster to deploy to"
    required: true
  extension-registry-public-key:
    description: "The Smarter Extension registry's base64 Ed25519 public key. Empty disables the registry"
    required: false
  fernet-encryption-key:
    description: "The Fernet encryption key"
    required: true
  fireworks-api-key:
    description: "The Fireworks API key"
    required: false
  gemini-api-key:
    description: "The Gemini API key"
    required: true
  google-service-account-b64:
    description: "The Google service account in base64 encoding"
    required: true
  google-maps-api-key:
    description: "The Google Maps API key"
    required: true
  llama-api-key:
    description: "The MetaAI Llama API key"
    required: true
  mistral-api-key:
    description: "The Mistral API key"
    required: false
  openai-api-key:
    description: "The OpenAI API key"
    required: true
  platform-subdomain:
    description: "The platform subdomain to use in constructing URLs and email addresses"
    required: true
  pinecone-api-key:
    description: "The Pinecone API key"
    required: true
  root-domain:
    description: "The root domain for the deployment: e.g. smarter.sh"
    required: true
  smarter-branding-address1:
    description: "The first line of the address to use in the branding info"
    required: false
  smarter-branding-address2:
    description: "The second line of the address to use in the branding info"
    required: false
  smarter-branding-city:
    description: "The city to use in the branding info"
    required: false
  smarter-branding-state:
    description: "The state to use in the branding info"
    required: false
  smarter-branding-postal-code:
    description: "The postal code to use in the branding info"
    required: false
  smarter-branding-country:
    description: "The country to use in the branding info"
    required: false
  smarter-branding-currency:
    description: "The currency to use in the branding info"
    required: false
  smarter-branding-timezone:
    description: "The timezone to use in the branding info"
    required: false
  smarter-branding-contact-url:
    description: "The contact URL to use in the branding info"
    required: false
  smarter-branding-corporate-name:
    description: "The corporate name to use in the branding info"
    required: false
  smarter-branding-support-email:
    description: "The support email to use in the branding info"
    required: false
  smarter-branding-primary-contact:
    description: "The name of the technical point of contact to use in the branding info"
    required: false
  smarter-branding-support-hours:
    description: "The support hours to use in the branding info"
    required: false
  smarter-branding-support-phone-number:
    description: "The support phone number to use in the branding info"
    required: false
  smarter-cache-expiration:
    description: "The cache expiration time in seconds for all cacheable views"
    required: false
  smarter-email-admin:
    description: "The admin email to use in the branding info"
    required: false
  smarter-enable-web-console-terminal:
    description: "True to enable the web console terminal feature in the Smarter platform"
    required: true
  smarter-static-files-on-cdn:
    description: "True to upload the static files to the environment's S3 bucket on each deployment, and serve them from its CDN, cdn.<platform>. Empty: the chart's default, false, where the server serves them"
    required: false
  smarter-logo:
    description: "The URL to the Smarter logo image"
    required: true
  smarter-mariadb-backup-password:
    description: "The password of the read-only MariaDB account that the nightly backup dumps the database with. Empty: the backup dumps as root"
    required: false
  smarter-settings-output:
    description: "True to enable verbose console output of the settings at startup."
    required: true
    default: "false"
  slack-app-token:
    description: "The Slack app's app-level token (xapp-...) of the optional Slack bot. The bot is deployed only when slack-app-token, slack-bot-token and slack-bot-agent-url are all set"
    required: false
  slack-bot-agent-url:
    description: "The url of the deployed LLMClient that the optional Slack bot asks, e.g. https://smarter-developer.<account-number>.api.<root-domain>/"
    required: false
  slack-bot-token:
    description: "The Slack app's bot token (xoxb-...). The init Job and the nightly backup post their logs with it, to slack-notify-channel. The optional Slack bot also uses it, and is deployed only when slack-app-token, slack-bot-token and slack-bot-agent-url are all set"
    required: false
  slack-notify-channel:
    description: "The Slack channel, e.g. smarter, that the init Job and the nightly backup post their results and logs to, with slack-bot-token. The bot must be in the channel, with the chat:write and files:write scopes. Empty: they don't post"
    required: false
    default: ""
  social-auth-google-oauth2-key:
    description: "The Google OAuth2 key"
    required: true
  social-auth-google-oauth2-secret:
    description: "The Google OAuth2 secret"
    required: true
  social-auth-github-key:
    description: "The GitHub OAuth2 key"
    required: true
  social-auth-github-secret:
    description: "The GitHub OAuth2 secret"
    required: true
  social-auth-linkedin-oauth2-key:
    description: "The LinkedIn OAuth2 key"
    required: true
  social-auth-linkedin-oauth2-secret:
    description: "The LinkedIn OAuth2 secret"
    required: true
  tavily-api-key:
    description: "The Tavily web search API key, which WebsearchPlugins such as smarter_project_websearch use"
    required: false
  togetherai-api-key:
    description: "The TogetherAI API key"
    required: false
  tool-worker-enabled:
    description: "Deploy the tool worker, smarter-worker-tools (the chart's workerTools.enabled, ADR-038), and send every LLM tool call to it, rather than run tool calls in the app's pods, where the platform's credentials are. It needs smarter-infrastructure's network policies for the application-group smarter-tools, or it can't reach Redis. false: the app runs tool calls itself"
    required: false
    default: "true"

runs:
  using:
    "composite"
    # -------------------------------------------------------------------------
    # This action is designed to be run on an ephemeral Ubuntu Linux runner.
    # We start with a clean environment and install and configure all the
    # tools we need for this job.
    #
    # The runner is destroyed after the job completes, so we don't need to
    # worry about cleaning up after ourselves.
    # -------------------------------------------------------------------------
  steps:
    - name: Cache Helm dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/helm
          helm/charts/smarter/charts
        key: helm-${{ runner.os }}-${{ hashFiles('helm/charts/smarter/Chart.yaml') }}-${{ hashFiles('helm/charts/smarter/requirements.yaml') }}
        restore-keys: |
          helm-${{ runner.os }}-

    # Initialize environment variables that are derived from the inputs
    - name: Initialize environment variables
      shell: bash
      run: |-
        echo "NAMESPACE=${{ inputs.namespace-base }}-${{ inputs.environment }}" >> $GITHUB_ENV
        echo "DJANGO_SETTINGS_MODULE=${{ env.DJANGO_SETTINGS_BASE }}.${{ inputs.environment }}" >> $GITHUB_ENV
        # The broker's url isn't set here: the chart builds it from Redis's password, which
        # smarter-infrastructure generates in the Secret smarter-redis-password (ADR-030, rule 5).
      env:
        DJANGO_SETTINGS_BASE: smarter.settings

    # Checkout all code referenced by this action
    - name: Checkout code
      id: checkout_code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # A release's tag comes after the commit that started the run (see
        # build.yml), whose own latest tag is the previous release.
        ref: ${{ inputs.ref }}
        fetch-depth: 0 # Ensures all history and tags are fetched
        fetch-tags: true

    - name: Get latest release version
      id: get-latest-version-tag
      shell: bash
      run: |
        VERSION_TAG=$(git describe --tags --abbrev=0)
        echo "TAG=$VERSION_TAG" >> $GITHUB_ENV

    - name: Set version
      id: set-version
      shell: bash
      run: |
        python scripts/bump_version.py $TAG --cicd

    # authenticate AWS CLI
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    # put an entry in the run log to show the aws cli version and the IAM user
    - name: Check awscli version and identity
      id: awscli-version
      shell: bash
      run: |-
        echo "aws cli version:"
        echo "----------------"
        aws --version
        echo
        echo "aws IAM user:"
        echo "-------------"
        aws sts get-caller-identity

    # install jq, which k8s-get-secret will use to parse the Kubernetes secret
    # and set the environment variables
    - name: Install jq and kubectl
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y jq kubectl

    # setup kubeconfig using the aws eks helper command, 'update-kubeconfig'
    - name: Configure kubectl
      id: kubectl-configure
      shell: bash
      run: |-
        aws eks --region ${{ inputs.aws-region }} update-kubeconfig --name ${{ inputs.eks-cluster-name }} --alias ${{ inputs.eks-cluster-name }}
        echo "kubectl version and diagnostic info:"
        echo "------------------------------------"
        kubectl version

    # figure out the Docker image to add to the Helm values for the
    # Kubernetes deployment manifest.
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    # set the Docker image to the environment variable SMARTER_DOCKER_IMAGE
    # echo "SMARTER_DOCKER_IMAGE=mcdaniel0073/smarter:v0.13.223" >> $GITHUB_ENV
    # example:  012345678903.dkr.ecr.us-east-1.amazonaws.com/smarter-platform-alpha:latest
    # echo "SMARTER_DOCKER_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:latest" >> $GITHUB_ENV
    - name: Set Docker image
      id: set-docker-image
      shell: bash
      run: |-
        echo "SMARTER_DOCKER_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:${{ inputs.dockerhub-tag }}" >> $GITHUB_ENV
      env:
        AWS_ECR_REPO: ${{ env.NAMESPACE }}

    # Stop before touching the cluster if the image hasn't been built. Without
    # this, helm upgrade succeeds and the pods sit in ImagePullBackOff, e.g.
    # when Deploy is dispatched on main before semantic-release has tagged the
    # release (git describe then finds the merged alpha tag), or before Build
    # has pushed the new version.
    - name: Verify Docker image exists in ECR
      id: verify-docker-image
      shell: bash
      run: |-
        if ! aws ecr describe-images \
            --region "${{ inputs.aws-region }}" \
            --repository-name "$AWS_ECR_REPO" \
            --image-ids imageTag="$IMAGE_TAG" > /dev/null; then
          echo "::error::Image $AWS_ECR_REPO:$IMAGE_TAG is not in ECR. Run the Build workflow for this release first, or wait for semantic-release to tag the release and dispatch Deploy again (a re-run reuses the old commit)."
          exit 1
        fi
        echo "Found $AWS_ECR_REPO:$IMAGE_TAG in ECR."
      env:
        AWS_ECR_REPO: ${{ env.NAMESPACE }}
        IMAGE_TAG: ${{ inputs.dockerhub-tag }}

    # extract the mysql configuration from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # MYSQL_HOST: mysql.service.lawrencemcdaniel.com
    # MYSQL_PORT: 3306
    # MYSQL_DATABASE: smarter_api_dev
    # MYSQL_USER: smarter_api_dev
    # MYSQL_PASSWORD: top-secret-password
    - name: Configure MariaDB from Kubernetes secret
      id: get-mysql-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: mysql-smarter

    # extract the mysql root configuration from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # MYMYSQL_ROOT_USERNAMESQL_USER: root
    # MYSQL_ROOT_PASSWORD: top-secret-password
    - name: Configure MariaDB from Kubernetes secret
      id: get-mysql-root-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: mysql-root

    # extract the Django admin user credentials from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # SMARTER_ADMIN_USERNAME: admin
    # SMARTER_ADMIN_PASSWORD: top-secret-password
    - name: Configure admin user from Kubernetes secret
      id: get-admin-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: smarter-admin

    # extract the Django SMTP email from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # SMTP_HOST: email-smtp.us-east-1.amazonaws.com
    # SMTP_PORT: "587"
    # SMTP_USE_SSL: "false"
    # SMTP_USE_TLS: "true"
    # SMTP_USERNAME: an IAM key-pair id
    # SMTP_PASSWORD: an IAM key-pair secret
    - name: Configure SMTP email credentials from Kubernetes secret
      id: get-aws-ses-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: aws-ses-config

    # extract the Django application secret from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # SECRET_KEY: top-secret-key
    - name: Configure django secret from Kubernetes secret
      id: get-django-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: smarter-django-secret-key

    - name: Create AWS S3 Bucket name
      id: create-s3-bucket-name
      shell: bash
      run: |-
        # create S3 bucket name based on environment
        if [ "${{ inputs.environment }}" = "prod" ]; then
          S3_BUCKET="${{ inputs.platform-subdomain }}.${{ inputs.root-domain }}"
        else
          S3_BUCKET="${{ inputs.environment }}.${{ inputs.platform-subdomain }}.${{ inputs.root-domain }}"
        fi
        echo "SMARTER_S3_BUCKET=${S3_BUCKET}" >> $GITHUB_ENV
        # database backups go to a private bucket, never to the public-read environment
        # bucket above. smarter-infrastructure creates it (s3_backup_bucket_name).
        echo "SMARTER_SUBSYSTEM_SQL_BACKUP_S3_URI=s3://backups.${S3_BUCKET}/backups/sql" >> $GITHUB_ENV

    - name: Delete failed jobs
      id: delete-failed-jobs
      shell: bash
      run: |-
        kubectl delete job smarter-db-init-job --namespace ${{ env.NAMESPACE }} || true

    - name: Create secrets values file
      id: create-json
      shell: bash
      run: |
        cat > /tmp/values.json <<EOF
        {
          "deployTimestamp": "$(date +%s)",
          "env": {
            "AWS_ACCESS_KEY_ID": ${{ !inputs.aws-iam-role-arn && inputs.aws-access-key-id && format('"{0}"', inputs.aws-access-key-id) || 'null' }},
            "AWS_REGION": ${{ inputs.aws-region && format('"{0}"', inputs.aws-region) || 'null' }},
            "AWS_SECRET_ACCESS_KEY": ${{ !inputs.aws-iam-role-arn && inputs.aws-secret-access-key && format('"{0}"', inputs.aws-secret-access-key) || 'null' }},
            "SMARTER_DEBUG_MODE": ${{ inputs.debug-mode && format('"{0}"', inputs.debug-mode) || 'null' }},
            "DJANGO_AUTHENTICATION_BACKENDS": ${{ inputs.authentication-backends && format('"{0}"', inputs.authentication-backends) || 'null' }},
            "DJANGO_SECRET_KEY": ${{ env.SECRET_KEY && format('"{0}"', env.SECRET_KEY) || 'null' }},
            "DJANGO_SETTINGS_MODULE": ${{ env.DJANGO_SETTINGS_MODULE && format('"{0}"', env.DJANGO_SETTINGS_MODULE) || 'null' }},
            "DOCKERHUB_PAT": ${{ inputs.dockerhub-pat && format('"{0}"', inputs.dockerhub-pat) || 'null' }},
            "DOCKERHUB_USERNAME": ${{ inputs.dockerhub-username && format('"{0}"', inputs.dockerhub-username) || 'null' }},
            "SMARTER_ENVIRONMENT": ${{ inputs.environment && format('"{0}"', inputs.environment) || 'null' }},
            "SMARTER_APP_DASHBOARD_WEB_CONSOLE_TERMINAL_ENABLE": ${{ inputs.smarter-enable-web-console-terminal && (inputs.smarter-enable-web-console-terminal == 'true' && 'true' || 'false') || 'null' }},
            "SMARTER_APP_LLMTOOL_EXTENSION_REGISTRY_PUBLIC_KEY": ${{ inputs.extension-registry-public-key && format('"{0}"', inputs.extension-registry-public-key) || 'null' }},
            "SMARTER_DOCKER_IMAGE": ${{ env.SMARTER_DOCKER_IMAGE && format('"{0}"', env.SMARTER_DOCKER_IMAGE) || 'null' }},
            "SMARTER_PLATFORM_ADMIN_PASSWORD": ${{ env.SMARTER_ADMIN_PASSWORD && format('"{0}"', env.SMARTER_ADMIN_PASSWORD) || 'null' }},
            "SMARTER_PLATFORM_ADMIN_USERNAME": ${{ env.SMARTER_ADMIN_USERNAME && format('"{0}"', env.SMARTER_ADMIN_USERNAME) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_ADDRESS1": ${{ inputs.smarter-branding-address1 && format('"{0}"', inputs.smarter-branding-address1) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_ADDRESS2": ${{ inputs.smarter-branding-address2 && format('"{0}"', inputs.smarter-branding-address2) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_CITY": ${{ inputs.smarter-branding-city && format('"{0}"', inputs.smarter-branding-city) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_CONTACT_URL": ${{ inputs.smarter-branding-contact-url && format('"{0}"', inputs.smarter-branding-contact-url) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_CORPORATE_NAME": ${{ inputs.smarter-branding-corporate-name && format('"{0}"', inputs.smarter-branding-corporate-name) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_COUNTRY": ${{ inputs.smarter-branding-country && format('"{0}"', inputs.smarter-branding-country) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_CURRENCY": ${{ inputs.smarter-branding-currency && format('"{0}"', inputs.smarter-branding-currency) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_LOGO": ${{ inputs.smarter-logo && format('"{0}"', inputs.smarter-logo) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_MARKETING_SITE_URL": "https://${{ inputs.root-domain }}",
            "SMARTER_PLATFORM_BRANDING_POSTAL_CODE": ${{ inputs.smarter-branding-postal-code && format('"{0}"', inputs.smarter-branding-postal-code) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_PRIMARY_CONTACT": ${{ inputs.smarter-branding-primary-contact && format('"{0}"', inputs.smarter-branding-primary-contact) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_STATE": ${{ inputs.smarter-branding-state && format('"{0}"', inputs.smarter-branding-state) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_SUPPORT_EMAIL": ${{ inputs.smarter-branding-support-email && format('"{0}"', inputs.smarter-branding-support-email) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_SUPPORT_HOURS": ${{ inputs.smarter-branding-support-hours && format('"{0}"', inputs.smarter-branding-support-hours) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_SUPPORT_PHONE_NUMBER": ${{ inputs.smarter-branding-support-phone-number && format('"{0}"', inputs.smarter-branding-support-phone-number) || 'null' }},
            "SMARTER_PLATFORM_BRANDING_TIMEZONE": ${{ inputs.smarter-branding-timezone && format('"{0}"', inputs.smarter-branding-timezone) || 'null' }},
            "SMARTER_PLATFORM_EMAIL_ADMIN": ${{ inputs.smarter-email-admin && format('"{0}"', inputs.smarter-email-admin) || 'null' }},
            "SMARTER_PLATFORM_FERNET_ENCRYPTION_KEY": $(jq -Rn --arg v "${{ inputs.fernet-encryption-key }}" '$v'),
            "SMARTER_PLATFORM_ROOT_DOMAIN": ${{ inputs.root-domain && format('"{0}"', inputs.root-domain) || 'null' }},
            "SMARTER_PLATFORM_S3_BUCKET": ${{ env.SMARTER_S3_BUCKET && format('"{0}"', env.SMARTER_S3_BUCKET) || 'null' }},
            "SMARTER_PLATFORM_SETTINGS_OUTPUT": ${{ inputs.smarter-settings-output && format('"{0}"', inputs.smarter-settings-output) || 'null' }},
            "SMARTER_PLATFORM_STATIC_FILES_ON_CDN": ${{ inputs.smarter-static-files-on-cdn && (inputs.smarter-static-files-on-cdn == 'true' && 'true' || 'false') || 'null' }},
            "SMARTER_PLATFORM_SUBDOMAIN": ${{ inputs.platform-subdomain && format('"{0}"', inputs.platform-subdomain) || 'null' }},
            "SMARTER_SUBSYSTEM_CACHE_EXPIRATION": ${{ inputs.smarter-cache-expiration && format('"{0}"', inputs.smarter-cache-expiration) || 'null' }},
            "SMARTER_SUBSYSTEM_K8S_CLUSTER_NAME": ${{ inputs.eks-cluster-name && format('"{0}"', inputs.eks-cluster-name) || 'null' }},
            "SMARTER_SUBSYSTEM_K8S_NAMESPACE": ${{ env.NAMESPACE && format('"{0}"', env.NAMESPACE) || 'null' }},
            "SMARTER_SUBSYSTEM_SLACK_APP_TOKEN": ${{ inputs.slack-app-token && format('"{0}"', inputs.slack-app-token) || 'null' }},
            "SMARTER_SUBSYSTEM_SLACK_BOT_TOKEN": ${{ inputs.slack-bot-token && format('"{0}"', inputs.slack-bot-token) || 'null' }},
            "SMARTER_SUBSYSTEM_SMTP_HOST": ${{ env.SMTP_HOST && format('"{0}"', env.SMTP_HOST) || 'null' }},
            "SMARTER_SUBSYSTEM_SMTP_PASSWORD": ${{ env.SMTP_PASSWORD && format('"{0}"', env.SMTP_PASSWORD) || 'null' }},
            "SMARTER_SUBSYSTEM_SMTP_PORT": ${{ env.SMTP_PORT && format('"{0}"', env.SMTP_PORT) || 'null' }},
            "SMARTER_SUBSYSTEM_SMTP_SENDER": "no-reply@${{ inputs.root-domain }}",
            "SMARTER_SUBSYSTEM_SMTP_USERNAME": ${{ env.SMTP_USERNAME && format('"{0}"', env.SMTP_USERNAME) || 'null' }},
            "SMARTER_SUBSYSTEM_SMTP_USE_SSL": ${{ env.SMTP_USE_SSL && format('"{0}"', env.SMTP_USE_SSL) || 'null' }},
            "SMARTER_SUBSYSTEM_SMTP_USE_TLS": ${{ env.SMTP_USE_TLS && format('"{0}"', env.SMTP_USE_TLS) || 'null' }},
            "SMARTER_SUBSYSTEM_SOCIAL_AUTH_GITHUB_KEY": ${{ inputs.social-auth-github-key && format('"{0}"', inputs.social-auth-github-key) || 'null' }},
            "SMARTER_SUBSYSTEM_SOCIAL_AUTH_GITHUB_SECRET": ${{ inputs.social-auth-github-secret && format('"{0}"', inputs.social-auth-github-secret) || 'null' }},
            "SMARTER_SUBSYSTEM_SOCIAL_AUTH_GOOGLE_OAUTH2_KEY": ${{ inputs.social-auth-google-oauth2-key && format('"{0}"', inputs.social-auth-google-oauth2-key) || 'null' }},
            "SMARTER_SUBSYSTEM_SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET": ${{ inputs.social-auth-google-oauth2-secret && format('"{0}"', inputs.social-auth-google-oauth2-secret) || 'null' }},
            "SMARTER_SUBSYSTEM_SOCIAL_AUTH_LINKEDIN_OAUTH2_KEY": ${{ inputs.social-auth-linkedin-oauth2-key && format('"{0}"', inputs.social-auth-linkedin-oauth2-key) || 'null' }},
            "SMARTER_SUBSYSTEM_SOCIAL_AUTH_LINKEDIN_OAUTH2_SECRET": ${{ inputs.social-auth-linkedin-oauth2-secret && format('"{0}"', inputs.social-auth-linkedin-oauth2-secret) || 'null' }},
            "SMARTER_SUBSYSTEM_SQL_BACKUP_PASSWORD": ${{ inputs.smarter-mariadb-backup-password && format('"{0}"', inputs.smarter-mariadb-backup-password) || 'null' }},
            "SMARTER_SUBSYSTEM_SQL_DATABASE": ${{ env.SMARTER_MYSQL_DATABASE && format('"{0}"', env.SMARTER_MYSQL_DATABASE) || 'null' }},
            "SMARTER_SUBSYSTEM_SQL_HOST": ${{ env.MYSQL_HOST && format('"{0}"', env.MYSQL_HOST) || 'null' }},
            "SMARTER_SUBSYSTEM_SQL_PASSWORD": ${{ env.SMARTER_MYSQL_PASSWORD && format('"{0}"', env.SMARTER_MYSQL_PASSWORD) || 'null' }},
            "SMARTER_SUBSYSTEM_SQL_PORT": ${{ env.MYSQL_PORT && format('"{0}"', env.MYSQL_PORT) || 'null' }},
            "SMARTER_SUBSYSTEM_SQL_ROOT_PASSWORD": ${{ env.MYSQL_ROOT_PASSWORD && format('"{0}"', env.MYSQL_ROOT_PASSWORD) || 'null' }},
            "SMARTER_SUBSYSTEM_SQL_ROOT_USERNAME": ${{ env.MYSQL_ROOT_USERNAME && format('"{0}"', env.MYSQL_ROOT_USERNAME) || 'null' }},
            "SMARTER_SUBSYSTEM_SQL_USER": ${{ env.SMARTER_MYSQL_USERNAME && format('"{0}"', env.SMARTER_MYSQL_USERNAME) || 'null' }}
          }
        }
        EOF

    # the platform's bootstrap secrets (issue #1099): the Smarter Secrets that the init Job creates, by name,
    # which the chart puts in a Kubernetes Secret that only the init Job mounts, never in a pod's environment.
    # jq --arg quotes each value, and the inputs reach the script as variables, never pasted into its text.
    # Google's service account arrives base64 encoded; its Secret holds the json itself.
    - name: Add the bootstrap secrets to the values file
      id: bootstrap-secrets
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        BRAVE_SEARCH_API_KEY: ${{ inputs.brave-search-api-key }}
        COHERE_API_KEY: ${{ inputs.cohere-api-key }}
        FIREWORKS_API_KEY: ${{ inputs.fireworks-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GOOGLE_MAPS_API_KEY: ${{ inputs.google-maps-api-key }}
        GOOGLE_SERVICE_ACCOUNT_B64: ${{ inputs.google-service-account-b64 }}
        LLAMA_API_KEY: ${{ inputs.llama-api-key }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        PINECONE_API_KEY: ${{ inputs.pinecone-api-key }}
        TAVILY_API_KEY: ${{ inputs.tavily-api-key }}
        TOGETHERAI_API_KEY: ${{ inputs.togetherai-api-key }}
      run: |-
        GOOGLE_SERVICE_ACCOUNT=""
        if [ -n "$GOOGLE_SERVICE_ACCOUNT_B64" ]; then
          GOOGLE_SERVICE_ACCOUNT="$(printf '%s' "$GOOGLE_SERVICE_ACCOUNT_B64" | base64 -d)"
        fi
        jq \
          --arg anthropic_api_key "$ANTHROPIC_API_KEY" \
          --arg brave_search_api_key "$BRAVE_SEARCH_API_KEY" \
          --arg cohere_api_key "$COHERE_API_KEY" \
          --arg fireworks_api_key "$FIREWORKS_API_KEY" \
          --arg gemini_api_key "$GEMINI_API_KEY" \
          --arg google_maps_api_key "$GOOGLE_MAPS_API_KEY" \
          --arg google_service_account "$GOOGLE_SERVICE_ACCOUNT" \
          --arg llama_api_key "$LLAMA_API_KEY" \
          --arg mistral_api_key "$MISTRAL_API_KEY" \
          --arg openai_api_key "$OPENAI_API_KEY" \
          --arg pinecone_api_key "$PINECONE_API_KEY" \
          --arg tavily_api_key "$TAVILY_API_KEY" \
          --arg togetherai_api_key "$TOGETHERAI_API_KEY" \
          '.bootstrapSecrets = ($ARGS.named | with_entries(select(.value != "")))' \
          /tmp/values.json > /tmp/values_bootstrap.json
        mv /tmp/values_bootstrap.json /tmp/values.json

    # each kind of pod's own IAM role (ADR-038, phase 3, step 4), derived from the shared role's ARN by
    # smarter-infrastructure's naming (aws/terraform/smarter/iam-irsa.tf): <namespace>-smarter-irsa is the
    # shared role, <namespace>-smarter-<pod>-irsa each kind's. Celery Beat and the migrate Job get none.
    # An ARN of another shape is used as it is, for every kind, through serviceAccount.awsRoleArn.
    - name: Add each pod's IAM role to the values file
      shell: bash
      env:
        AWS_IAM_ROLE_ARN: ${{ inputs.aws-iam-role-arn }}
      run: |-
        jq --arg arn "$AWS_IAM_ROLE_ARN" '
          if ($arn | endswith("-smarter-irsa")) then
            ($arn | rtrimstr("-smarter-irsa")) as $prefix
            | .serviceAccount.awsRoleArns = (
                ["api", "worker", "worker-infrastructure", "job-init"]
                | map({key: ., value: "\($prefix)-smarter-\(.)-irsa"})
                | from_entries
              )
          else . end
        ' /tmp/values.json > /tmp/values_roles.json
        mv /tmp/values_roles.json /tmp/values.json

    - name: Convert values file from json to yaml
      id: convert-to-yaml
      shell: bash
      run: |-
        cat /tmp/values.json | jq . > /tmp/values_clean.json && mv /tmp/values_clean.json /tmp/values.json
        cat /tmp/values.json | yq eval -P --input-format=json > /tmp/values.yaml

    # see: https://github.com/helm/helm
    #      we're installing directly from the github repo amd64 binary
    - name: Install Helm
      id: helm-install
      shell: bash
      run: |-
        curl -LO https://get.helm.sh/helm-v3.14.2-linux-amd64.tar.gz
        tar -zxvf helm-v3.14.2-linux-amd64.tar.gz
        sudo mv linux-amd64/helm /usr/local/bin/helm

    - name: Update Helm charts
      id: helm-update
      shell: bash
      run: |-
        cd helm/charts/smarter
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add loki https://grafana.github.io/helm-charts
        helm repo add mariadb https://charts.bitnami.com/bitnami
        helm repo add mysql https://charts.bitnami.com/bitnami
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add redis https://charts.bitnami.com/bitnami
        helm repo update
        helm dependency update
        helm dependency build

    # Deploy the application to Kubernetes using Helm
    - name: Deploy
      id: deploy
      shell: bash
      run: |-
        helm upgrade --install --force smarter ./helm/charts/smarter/ \
          --namespace ${{ env.NAMESPACE }} \
          --timeout 900s \
          --set mysql.auth.rootPassword="${{ env.MYSQL_ROOT_PASSWORD }}" \
          --set mysql.auth.rootUsername="${{ env.MYSQL_ROOT_USERNAME }}" \
          --set mysql.auth.password="${{ env.SMARTER_MYSQL_PASSWORD }}" \
          --set mysql.auth.database="${{ env.SMARTER_MYSQL_DATABASE }}" \
          --set mysql.auth.username="${{ env.SMARTER_MYSQL_USERNAME }}" \
          --set mariadb.auth.rootPassword="${{ env.MYSQL_ROOT_PASSWORD }}" \
          --set mariadb.auth.rootUsername="${{ env.MYSQL_ROOT_USERNAME }}" \
          --set mariadb.auth.password="${{ env.SMARTER_MYSQL_PASSWORD }}" \
          --set mariadb.auth.database="${{ env.SMARTER_MYSQL_DATABASE }}" \
          --set mariadb.auth.username="${{ env.SMARTER_MYSQL_USERNAME }}" \
          --set global.image.pullPolicy="IfNotPresent" \
          --set databaseScheduledBackup.s3Uri="${{ env.SMARTER_SUBSYSTEM_SQL_BACKUP_S3_URI }}" \
          --set serviceAccount.awsRoleArn="${{ inputs.aws-iam-role-arn }}" \
          --set databaseScheduledBackup.awsRoleArn="${{ inputs.aws-backup-iam-role-arn }}" \
          --set serviceAccount.createClusterRole=false \
          --set workerTools.enabled=${{ inputs.tool-worker-enabled == 'true' }} \
          --set slackBot.enabled=${{ inputs.slack-bot-token != '' && inputs.slack-app-token != '' && inputs.slack-bot-agent-url != '' }} \
          --set slackBot.agentUrl="${{ inputs.slack-bot-agent-url }}" \
          --set databaseInit.notifySlackChannel="${{ inputs.slack-notify-channel }}" \
          --set databaseScheduledBackup.notifySlackChannel="${{ inputs.slack-notify-channel }}" \
          --values /tmp/values.yaml

    # Clean up secrets file
    - name: Clean up secrets
      if: always()
      shell: bash
      run: rm -f /tmp/values.yaml
