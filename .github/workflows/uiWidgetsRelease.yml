---
#------------------------------------------------------------------------------
# Publish @smarter.sh/ui-widgets (smarter/react/packages/smarter.sh-widgets) to
# npm, when semantic-release publishes a GitHub release (pushMain.yml), or by
# hand for such a release's tag.
#
# - The package's version is the platform's: the release's tag, without its
#   v. It is set here, as helmChartRelease.yml sets the Helm chart's, and not
#   committed: in the workspace, the package's version is the platform's
#   placeholder, 9999.9999.9999.dev9999, as in pyproject.toml, which the
#   web console's apps accept with their dependency, *.
# - A release from main is published with the latest dist-tag, and one from
#   another branch, such as next, with the next dist-tag. A prerelease
#   (0.36.0-alpha.1, 0.36.0-beta.2) is published with its channel's dist-tag,
#   alpha or beta, so that `npm install @smarter.sh/ui-widgets` never installs
#   a prerelease, and `@smarter.sh/ui-widgets@alpha` installs the newest one.
# - Checks out the release's tag, runs the package's unit tests, builds it,
#   checks the package (npm run check:dist), then publishes that same dist/.
# - Publishes only a release that changes the package. Every platform release
#   triggers this workflow, and most change only the platform. The changes job
#   finds the version that npm has on the release's dist-tag and compares that
#   version's tag with this one in the package's folder and those of
#   @smarter/common and @smarter/didyouknow, which its library bundles.
#   If nothing there changed, the publish job is skipped, and npm keeps the
#   earlier version. A manual run with force publishes regardless. A version
#   that has no tag in this repository, or a dist-tag that npm doesn't have
#   yet, is published.
#
# Publishing uses npm's trusted publishing (OIDC): no npm token is stored in
# the repository, and every version gets a provenance statement. Configure it
# once on npmjs.com: @smarter.sh/ui-widgets → Settings → Trusted publisher →
# GitHub Actions, repository smarter-sh/smarter, workflow uiWidgetsRelease.yml,
# environment npm. The npm environment can require a reviewer in this
# repository's settings. npm offers trusted publishing only for a package that
# exists, so its first version is published by hand.
#
# pushMain.yml's semantic-release step uses the PAT secret, not GITHUB_TOKEN,
# so the release that it creates triggers this workflow.
#------------------------------------------------------------------------------
name: Release @smarter.sh/ui-widgets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.36.0 or v0.36.0-alpha.1"
        required: true
        type: string
      force:
        description: "Publish even if the package didn't change since the last publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # npm trusted publishing and provenance.
  id-token: write

concurrency:
  group: npm-publish-ui-widgets
  cancel-in-progress: false

jobs:
  # Whether this release changes the package, and the version and dist-tag to
  # publish it with.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          # The whole history and every tag: to check whether the tag is on
          # main, and to compare it with the last published version's tag.
          fetch-depth: 0
          persist-credentials: false

      # main's releases are 0.36.0, and alpha's and beta's are
      # 0.36.0-alpha.1 and 0.36.0-beta.2. A release that isn't on main, such as
      # next's, gets the next dist-tag. Anything else isn't published.
      - name: Version and dist-tag
        id: version
        shell: bash
        run: |
          version="${TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
              dist_tag=latest
            else
              dist_tag=next
            fi
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          else
            echo "::error::$TAG is not a release (v1.2.3) or an alpha or beta prerelease (v1.2.3-alpha.4)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Version $version, dist-tag $dist_tag"

      # git diff compares the two tags' trees, so it works across branches,
      # e.g. from 0.36.7-alpha.1 to 0.36.8-alpha.1 after a merge from main.
      - name: Changes since the last publish
        id: changes
        shell: bash
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          FORCE: ${{ inputs.force || false }}
        run: |
          paths=(smarter/react/packages/smarter.sh-widgets smarter/react/packages/smarter-common smarter/react/packages/smarter-didyouknow)
          published="$(npm view @smarter.sh/ui-widgets "dist-tags.$DIST_TAG" 2>/dev/null || true)"
          if [[ "$FORCE" == "true" ]]; then
            publish=true
            reason="the run was started with force"
          elif [[ -z "$published" ]]; then
            publish=true
            reason="npm has no $DIST_TAG version"
          elif ! git rev-parse -q --verify "refs/tags/v$published" >/dev/null; then
            publish=true
            reason="the $DIST_TAG version, $published, has no tag in this repository"
          elif git diff --quiet "refs/tags/v$published" "refs/tags/$TAG" -- "${paths[@]}"; then
            publish=false
            reason="nothing changed since $published, the $DIST_TAG version"
          else
            publish=true
            reason="changed since $published, the $DIST_TAG version"
            git diff --stat "refs/tags/v$published" "refs/tags/$TAG" -- "${paths[@]}"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish=$publish: $reason"
          if [[ "$publish" == "false" ]]; then
            {
              echo "### Skipped @smarter.sh/ui-widgets@${TAG#v}"
              echo ""
              echo "Not published: $reason, in ${paths[*]}."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smarter/react/package-lock.json

      - name: npm ci
        working-directory: smarter/react
        run: npm ci --include=dev

      # The library bundles @smarter/common's gettext() and @smarter/didyouknow's
      # facts, from their builds.
      - name: Build @smarter/common and @smarter/didyouknow
        working-directory: smarter/react
        run: |
          npm run build --workspace=@smarter/common
          npm run build:lib --workspace=@smarter/didyouknow

      - name: Unit tests
        working-directory: smarter/react
        run: npx vitest run --project smarter.sh-widgets

      - name: Build and check
        working-directory: smarter/react
        env:
          NODE_ENV: production
        run: |
          npm run build:lib --workspace=@smarter.sh/ui-widgets
          npm run check:dist --workspace=@smarter.sh/ui-widgets

      # npm pkg set only edits package.json. npm version would also update the
      # workspace. The committed version is the platform's placeholder,
      # 9999.9999.9999.dev9999, which the apps' dependency, *, accepts.
      - name: Set the package's version
        working-directory: smarter/react/packages/smarter.sh-widgets
        run: npm pkg set version="${{ needs.changes.outputs.version }}"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      # --ignore-scripts: publish the dist/ that was just checked.
      - name: Publish to npm
        working-directory: smarter/react/packages/smarter.sh-widgets
        run: npm publish --ignore-scripts --access public --provenance --tag "${{ needs.changes.outputs.dist_tag }}"

      - name: Summary
        shell: bash
        run: |
          version="${{ needs.changes.outputs.version }}"
          {
            echo "### Published @smarter.sh/ui-widgets@$version"
            echo ""
            echo "- npm: https://www.npmjs.com/package/@smarter.sh/ui-widgets/v/$version (dist-tag ${{ needs.changes.outputs.dist_tag }})"
          } >> "$GITHUB_STEP_SUMMARY"
