---
#------------------------------------------------------------------------------
# Build: the first step after a pull request is merged into main.
#
# The pipeline is four workflows, each starting the next when it succeeds:
#
#   test.yml      Test     on every pull request to main, before the merge
#   build.yml     Build    on every push to main (this workflow)
#   deploy.yml    Deploy   when Build succeeds on main
#   publish.yml   Publish  when Deploy succeeds on main
#
# This workflow's jobs:
#
#   release     semantic-release: version, CHANGELOG, tag, GitHub release.
#               On alpha and beta it makes prereleases (v0.36.26-alpha.1),
#               and on next and next-major releases on their own channels.
#               Nothing else runs for those branches.
#   image       the Docker image of the release, to ECR and Docker Hub
#   helm        the Helm chart of the release, to GHCR, signed with Cosign,
#               and attached to the GitHub release
#   handoff     the release's tag, as the release-info artifact, which
#               deploy.yml reads
#   merge-main  main, merged back into next, next-major, alpha and beta, and
#               the release pushed to its major version's branch (v0)
#
# A push whose commits call for no release (only docs, ci, chore, refactor,
# test commits, and so on, see release.config.js) builds and deploys nothing.
#
# The jobs after release check out the release's tag, not github.sha:
# semantic-release's commit comes after the merge commit that started the run,
# so github.sha would build the previous version.
#
# Started by hand, it also builds without a new release: the given tag, or the
# branch's head, versioned as its latest tag. On a development branch (alpha,
# beta, next) the image goes to that environment's ECR repository, and the
# chart is not released. From main, Deploy and Publish follow.
#
# IMPORTANT: Before running this workflow, ensure that you have first built your
# AWS infrastructure using the [Smarter Infrastructure repository](https://github.com/smarter-sh/smarter-infrastructure).
# Additionally, make sure the following secrets are configured in your
# [GitHub repository settings](https://github.com/smarter-sh/smarter/settings/secrets/actions):
#
# AWS_ACCESS_KEY_ID
# AWS_REGION
# AWS_SECRET_ACCESS_KEY
# PAT (semantic-release, so that its tag and GitHub release trigger
#      uiChatRelease.yml and uiWidgetsRelease.yml; the chart's GHCR login;
#      the merge-back)
# DOCKERHUB_USERNAME, DOCKERHUB_PAT, DOCKERHUB_ACCOUNT, DOCKERHUB_REPO
# COSIGN_KEY, COSIGN_PASSWORD
#------------------------------------------------------------------------------
name: Build

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - next
      - next-major
  workflow_dispatch:
    inputs:
      tag:
        description: "A tag to build, e.g. v0.36.26. Empty builds the branch's head."
        required: false
        type: string
        default: ""

# One run at a time per branch. A merge while a release runs waits for it, and
# the next run releases everything since the last tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ROOT_DOMAIN: "smarter.sh"
  PLATFORM_SUBDOMAIN: "ubc"
  ENVIRONMENT: "prod"
  AWS_ECR_REPO: "no-value"
  DATESTAMP: "no-value"
  LATEST_RELEASE: "no-value"
  MAJOR_RELEASE: "0"
  MINOR_RELEASE: "0"
  PATCH_RELEASE: "0"
  PRERELEASE: ""

jobs:
  #----------------------------------------------------------------------------
  # semantic-release. The PAT secret, rather than GITHUB_TOKEN, makes its tag
  # and GitHub release trigger other workflows, such as uiChatRelease.yml.
  #----------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      major: ${{ steps.semantic.outputs.new_release_major_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm install
        shell: bash

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v5
        id: semantic
        with:
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'next-major',
              {
                name: 'beta',
                prerelease: true
              },
              {
                name: 'alpha',
                prerelease: true
              }
            ]
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Semantic release"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Last release: ${{ steps.semantic.outputs.last_release_version || 'none' }}"
            echo "- New release: ${{ steps.semantic.outputs.new_release_version || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  #----------------------------------------------------------------------------
  # The Docker image: after a release on main, or whenever started by hand.
  #----------------------------------------------------------------------------
  image:
    needs: release
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-latest-version-tag.outputs.tag }}
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || needs.release.outputs.tag || github.ref }}
          fetch-depth: 0 # Ensures all history and tags are fetched
          fetch-tags: true

      - name: Set environment variable
        shell: bash
        id: setenv
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/alpha" ]]; then
            echo "ENVIRONMENT=alpha" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/beta" ]]; then
            echo "ENVIRONMENT=beta" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/next" ]]; then
            echo "ENVIRONMENT=next" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "This workflow can only run on alpha, beta, next, or main branches"
            exit 1
          fi

      - name: Initialize environment variables
        shell: bash
        run: |
          echo "NAMESPACE=smarter-${{ env.PLATFORM_SUBDOMAIN }}-${{ env.ENVIRONMENT }}" >> $GITHUB_ENV
          echo "AWS_ECR_REPO=smarter-${{ env.PLATFORM_SUBDOMAIN }}-${{ env.ENVIRONMENT }}" >> $GITHUB_ENV

      - name: Get latest release version
        id: get-latest-version-tag
        shell: bash
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0)
          echo "TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Set version
        id: set-version
        shell: bash
        run: |
          python scripts/bump_version.py $TAG --cicd

      # Log in to Docker Hub for the final step, which copies the image there.
      - name: Login to Docker Hub
        id: login-dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # QEMU's binfmt image, Buildx's BuildKit image and the Dockerfile's
      # python base image all come from the ECR Public Gallery, so that Docker
      # Hub's token service (auth.docker.io) timing out can't fail the build.
      # Anonymous ECR Public pulls have a monthly data quota per source IP,
      # which other users of GitHub's shared runner IPs exhaust ("toomanyrequests:
      # Data limit exceeded"). Authenticated pulls count against this AWS
      # account instead. ECR Public's auth endpoint exists only in us-east-1.
      # The IAM user needs ecr-public:GetAuthorizationToken and
      # sts:GetServiceBearerToken. If the login fails, the pulls fall back to
      # anonymous ones.
      - name: Login to Amazon ECR Public
        id: login-ecr-public
        continue-on-error: true
        shell: bash
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          image: public.ecr.aws/vend/tonistiigi/binfmt:latest

      # Get the latest release tag and append branch name for non-main branches
      # example: v0.14.0-alpha.27
      #
      - name: Get latest release version and parse tag components
        id: get-latest-release
        shell: bash
        run: |

          LATEST_RELEASE=$(git describe --tags --abbrev=0)
          TAG_NO_PREFIX=${LATEST_RELEASE#v}
          # Extract prerelease if present
          if [[ "$TAG_NO_PREFIX" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PRERELEASE="${BASH_REMATCH[4]}"
          else
            MAJOR="0"; MINOR="0"; PATCH="0"; PRERELEASE=""
          fi

          # Compose tag variants
          MAJOR_RELEASE="v$MAJOR"
          MINOR_RELEASE="v$MAJOR.$MINOR"
          PATCH_RELEASE="v$MAJOR.$MINOR.$PATCH"

          # Remove leading '-' from prerelease if present
          if [[ -n "$PRERELEASE" ]]; then
            PRERELEASE_TAG="v$MAJOR.$MINOR.$PATCH$PRERELEASE"
          else
            PRERELEASE_TAG=""
          fi

          # Set FINAL_TAG: only append branch name if not a prerelease
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            FINAL_TAG="$LATEST_RELEASE"
          elif [[ -z "$PRERELEASE" ]]; then
            FINAL_TAG="${LATEST_RELEASE}.${GITHUB_REF_NAME}"
          else
            FINAL_TAG="$LATEST_RELEASE"
          fi
          echo "LATEST_RELEASE=$FINAL_TAG" >> $GITHUB_ENV

          echo "MAJOR_RELEASE=$MAJOR_RELEASE" >> $GITHUB_ENV
          echo "MINOR_RELEASE=$MINOR_RELEASE" >> $GITHUB_ENV
          echo "PATCH_RELEASE=$PATCH_RELEASE" >> $GITHUB_ENV
          echo "PRERELEASE=$PRERELEASE_TAG" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Check awscli version and identity
        id: awscli-version
        shell: bash
        run: |
          echo "aws cli version:"
          echo "----------------"
          aws --version
          echo
          echo "aws IAM user:"
          echo "-------------"
          aws sts get-caller-identity

      - name: Upgrade ECR Basic Scanning
        id: upgrade-ecr-scanning
        shell: bash
        run: |
          echo "Checking current ECR scanning version:"
          echo "-------------------------------------"
          current_setting=$(aws ecr get-account-setting --name BASIC_SCAN_TYPE_VERSION --query 'value' --output text 2>/dev/null || echo "CLAIR")
          echo "Current setting: $current_setting"
          if [ "$current_setting" != "AWS_NATIVE" ]; then
            echo "Upgrading to AWS_NATIVE scanning..."
            aws ecr put-account-setting --name BASIC_SCAN_TYPE_VERSION --value AWS_NATIVE
            echo "ECR scanning upgraded to AWS_NATIVE"
          else
            echo "ECR scanning already using AWS_NATIVE version"
          fi

      - name: Add to .env
        shell: bash
        run: |
          touch .env

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker image
        id: set-docker-image
        shell: bash
        run: |
          echo "SMARTER_DOCKER_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:latest" >> $GITHUB_ENV

      - name: Create the repository
        id: create-repo
        shell: bash
        run: |
          aws ecr describe-repositories --repository-names ${{ env.AWS_ECR_REPO }} || aws ecr create-repository --repository-name ${{ env.AWS_ECR_REPO }}

      - name: Get the date
        shell: bash
        run: |
          DATESTAMP=$(date +'%Y-%m-%dT%H-%M-%S')
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            DATESTAMP="${DATESTAMP}.${GITHUB_REF_NAME}"
          fi
          echo "DATESTAMP=$DATESTAMP" >> $GITHUB_ENV

      #------------------------------------------------------------------------
      # Build the React components, or restore them from the cache that
      # test.yml shares. On a cache hit, Node and the build are skipped.
      #
      # Vite writes the builds into smarter/smarter/static/react/, which the
      # Docker build copies into the image with the rest of ./smarter.
      #------------------------------------------------------------------------
      - name: Build React components
        id: react-build
        uses: ./.github/actions/react-build

      # -----------------------------------------------------------------------
      # Build and push to AWS ECR
      # Creates the tags of the following formats:
      # - latest
      # - 26594738590
      # - 2026-05-28T18-39-51.alpha
      # - v0.14.0-alpha.27.alpha
      #
      # -----------------------------------------------------------------------
      - name: Build and push to AWS ECR
        id: build-and-push-to-ecr
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:${{ env.LATEST_RELEASE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:${{ env.MAJOR_RELEASE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:${{ env.MINOR_RELEASE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:${{ env.PATCH_RELEASE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:${{ github.run_id }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:${{ env.DATESTAMP }}
          build-args: |
            ENVIRONMENT=${{ env.ENVIRONMENT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          ENVIRONMENT: ${{ env.ENVIRONMENT }}

      - name: Trigger ECR image scan
        id: trigger-scan
        shell: bash
        run: |
          echo "Triggering new image scan for latest tag..."
          aws ecr start-image-scan --repository-name ${{ env.AWS_ECR_REPO }} --image-id imageTag=latest || echo "Scan already in progress or failed"
          echo "ECR image scan triggered"

      # -----------------------------------------------------------------------
      # Copy the image to Docker Hub
      # Copies the multi-platform image that was just pushed to ECR, with its
      # attestations, instead of building it a second time. Uses the same tags
      # as ECR.
      # -----------------------------------------------------------------------
      - name: Push to Docker Hub
        id: push-to-dockerhub
        shell: bash
        run: |
          SOURCE="${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:${{ github.run_id }}"
          TARGET="${{ secrets.DOCKERHUB_ACCOUNT }}/${{ secrets.DOCKERHUB_REPO }}"
          docker buildx imagetools create \
            --tag "$TARGET:latest" \
            --tag "$TARGET:${{ env.LATEST_RELEASE }}" \
            --tag "$TARGET:${{ env.MAJOR_RELEASE }}" \
            --tag "$TARGET:${{ env.MINOR_RELEASE }}" \
            --tag "$TARGET:${{ env.PATCH_RELEASE }}" \
            --tag "$TARGET:${{ github.run_id }}" \
            --tag "$TARGET:${{ env.DATESTAMP }}" \
            "$SOURCE"

  #----------------------------------------------------------------------------
  # The Helm chart of the release, from main only: package it, push it to
  # GHCR, sign it with Cosign, verify the signature, and attach the package to
  # the GitHub release.
  #----------------------------------------------------------------------------
  helm:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.image.outputs.tag }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install oras and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -LO https://github.com/oras-project/oras/releases/download/v1.1.0/oras_1.1.0_linux_amd64.tar.gz
          tar -xzf oras_1.1.0_linux_amd64.tar.gz oras
          sudo mv oras /usr/local/bin/

      - name: Login to GHCR
        run: echo "${{ secrets.PAT }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Bitnami charts are served from Docker Hub's OCI registry. Anonymous
      # pulls share the runner's IP-based rate limit and fail with 429.
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PAT }}" | helm registry login registry-1.docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Set version
        id: set-version
        shell: bash
        run: |
          python scripts/bump_version.py ${{ needs.image.outputs.tag }} --cicd

      - name: Package and Push Chart
        run: |
          cd helm/charts/smarter
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          # `dependency update` downloads every chart into charts/; a following
          # `dependency build` would pull them all from Docker Hub a second time.
          helm dependency update --skip-refresh
          cd ../../..
          helm package helm/charts/smarter
          helm push smarter-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Login to GHCR for Cosign
        run: |
          echo "${{ secrets.PAT }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract Chart Version
        id: chart_version
        run: |
          VERSION=$(yq '.version' helm/charts/smarter/Chart.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get Chart Digest
        id: chart_digest
        run: |
          CHART_REF="ghcr.io/${{ github.repository_owner }}/charts/smarter:${{ steps.chart_version.outputs.version }}"
          DIGEST=$(oras manifest fetch --descriptor $CHART_REF | jq -r .digest)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Sign OCI Helm Chart with Cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_KEY }}" > cosign.key
          CHART_REF="ghcr.io/${{ github.repository_owner }}/charts/smarter@${{ steps.chart_digest.outputs.digest }}"
          cosign sign --yes --key cosign.key $CHART_REF

      - name: Verify OCI Helm Chart Signature
        run: |
          cosign verify --key sigstore/artifacthub-cosign.pub ghcr.io/${{ github.repository_owner }}/charts/smarter:${{ steps.chart_version.outputs.version }}

      - name: Attach the chart to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.image.outputs.tag }}
          files: smarter-*.tgz

  #----------------------------------------------------------------------------
  # Hand the release's tag to deploy.yml, which starts when this run succeeds
  # on main. A run that built nothing hands nothing, and Deploy then deploys
  # nothing.
  #----------------------------------------------------------------------------
  handoff:
    needs: [image, helm]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Write the release's tag
        shell: bash
        run: |
          mkdir -p release-info
          echo "${{ needs.image.outputs.tag }}" > release-info/tag
          echo "Handing ${{ needs.image.outputs.tag }} to Deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release-info
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info/
          retention-days: 7

  #----------------------------------------------------------------------------
  # Keep the long-lived branches in step with main, so that the next pull
  # request from alpha starts from the release, and push the release to its
  # major version's branch, e.g. v0. It needs only the release, and runs
  # alongside the image.
  #----------------------------------------------------------------------------
  merge-main:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          token: ${{ secrets.PAT }}

      - name: Push the release to its major version's branch
        shell: bash
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git push --force "https://x-access-token:${{ secrets.PAT }}@github.com/${GITHUB_REPOSITORY}.git" "$TAG^{commit}:refs/heads/v${{ needs.release.outputs.major }}"

      - name: Merge main into next
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: next

      - name: Merge main into next-major
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: next-major

      - name: Merge main into alpha
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: alpha

      - name: Merge main into beta
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ secrets.PAT }}
          source-branch: main
          target-branch: beta
