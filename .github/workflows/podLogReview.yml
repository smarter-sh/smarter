---
#------------------------------------------------------------------------------
# Daily Pod Log Review.
#
# Downloads the logs of a deployed environment's running pods (the app server,
# the Celery workers and beat), redacts credentials and personal data from
# them, and has Claude Code review them, following
# .github/prompts/pod-log-review.md and the smarter-pod-log-review skill.
# Claude diagnoses each problem against the code, and keeps the GitHub issues
# current through the Smarter Project MCP server: it opens an issue for a new
# problem, comments on an existing one only when it has new evidence, closes
# an issue that a merged pull request resolved, and may propose a small fix
# as a draft pull request.
#
# Runs daily, on the default branch, against prod, and by hand against any
# environment.
#
# Code. The workflow's Python scripts are in scripts/, the repository's home
# for code that workflows run: pod_log_redact.py, pod_log_review.py,
# pod_log_review_stream.py and pod_log_review_slack.py, which posts through
# slack_post.py like every workflow's Slack step. Their tests are in
# scripts/tests, and run on every pull request (test.yml). They use only the
# standard library, because the runner has no virtual environment, and run
# with "python3 -E -s": no PYTHONPATH, no user site-packages, but the
# script's own folder on sys.path, so that they import each other by name.
# The shell scripts that download the logs are the smarter-pod-log-review and
# smarter-kubectl skills' own, which also use them for reviews by hand.
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN             Claude Code, billed to a Claude subscription. Create it
#                                       with "claude setup-token". When it is set, it is used
#                                       instead of ANTHROPIC_API_KEY.
#   ANTHROPIC_API_KEY                   Claude Code, billed to Anthropic API credit, when
#                                       CLAUDE_CODE_OAUTH_TOKEN is not set.
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, EKS_CLUSTER_NAME
#                                       read the pods' logs (kubectl get, describe, logs).
#   PAT                                 a GitHub classic personal access token, ghp_...,
#                                       with the public_repo scope. It is sent only to the
#                                       MCP server, which writes the issues, comments and
#                                       pull requests with it.
#   SLACK_BOT_TOKEN                     optional: the Smarter Slack app's bot token. With it,
#                                       each run that wrote to GitHub posts one message to
#                                       #smarter, listing what it wrote, and a run that found
#                                       nothing to fix posts a clean bill of health. The bot
#                                       must be in the channel, with the chat:write scope.
#
# Safety. The logs are untrusted: anyone can put text into them. So:
#   - Claude never holds a credential that it could leak: the AWS credentials
#     and kubeconfig are removed before it starts, and the PAT is only in the
#     MCP server's configuration, outside the folders that Claude can read.
#   - Claude's tools are read-only, except the MCP server's GitHub tools: no
#     Edit or Write, no kubectl, no gh, no git push. Its permissions are in
#     .github/prompts/pod-log-review.settings.json. Those rules match command
#     text, so they are a first layer, not the boundary.
#   - The boundaries: Claude Code refuses reads outside the repository and the
#     log folder (blockReadsOutsideWorkingDirectories), and Harden-Runner
#     blocks every outbound connection except to the hosts this job needs, so
#     nothing that leaks into a command can leave the runner.
#   - The MCP server refuses to write a credential to GitHub, never changes an
#     existing branch or a file under .github/, and closes an issue only if
#     GitHub confirms that the pull request that resolved it was merged.
#   - Pull requests are drafts into alpha, where no workflow runs with secrets
#     on pull requests, and a maintainer reviews them.
#   - This repository's workflow logs are public: nothing from the logs is
#     printed, and no log is uploaded as an artifact. Only Claude's final
#     summary is shown, on the run's page.
#------------------------------------------------------------------------------
name: Pod Log Review

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: "The environment whose pods to review."
        required: true
        type: choice
        default: prod
        options:
          - prod
          - alpha
          - beta
          - next
      since:
        description: "How far back to read each pod's log, e.g. 25h. Empty reads all that each container kept."
        required: false
        type: string
        default: "25h"
      pr-base:
        description: "The branch that fix pull requests merge into."
        required: false
        type: string
        default: "alpha"
      max-new-issues:
        description: "The most issues to open."
        required: false
        type: string
        default: "5"
      max-comments:
        description: "The most comments to add to existing issues."
        required: false
        type: string
        default: "10"
      max-closed-issues:
        description: "The most issues to close."
        required: false
        type: string
        default: "5"
      max-pull-requests:
        description: "The most fix pull requests to open. 0 turns them off."
        required: false
        type: string
        default: "2"
      max-budget-usd:
        description: "The most that Claude Code may spend on this run, in US dollars."
        required: false
        type: string
        default: "5"
      dry-run:
        description: "Review and report only: write nothing to GitHub."
        required: false
        type: boolean
        default: false

concurrency:
  group: pod-log-review-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  NAMESPACE_BASE: "smarter-ubc"
  PLATFORM_SUBDOMAIN: "ubc"
  ROOT_DOMAIN: "smarter.sh"
  SINCE: ${{ github.event_name == 'schedule' && '25h' || inputs.since }}
  PR_BASE: ${{ inputs.pr-base || 'alpha' }}
  MAX_NEW_ISSUES: ${{ inputs.max-new-issues || '5' }}
  MAX_COMMENTS: ${{ inputs.max-comments || '10' }}
  MAX_CLOSED_ISSUES: ${{ inputs.max-closed-issues || '5' }}
  MAX_PULL_REQUESTS: ${{ inputs.max-pull-requests || '2' }}
  MAX_BUDGET_USD: ${{ inputs.max-budget-usd || '25' }}
  DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
  CLAUDE_CODE_VERSION: "2.1.316"
  CLAUDE_MODEL: "claude-opus-5-5"
  # The MCP server that holds the GitHub tools. It is the prod platform's,
  # whichever environment is reviewed.
  MCP_SERVER_URL: "https://ubc.smarter.sh/api/v1/mcp/smarter-project/"
  # Where to announce what the review wrote to GitHub. The Slack app's bot must be a member.
  SLACK_CHANNEL: "smarter"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Must be the first step. Blocks every outbound connection except to these hosts,
      # for the whole job: GitHub (checkout, Node.js), AWS (STS and the EKS API, for the
      # logs), npm (Claude Code), the Anthropic API, the MCP server, and Slack. Telemetry
      # is off because StepSecurity's report on a public repository's run is public, and
      # it would name the EKS API's host, which identifies the cluster.
      #
      # mcdaniel: that sha is actually the 'right' way to use this action.
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            *.amazonaws.com:443
            api.anthropic.com:443
            ubc.smarter.sh:443
            slack.com:443

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # every branch and tag: Claude reads the deployed release's code, and
          # looks for the merged pull requests that resolved an issue.
          fetch-depth: 0
          fetch-tags: true

      - name: Set the namespace and domain
        shell: bash
        run: |
          echo "NAMESPACE=${NAMESPACE_BASE}-${ENVIRONMENT}" >> "$GITHUB_ENV"
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "PLATFORM_DOMAIN=${PLATFORM_SUBDOMAIN}.${ROOT_DOMAIN}" >> "$GITHUB_ENV"
          else
            echo "PLATFORM_DOMAIN=${ENVIRONMENT}.${PLATFORM_SUBDOMAIN}.${ROOT_DOMAIN}" >> "$GITHUB_ENV"
          fi
          echo "LOG_DIR=$RUNNER_TEMP/pod-logs" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # The output names the cluster's ARN, which holds the AWS account id, so it is discarded.
      - name: Configure kubectl
        shell: bash
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws eks --region "$AWS_REGION" update-kubeconfig --name "$EKS_CLUSTER_NAME" --alias "$EKS_CLUSTER_NAME" >/dev/null

      # Read-only: every kubectl call goes through skills/smarter-kubectl/scripts/kubectl.sh.
      - name: Download the pods' logs
        shell: bash
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          skills/smarter-pod-log-review/scripts/download-logs.sh "$EKS_CLUSTER_NAME" "$NAMESPACE" "$LOG_DIR" "$SINCE"

      - name: Remove the cluster credentials
        shell: bash
        run: |
          rm -f "$HOME/.kube/config"
          {
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"

      - name: Redact credentials and personal data
        shell: bash
        run: python3 -E -s scripts/pod_log_redact.py "$LOG_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Claude Code
        shell: bash
        run: |
          # npm's registry occasionally fails a download; try three times.
          for attempt in 1 2 3; do
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 15
          done
          claude --version

      # The PAT is written only here, to a file outside the folders that Claude
      # can read, and reaches only the MCP server. A dry run sends no token, so
      # the MCP server does not even list its tools that write.
      - name: Configure the Smarter Project MCP server
        shell: bash
        env:
          GITHUB_PAT: ${{ secrets.PAT }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/claude"
          if [ "$DRY_RUN" = "true" ]; then
            jq -n --arg url "$MCP_SERVER_URL" \
              '{mcpServers: {"smarter-project": {type: "http", url: $url}}}' > "$RUNNER_TEMP/claude/mcp.json"
          else
            jq -n --arg url "$MCP_SERVER_URL" --arg auth "Bearer $GITHUB_PAT" \
              '{mcpServers: {"smarter-project": {type: "http", url: $url, headers: {Authorization: $auth}}}}' \
              > "$RUNNER_TEMP/claude/mcp.json"
          fi

      # Why not anthropics/claude-code-action? Anthropic's official action is built for
      # interactive use: replying to @claude mentions and reviewing pull requests. It
      # runs this same claude CLI and takes the same flags through its claude_args
      # input, so it would not make the permissions below shorter or stricter. It also
      # hands Claude a GitHub token and its own GitHub tools, and this workflow is
      # built so that Claude holds no token: it reads untrusted logs, so every write
      # to GitHub goes through the Smarter Project MCP server, which refuses
      # credentials, never touches an existing branch or .github/, and closes an issue
      # only when GitHub confirms the fix was merged. Calling the CLI directly keeps
      # that design, and keeps the stream-json output that the Slack step reads.
      #
      # The run's parameters, the credentials Claude may not hold, and when a failed
      # run is retried are in scripts/pod_log_review.py; the
      # permissions are in .github/prompts/pod-log-review.settings.json.
      - name: Review the logs with Claude Code
        id: claude
        shell: bash
        # leaves the job's last 20 minutes for the summary, Slack and the cleanup.
        timeout-minutes: 100
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # no telemetry, error reporting or update checks: the runner allows only the hosts above.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: python3 -E -s scripts/pod_log_review.py run

      # Only Claude's final summary, which follows the same public-writing rules as the issues.
      # The stream, which holds every tool call and result, is never printed.
      - name: Summarize
        if: always()
        shell: bash
        run: python3 -E -s scripts/pod_log_review.py summarize

      # One message per run, listing each issue opened, commented on or closed, and
      # each pull request, taken from the MCP server's results rather than from what
      # Claude says. A run that wrote nothing, finished cleanly and ended with
      # "Verdict: healthy" posts a clean bill of health instead, with its facts taken
      # from the kubectl inventory in the log folder. Any other run that wrote
      # nothing, and a dry run, post nothing. Claude never has the Slack token.
      - name: Tell Slack what changed on GitHub
        if: always() && env.DRY_RUN != 'true'
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s "$RUNNER_TEMP/claude/stream.jsonl" ]; then
            echo "Claude Code wrote no output, so there is nothing to tell Slack."
            exit 0
          fi
          python3 -E -s scripts/pod_log_review_slack.py "$RUNNER_TEMP/claude/stream.jsonl" \
            --channel "$SLACK_CHANNEL" \
            --title "Pod log review of ${PLATFORM_DOMAIN}" \
            --run-url "$RUN_URL" \
            --log-dir "$LOG_DIR" \
            --since "$SINCE"

      - name: Remove the logs and the MCP configuration
        if: always()
        shell: bash
        run: rm -rf "$LOG_DIR" "$RUNNER_TEMP/claude" "$HOME/.kube"
