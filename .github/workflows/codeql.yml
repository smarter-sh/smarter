---
#------------------------------------------------------------------------------
# CodeQL:          code scanning (GitHub's "advanced setup"), so that the
#                  queries can be configured in .github/codeql/codeql-config.yml.
#                  GitHub's default setup can't read a config file, and must be
#                  turned off for this workflow's results to be uploaded.
#
# One job per language, as default setup ran them: GitHub Actions workflows,
# JavaScript/TypeScript and Python. None of them needs a build.
#------------------------------------------------------------------------------
name: CodeQL

on:
  push:
    branches:
      - main
      - alpha
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # The python analysis, the slowest, takes about 3 minutes.
    timeout-minutes: 20
    # security-events: write lets codeql-action/analyze upload its SARIF
    # results to the repository's code scanning alerts; without it the
    # upload fails. actions: read lets CodeQL read this workflow run's
    # details, which the upload needs in a private repository.
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
