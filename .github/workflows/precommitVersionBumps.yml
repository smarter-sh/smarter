---
#------------------------------------------------------------------------------
# Lawrence McDaniel - https://lawrencemcdaniel.com
# Version Bump Workflow for .pre-commit-config.yaml
#
# This workflow runs on a cron schedule and checks for updates to the
# .pre-commit-config.yaml file. If updates are found, the workflow
# commits the changes to the alpha branch and pushes the changes to GitHub.
#
# This is a workaround for the fact that the pre-commit autoupdate command
# is not supported by Dependabot.
#------------------------------------------------------------------------------
name: pre-commit Version Bumps

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

# The push to alpha uses the PAT secret, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  evaluate_precommit_config:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Checkout alpha branch
        run: |
          git config --global url."https://x-access-token:${{ secrets.PAT }}@github.com/".insteadOf "https://github.com/"
          git fetch
          git checkout alpha
          git pull origin alpha

      - name: Cache NPM dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: Cache Python dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('./smarter/requirements/**/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: locate site-packages path
        shell: bash
        run: |
          echo "SITE_PACKAGES_PATH=$(python -c 'import site; print(site.getsitepackages()[0])')" >> $GITHUB_ENV

      - name: Install pip
        shell: bash
        run: |
          python -m pip install --upgrade pip

      - name: Install MariaDB Connector/C
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install dependencies
        shell: bash
        run: |
          pip install -r ./smarter/requirements/local.txt
        env:
          SITE_PACKAGES_PATH: ${{ env.SITE_PACKAGES_PATH }}

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0

      - name: Install npm dependencies
        run: npm install

      - name: Update .pre-commit-config.yaml
        run: |
          pre-commit autoupdate

      - name: Check for unstaged changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain .pre-commit-config.yaml)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .pre-commit-config.yaml
          # No CI skip tag: this commit can become the head of the pull
          # request from alpha to main, whose Tests would then never start.
          git commit -m "chore: [gh] version bumps in .pre-commit-config.yaml"
          git push https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git HEAD:alpha
