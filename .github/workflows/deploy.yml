---
#------------------------------------------------------------------------------
# Deploy to AWS Elastic Kubernetes Service (EKS): the third step of the
# pipeline (see build.yml), after Build succeeds on main.
#
# Build hands over the release's tag as its release-info artifact. A Build run
# that released nothing hands over nothing, and this run then deploys
# nothing. After a deployment, this workflow hands the same tag to
# publish.yml, which starts when this run succeeds.
#
# Started by hand, it deploys the given tag, or the branch's latest tag, to
# the branch's environment: main to prod, alpha, beta and next to their own.
#
# The notify job posts the deployment to the SLACK_CHANNEL Slack channel:
# the environment, the version, the changes since the previous release, the
# image and the chart. The init Job then posts its own log there.
#
# workflow_run always runs this workflow's file from main, the default
# branch, so github.ref is main, and the environment prod.
#
# IMPORTANT: Before running this workflow, ensure that you have first built your
# AWS infrastructure using the [Smarter Infrastructure repository](https://github.com/smarter-sh/smarter-infrastructure).
# Additionally, make sure the following secrets are configured in your
# [GitHub repository settings](https://github.com/smarter-sh/smarter/settings/secrets/actions):
#------------------------------------------------------------------------------
name: Deploy

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "A tag to deploy, e.g. v0.36.26. Empty deploys the branch's latest tag."
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  DEBUG_MODE: "true"
  ENVIRONMENT: "alpha"
  NAMESPACE_BASE: "smarter-ubc"
  PLATFORM_SUBDOMAIN: "ubc"
  ROOT_DOMAIN: "smarter.sh"
  SMARTER_CACHE_EXPIRATION: "60"
  SMARTER_ENABLE_WEB_CONSOLE_TERMINAL: "true"
  VERSION: "latest"
  SLACK_CHANNEL: "smarter"

jobs:
  #----------------------------------------------------------------------------
  # The tag to deploy: Build's release-info, or the one given by hand.
  #----------------------------------------------------------------------------
  # A Build run started by semantic-release's own commit releases nothing.
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      deploy: ${{ steps.tag.outputs.deploy }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Download Build's release-info
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: release-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Choose the tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -s release-info/tag ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(cat release-info/tag)" >> "$GITHUB_OUTPUT"
            echo "Deploying $(cat release-info/tag), from Build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Build released nothing, so there is nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.describe.outputs.environment }}
      version: ${{ steps.describe.outputs.version }}
      chart: ${{ steps.describe.outputs.chart }}
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag || github.ref }}
          fetch-depth: 0 # Ensures all history and tags are fetched
          fetch-tags: true

      - name: Set environment variable
        id: setenv
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DEBUG_MODE=${{ secrets.DEBUG_MODE }}" >> $GITHUB_ENV
          fi
          if [[ "${{ github.ref }}" == "refs/heads/alpha" ]]; then
            echo "ENVIRONMENT=alpha" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/beta" ]]; then
            echo "ENVIRONMENT=beta" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/next" ]]; then
            echo "ENVIRONMENT=next" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "This workflow can only run on alpha, beta, next, or main branches"
            exit 1
          fi

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          eks-cluster-name: ${{ secrets.EKS_CLUSTER_NAME }}
          environment: ${{ env.ENVIRONMENT }}
          namespace-base: ${{ env.NAMESPACE_BASE }}
          authentication-backends: "${{ secrets.AUTHENTICATION_BACKENDS }}"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          brave-search-api-key: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          cohere-api-key: ${{ secrets.COHERE_API_KEY }}
          debug-mode: ${{ env.DEBUG_MODE }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-pat: ${{ secrets.DOCKERHUB_PAT }}
          dockerhub-tag: ${{ env.VERSION }}
          fernet-encryption-key: ${{ secrets.FERNET_ENCRYPTION_KEY }}
          fireworks-api-key: ${{ secrets.FIREWORKS_API_KEY }}
          google-service-account-b64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
          google-maps-api-key: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          extension-registry-public-key: ${{ secrets.SMARTER_EXTENSION_REGISTRY_PUBLIC_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          llama-api-key: ${{ secrets.LLAMA_API_KEY }}
          mailchimp-api-key: ${{ secrets.MAILCHIMP_API_KEY }}
          mailchimp-list-id: ${{ secrets.MAILCHIMP_LIST_ID }}
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          platform-subdomain: ${{ env.PLATFORM_SUBDOMAIN }}
          pinecone-api-key: ${{ secrets.PINECONE_API_KEY }}
          pinecone-environment: ${{ secrets.PINECONE_ENVIRONMENT }}
          root-domain: ${{ env.ROOT_DOMAIN }}
          smarter-branding-address1: ${{ secrets.SMARTER_BRANDING_ADDRESS1 }}
          smarter-branding-address2: ${{ secrets.SMARTER_BRANDING_ADDRESS2 }}
          smarter-branding-city: ${{ secrets.SMARTER_BRANDING_CITY }}
          smarter-branding-state: ${{ secrets.SMARTER_BRANDING_STATE }}
          smarter-branding-postal-code: ${{ secrets.SMARTER_BRANDING_POSTAL_CODE }}
          smarter-branding-country: ${{ secrets.SMARTER_BRANDING_COUNTRY }}
          smarter-branding-currency: ${{ secrets.SMARTER_BRANDING_CURRENCY }}
          smarter-branding-timezone: ${{ secrets.SMARTER_BRANDING_TIMEZONE }}
          smarter-branding-contact-url: ${{ secrets.SMARTER_BRANDING_CONTACT_URL }}
          smarter-branding-corporate-name: ${{ secrets.SMARTER_BRANDING_CORPORATE_NAME }}
          smarter-branding-support-email: ${{ secrets.SMARTER_BRANDING_SUPPORT_EMAIL }}
          smarter-branding-primary-contact: ${{ secrets.SMARTER_BRANDING_PRIMARY_CONTACT }}
          smarter-branding-support-hours: ${{ secrets.SMARTER_BRANDING_SUPPORT_HOURS }}
          smarter-branding-support-phone-number: ${{ secrets.SMARTER_BRANDING_SUPPORT_PHONE_NUMBER }}
          smarter-email-admin: ${{ secrets.SMARTER_EMAIL_ADMIN }}
          smarter-cache-expiration: ${{ env.SMARTER_CACHE_EXPIRATION }}
          smarter-enable-web-console-terminal: ${{ env.SMARTER_ENABLE_WEB_CONSOLE_TERMINAL }}
          smarter-logo: ${{ secrets.SMARTER_LOGO }}
          smarter-mariadb-backup-password: ${{ secrets.SMARTER_MYSQL_BACKUP_PASSWORD }}
          smarter-settings-output: ${{ secrets.SMARTER_SETTINGS_OUTPUT }}
          # The Slack bot runs in prod only: two bots on one Slack app would each
          # receive part of the messages. It needs all three of slack-app-token,
          # slack-bot-agent-url and slack-bot-token, so passing the bot token to
          # every environment doesn't start it elsewhere. Every environment's init
          # Job and nightly backup post their logs to SLACK_CHANNEL with it.
          slack-app-token: ${{ env.ENVIRONMENT == 'prod' && secrets.SLACK_APP_TOKEN || '' }}
          slack-bot-agent-url: ${{ env.ENVIRONMENT == 'prod' && secrets.SLACK_BOT_AGENT_URL || '' }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-notify-channel: ${{ env.SLACK_CHANNEL }}
          social-auth-google-oauth2-key: ${{ secrets.SOCIAL_AUTH_GOOGLE_OAUTH2_KEY }}
          social-auth-google-oauth2-secret: ${{ secrets.SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET }}
          social-auth-github-key: ${{ secrets.SOCIAL_AUTH_GITHUB_KEY }}
          social-auth-github-secret: ${{ secrets.SOCIAL_AUTH_GITHUB_SECRET }}
          social-auth-linkedin-oauth2-key: ${{ secrets.SOCIAL_AUTH_LINKEDIN_OAUTH2_KEY }}
          social-auth-linkedin-oauth2-secret: ${{ secrets.SOCIAL_AUTH_LINKEDIN_OAUTH2_SECRET }}
          tavily-api-key: ${{ secrets.TAVILY_API_KEY }}
          togetherai-api-key: ${{ secrets.TOGETHERAI_API_KEY }}

      # What the notify job tells Slack. It runs even when the deployment
      # failed, so that the failure is reported with its version. The deploy
      # action sets the chart's version (scripts/bump_version.py), so it is
      # read afterwards.
      - name: Describe the deployment
        id: describe
        if: always()
        shell: bash
        run: |
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "chart=$(yq '.version' helm/charts/smarter/Chart.yaml 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Set deployment domain
        id: set-deployment-domain
        shell: bash
        run: |
          if [ "${{ env.ENVIRONMENT }}" = "prod" ]; then
            echo "DEPLOYMENT_DOMAIN=${{ env.PLATFORM_SUBDOMAIN }}.smarter.sh" >> "$GITHUB_ENV"
          else
            echo "DEPLOYMENT_DOMAIN=${{ env.ENVIRONMENT }}.${{ env.PLATFORM_SUBDOMAIN }}.smarter.sh" >> "$GITHUB_ENV"
          fi

      - name: Send Email
        uses: ./.github/actions/send-mail
        with:
          environment: ${{ env.ENVIRONMENT }}
          subdomain: ${{ env.PLATFORM_SUBDOMAIN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          deployment-domain: ${{ env.DEPLOYMENT_DOMAIN }}
          subject: "GHA - Deployed ${{ env.DEPLOYMENT_DOMAIN }} ${{ env.VERSION }}"
          body: "${{ env.DEPLOYMENT_DOMAIN }} version ${{ env.VERSION }} was deployed successfully."
        env:
          VERSION: ${{ env.VERSION }}
          DEPLOYMENT_DOMAIN: ${{ env.DEPLOYMENT_DOMAIN }}

      #------------------------------------------------------------------------
      # Hand the deployed tag to publish.yml, which starts when this run
      # succeeds on main.
      #------------------------------------------------------------------------
      - name: Write the deployed tag
        shell: bash
        run: |
          mkdir -p release-info
          echo "${{ env.VERSION }}" > release-info/tag

      - name: Upload release-info
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info/
          retention-days: 7

  #----------------------------------------------------------------------------
  # Post the deployment to Slack: the environment and its url, the version
  # with its release notes, the changes since the previous release, the
  # commit, the image and the Helm chart. The init Job that the deployment
  # starts posts its own log to the same channel when it finishes (see
  # helm/charts/smarter/templates/job-init.yaml). A Slack outage doesn't fail
  # the deployment, so Publish still follows. scripts/slack_post.py posts the
  # message, with the SLACK_BOT_TOKEN secret; without it, nothing is posted.
  #----------------------------------------------------------------------------
  notify:
    needs: [resolve, deploy]
    if: ${{ !cancelled() && needs.resolve.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.deploy.outputs.version || needs.resolve.outputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Tell Slack
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.deploy.result }}
          DEPLOYED_ENVIRONMENT: ${{ needs.deploy.outputs.environment }}
          VERSION: ${{ needs.deploy.outputs.version || needs.resolve.outputs.tag }}
          CHART: ${{ needs.deploy.outputs.chart }}
        run: |
          if [ "$RESULT" = "success" ]; then
            ICON=":rocket:"; OUTCOME="deployed"
          else
            ICON=":x:"; OUTCOME="failed to deploy"
          fi
          if [ "$DEPLOYED_ENVIRONMENT" = "prod" ]; then
            DOMAIN="${PLATFORM_SUBDOMAIN}.${ROOT_DOMAIN}"
          elif [ -n "$DEPLOYED_ENVIRONMENT" ]; then
            DOMAIN="${DEPLOYED_ENVIRONMENT}.${PLATFORM_SUBDOMAIN}.${ROOT_DOMAIN}"
          fi
          VERSION="${VERSION:-$(git describe --tags --abbrev=0)}"
          PREVIOUS=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          COMMIT=$(git rev-parse --short "${VERSION}^{commit}" 2>/dev/null || true)
          {
            echo "${ICON} *Deploy #${GITHUB_RUN_NUMBER}: ${DOMAIN:-smarter} ${OUTCOME}* · ${GITHUB_ACTOR}"
            [ -n "$DOMAIN" ] && echo "• Environment: \`${DEPLOYED_ENVIRONMENT}\` · <https://${DOMAIN}/|${DOMAIN}>"
            echo "• Version: <${REPO_URL}/releases/tag/${VERSION}|${VERSION}>"
            if [ -n "$PREVIOUS" ]; then
              echo "• Changes since ${PREVIOUS}: <${REPO_URL}/compare/${PREVIOUS}...${VERSION}|${PREVIOUS}...${VERSION}>"
            fi
            [ -n "$COMMIT" ] && echo "• Commit: <${REPO_URL}/commit/${COMMIT}|${COMMIT}>"
            [ -n "$DEPLOYED_ENVIRONMENT" ] && echo "• Image: \`${NAMESPACE_BASE}-${DEPLOYED_ENVIRONMENT}:${VERSION}\` (AWS ECR)"
            [ -n "$CHART" ] && echo "• Helm chart: \`smarter ${CHART}\`"
            [ "$RESULT" = "success" ] && echo "• The init job posts its log here when it finishes."
            echo "<${RUN_URL}|View the run>"
          } | python3 -I scripts/slack_post.py --channel "$SLACK_CHANNEL"
