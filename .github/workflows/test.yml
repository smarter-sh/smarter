---
#------------------------------------------------------------------------------
# Tests:           the Python unit test suite, plus the React apps' Prettier,
#                  ESLint, TypeScript and Vitest unit tests.
#
# The jobs:
#
#   fingerprint    Hashes the files each suite depends on (python: smarter/smarter,
#                  react: smarter/react), and looks for a
#                  record that those exact files already passed. If they
#                  did, that suite is skipped and still reported as passing,
#                  so unchanged code isn't tested twice. See the job.
#   react         Prettier, ESLint, TypeScript and the Vitest unit tests of
#                  smarter/react, as make react-lint and make react-test do.
#                  Uploads its coverage to Codecov (flag: react). A few
#                  minutes, on one runner.
#   python         The Python suite, split into eight shards that run side by
#                  side, one per runner.
#
#                  Why: on one runner the suite took around 45 minutes (5 of
#                  setup, the remainder of tests), which is too slow for
#                  automating CI/CD on every pull request.
#                  GitHub gives public repositories free runners that run in
#                  parallel, so eight runners each take an eighth of the test
#                  suite, reducing the overall time to around 10 minutes.
#
#                  What a shard is: one eighth of the suite's tests, run by
#                  one runner. Together the eight run every test exactly once.
#                  A TestCase is never split, because its setUpClass builds
#                  the fixtures that all its tests share.
#
#                  Shards are proprietary to Smarter:  this job's matrix (shard: 1 to 8)
#                  starts eight copies of the job. Each tells the test runner
#                  its number in SMARTER_TEST_SHARD, e.g. 3/8. The runner,
#                  SmarterTestRunner in smarter/smarter/lib/unittest/runner.py,
#                  discovers the whole suite, deals its TestCases out to eight
#                  shards (largest first, each to the shard with the fewest
#                  tests so far), and runs only shard 3. Every copy deals the
#                  same tests the same way, so the copies agree on the split
#                  without talking to each other. Shards are balanced by test
#                  count, not by time.
#
#                  Runners share nothing: no disk, containers or database. So
#                  each shard builds its own throwaway copy of the platform
#                  (see below), then runs its tests under coverage.py in its
#                  smarter-app container.
#
#   python-report  Waits for the eight shards. Shows their test results in
#                  one job summary, combines their coverage, and uploads it
#                  to Codecov once (flag: python), when every shard passed.
#                  It fails when any shard failed, so it stands for all eight.
#   slack-bot      The unit tests of the Helm chart's Slack bot and of the
#                  workflows' Slack scripts (scripts/tests).
#   notify         Posts the results to Slack: the job summaries' test counts,
#                  coverage and failed tests (scripts/slack_test_report.py).
#
# How a shard builds the platform
#
# It runs the steps of make init one at a time, on a bare GitHub runner:
# make python-init (the venv), the React build, make collectstatic, make
# docker-build (the smarter image), then make docker-init, which starts the
# containers on a new, empty database, migrates it and initializes the
# platform. The runner first gets what make init expects a developer to have
# installed: Python 3.14, Node, MariaDB Connector/C and a docker-compose
# command. make pre-commit-init is skipped: it installs a git hook and
# rewrites .pre-commit-config.yaml, and neither matters to the tests.
#
# The slow steps are cached, so that a shard skips them when nothing they
# depend on has changed:
#
#   venv/                                   Python version + requirements/local.txt
#   node_modules/ (repository root)         Node version + package-lock.json
#   smarter/react node_modules, and the     see .github/actions/react-build,
#     React build                           which build.yml shares
#   the smarter image's layers              BuildKit's GitHub Actions cache
#
# Only shard 1 saves the caches. They are saved with actions/cache/save as
# soon as they are built, because actions/cache would save nothing when a
# test fails.
#
# Secrets
#
# The "Create .env" step writes the repository's and organization's secrets
# into .env, under the names a developer's .env uses. The tests need at
# least OPENAI_API_KEY, GOOGLE_MAPS_API_KEY, SMTP_USERNAME and SMTP_PASSWORD.
# The workflow also uses DOCKERHUB_USERNAME and DOCKERHUB_PAT (image pulls)
# and CODECOV_TOKEN.
#
# AWS credentials, ROOT_DOMAIN and AWS_EKS_CLUSTER_NAME are deliberately NOT
# passed. With them, make docker-init would deploy the example LLMClients to
# real infrastructure: Route53 records under api.local.<ROOT_DOMAIN> and
# ingresses in the smarter-local namespace of the EKS cluster. The tests that
# need AWS are tagged infrastructure, and are skipped.
#------------------------------------------------------------------------------
name: Tests

#------------------------------------------------------------------------------
# The first step of the pipeline (see build.yml): every pull request to main
# runs the tests before it can be merged. python-report and react are main's
# required status checks, so a pull request that fails them can't be merged.
# A new push to the pull request cancels the run in progress.
#
# A pull request whose head commit's message contains a CI skip tag, such as
# [skip ci] anywhere in its body, runs nothing, and its required checks wait
# forever. The automated commits (release.config.js, precommitVersionBumps.yml)
# leave the tag out for that reason. If it happens anyway, close and reopen
# the pull request, or push a new commit to its branch. A workflow_dispatch
# run does not help, whoever or whatever starts it: GitHub leaves it out of a
# pull request's checks, even when it ran on the pull request's head commit.
#
# Pull requests from forks get no secrets, so their LLM tests fail. A
# maintainer runs the tests for them by hand, from a branch in this repository.
#------------------------------------------------------------------------------
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: "local"
  SMTP_SENDER: "no-reply@smarter.sh"
  SMTP_FROM_EMAIL: "no-reply@alpha.ubc.smarter.sh"
  MARKETING_SITE_URL: https://smarter.sh

jobs:
  #----------------------------------------------------------------------------
  # Skip tests that already passed on exactly these files.
  #
  # Fingerprints what each suite depends on, as a hash of the git tree ids of
  # its files, and looks in the Actions cache for a marker saying that a run
  # with that fingerprint passed. react and the python shards are skipped
  # when theirs is found, and python-report and react still report success,
  # so a re-push, rebase or comment-only change that leaves those files as
  # they were passes in a minute instead of re-running everything.
  #
  # The two suites have separate source trees, so each has its own
  # fingerprint, and a change to one tree doesn't rerun the other's tests:
  #
  #   python   smarter/smarter, manage.py, requirements/ and .coveragerc; the
  #            files the Dockerfile copies into data/ (docs/, README.md,
  #            CHANGELOG.md, ...), which the docs app serves and its tests
  #            request, so a docs change runs the Python tests again; and the
  #            few files in smarter/react that the Python tests read:
  #            react/i18n (update_console_messages), the onboarding app's
  #            const.ts (test_onboarding), and each package's package.json
  #            and vite.config.ts, which name the built pages that the
  #            console's templates load.
  #   react    smarter/react, which is self-contained: its tests read nothing
  #            outside it.
  #
  # Both include this workflow.
  #
  # Markers are saved after a pass, by react and by python-report. GitHub
  # scopes caches to a ref: a pull request's run sees the markers of earlier
  # runs of the same pull request and of main, not of its head branch, so the
  # first run of a new pull request always runs everything.
  #----------------------------------------------------------------------------
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-key: ${{ steps.keys.outputs.python }}
      python-passed: ${{ steps.python.outputs.cache-hit }}
      react-key: ${{ steps.keys.outputs.react }}
      react-passed: ${{ steps.react.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # git ls-files -s prints each matching file's mode, blob id and path,
      # and takes glob pathspecs. The hash of that listing changes when, and
      # only when, one of the files is added, removed or changed.
      - name: Fingerprint the tested files
        id: keys
        shell: bash
        run: |
          fingerprint() {
            git ls-files -s -- "$@" | git hash-object --stdin
          }
          PYTHON=$(fingerprint smarter/smarter smarter/manage.py smarter/requirements smarter/.coveragerc \
            smarter/react/i18n smarter/react/packages/smarter-onboarding/src/lib/const.ts \
            'smarter/react/packages/*/package.json' 'smarter/react/packages/*/vite.config.ts' \
            docs README.md changelogs/CHANGELOG.md CODE_OF_CONDUCT.md \
            Dockerfile .dockerignore docker-compose.yml Makefile .env.example package.json \
            .github/workflows/test.yml .github/actions/react-build)
          REACT=$(fingerprint smarter/react .github/workflows/test.yml)
          echo "python=tests-passed-python-$PYTHON" >> "$GITHUB_OUTPUT"
          echo "react=tests-passed-react-$REACT" >> "$GITHUB_OUTPUT"

      - name: Look for a python pass
        id: python
        uses: actions/cache/restore@v5
        with:
          path: .tests-passed
          key: ${{ steps.keys.outputs.python }}
          lookup-only: true

      - name: Look for a react pass
        id: react
        uses: actions/cache/restore@v5
        with:
          path: .tests-passed
          key: ${{ steps.keys.outputs.react }}
          lookup-only: true

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Fingerprints"
            echo "- python: ${{ steps.python.outputs.cache-hit == 'true' && 'passed before, skipped' || 'new, testing' }}"
            echo "- react: ${{ steps.react.outputs.cache-hit == 'true' && 'passed before, skipped' || 'new, testing' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  #----------------------------------------------------------------------------
  # The React apps in smarter/react: formatting (Prettier), lint (ESLint),
  # types (TypeScript) and unit tests (Vitest, with every Storybook story
  # rendered as a test), as `make react-lint && make react-test` do. It needs
  # only Node, so it runs alongside the test job, in a few minutes.
  #
  # The libraries' dist/ (@smarter/common, @smarter/didyouknow,
  # @smarter/onboarding and Smarter Chat) are not committed. The apps
  # type-check against their declarations, and the workbench imports the chat
  # library as an npm package does, so they are built (build:deps) before the
  # type check and the tests. The other tests use the workspace libraries'
  # TypeScript source.
  #
  # Skipped when these files passed before (see fingerprint). GitHub reports
  # a skipped job as a success to a required status check. !cancelled()
  # makes it run, rather than skip, if the fingerprint job itself fails.
  #----------------------------------------------------------------------------
  react:
    needs: fingerprint
    if: ${{ !cancelled() && needs.fingerprint.outputs.react-passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: smarter/react
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smarter/react/package-lock.json

      - name: npm ci
        run: npm ci --include=dev

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (TypeScript)
        run: |
          npm run build:deps
          npm run typecheck

      # The npm package that uiWidgetsRelease.yml publishes. build:deps built it.
      - name: Check @smarter.sh/ui-widgets
        run: npm run check:dist --workspace=@smarter.sh/ui-widgets

      # Naming any reporter replaces Vitest's defaults, so default (the log)
      # and github-actions (annotations and the job summary) are named too.
      # json writes the results that the notify job posts to Slack.
      - name: Unit tests (Vitest), with coverage
        run: npm run coverage -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json=vitest-results.json

      - name: Upload the test results for notify
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-results
          path: |
            smarter/react/vitest-results.json
            smarter/react/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

      #========================================================================
      # Upload coverage/lcov.info under the react flag. Its paths are relative
      # to smarter/react, which codecov.yml maps back to the repository's.
      #========================================================================
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./smarter/react/coverage/lcov.info
          flags: react
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      # Reached only when every step above passed.
      - name: Record the pass
        working-directory: .
        shell: bash
        run: |
          mkdir -p .tests-passed
          echo "${{ github.sha }}" > .tests-passed/commit

      - name: Save the pass
        uses: actions/cache/save@v5
        with:
          path: .tests-passed
          key: ${{ needs.fingerprint.outputs.react-key }}

  #----------------------------------------------------------------------------
  # The optional Slack bot of the Helm chart (helm/charts/slack-bot), and
  # the workflows' Slack scripts (scripts/slack_*.py). Both run outside
  # Django, so their tests need only the standard library, and run in a few
  # seconds.
  #----------------------------------------------------------------------------
  slack-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -v -s helm/charts/slack-bot/tests

      - name: Unit tests of the workflows' Slack scripts
        run: python -m unittest discover -v -s scripts/tests

  #----------------------------------------------------------------------------
  # One shard of the Python suite. SHARDS must match the length of the shard
  # list. fail-fast is off, so that one failing shard doesn't cancel the
  # others: every failure is reported in one run.
  #
  # Only shard 1 saves the caches and exports the Docker layer cache. The
  # shards build the same things, and eight concurrent saves of one key would
  # only race each other.
  #
  # Skipped when these files passed before (see fingerprint).
  #----------------------------------------------------------------------------
  python:
    needs: fingerprint
    if: ${{ !cancelled() && needs.fingerprint.outputs.python-passed != 'true' }}
    name: python (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARDS: 8
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Ensures all history and tags are fetched
          fetch-tags: true

      #------------------------------------------------------------------------
      # Prerequisites for `make init`: python3.14 (check-python, python-init),
      # Node/npm (python-init, react-install, react-build) and the
      # docker-compose v1 command name, which GitHub-hosted runners no longer
      # ship. The shim forwards to the Docker Compose v2 plugin.
      #
      # The exact Python and Node versions are part of the venv and
      # node_modules cache keys: venv/bin/python is a symlink into the
      # runner's tool cache, and native npm modules are built for one Node ABI.
      #------------------------------------------------------------------------
      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Node
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      #------------------------------------------------------------------------
      # The mariadb Python package has no Linux wheels on PyPI, so pip builds it
      # from source, which requires MariaDB Connector/C (mariadb_config).
      # Mirrors the mariadb_connector stage of the Dockerfile. This runs even
      # when the venv is restored from cache, because the compiled package
      # links against libmariadb at runtime.
      #------------------------------------------------------------------------
      - name: Install MariaDB Connector/C
        shell: bash
        env:
          MARIADB_VERSION: "12.2"
        run: |
          curl -LsS -o mariadb_repo_setup https://downloads.mariadb.com/MariaDB/mariadb_repo_setup
          chmod +x mariadb_repo_setup
          sudo ./mariadb_repo_setup --mariadb-server-version="${MARIADB_VERSION}"
          rm -f mariadb_repo_setup
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmariadb-dev libmariadb-dev-compat
          mariadb_config --cc_version

      - name: Install docker-compose shim
        shell: bash
        run: |
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose > /dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      #------------------------------------------------------------------------
      # The Makefile includes .env, and docker compose reads build args and
      # container environment from it. Secrets are appended to the defaults
      # from .env.example. This must run before the first `make` call, which
      # would otherwise copy .env.example to .env itself.
      #
      # Repository and organization secrets are named as in a local .env. The
      # SMARTER_ prefix is optional: get_env() reads <NAME>, then SMARTER_<NAME>.
      # Empty secrets are skipped, so the .env.example value or the default
      # from smarter/common/conf/defaults.py applies.
      #
      # Do not add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ROOT_DOMAIN or
      # AWS_EKS_CLUSTER_NAME here. See the note at the top of this file.
      #
      # FERNET_ENCRYPTION_KEY must be set. Without it, every process
      # (smarter-app, smarter-worker, the test runner, each manage.py call in
      # `make docker-init`) generates its own random key, so a Secret encrypted
      # by one process cannot be decrypted by another:
      # cryptography.fernet.InvalidToken. If the secret is missing, a fresh
      # key per run is fine because the database is created per run.
      #------------------------------------------------------------------------
      - name: Create .env
        shell: bash
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          SMTP_SENDER: ${{ env.SMTP_SENDER }}
          SMTP_FROM_EMAIL: ${{ env.SMTP_FROM_EMAIL }}
          FERNET_ENCRYPTION_KEY: ${{ secrets.FERNET_ENCRYPTION_KEY }}
          AUTHENTICATION_BACKENDS: ${{ secrets.AUTHENTICATION_BACKENDS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # LLM, vector store and Google API keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TOGETHERAI_API_KEY: ${{ secrets.TOGETHERAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          # the workflow's own token, for the GitHub api requests that retrieve the
          # example SkillPlugins' skills. Anonymous requests share the runner's IP
          # rate limit, and fail with 403, which fails `make docker-init`.
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # social auth
          SOCIAL_AUTH_GITHUB_KEY: ${{ secrets.SOCIAL_AUTH_GITHUB_KEY }}
          SOCIAL_AUTH_GITHUB_SECRET: ${{ secrets.SOCIAL_AUTH_GITHUB_SECRET }}
          SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: ${{ secrets.SOCIAL_AUTH_GOOGLE_OAUTH2_KEY }}
          SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET: ${{ secrets.SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET }}
          SOCIAL_AUTH_LINKEDIN_OAUTH2_KEY: ${{ secrets.SOCIAL_AUTH_LINKEDIN_OAUTH2_KEY }}
          SOCIAL_AUTH_LINKEDIN_OAUTH2_SECRET: ${{ secrets.SOCIAL_AUTH_LINKEDIN_OAUTH2_SECRET }}
          # Smarter platform
          SMARTER_EMAIL_ADMIN: ${{ secrets.SMARTER_EMAIL_ADMIN }}
          SMARTER_LOGO: ${{ secrets.SMARTER_LOGO }}
          SMARTER_TEST_DB_PASSWORD: ${{ secrets.SMARTER_TEST_DB_PASSWORD }}
          SMARTER_SETTINGS_OUTPUT: ${{ secrets.SMARTER_SETTINGS_OUTPUT }}
          # branding
          SMARTER_BRANDING_ADDRESS1: ${{ secrets.SMARTER_BRANDING_ADDRESS1 }}
          SMARTER_BRANDING_ADDRESS2: ${{ secrets.SMARTER_BRANDING_ADDRESS2 }}
          SMARTER_BRANDING_CITY: ${{ secrets.SMARTER_BRANDING_CITY }}
          SMARTER_BRANDING_CONTACT_URL: ${{ secrets.SMARTER_BRANDING_CONTACT_URL }}
          SMARTER_BRANDING_CORPORATE_NAME: ${{ secrets.SMARTER_BRANDING_CORPORATE_NAME }}
          SMARTER_BRANDING_COUNTRY: ${{ secrets.SMARTER_BRANDING_COUNTRY }}
          SMARTER_BRANDING_CURRENCY: ${{ secrets.SMARTER_BRANDING_CURRENCY }}
          SMARTER_BRANDING_POSTAL_CODE: ${{ secrets.SMARTER_BRANDING_POSTAL_CODE }}
          SMARTER_BRANDING_PRIMARY_CONTACT: ${{ secrets.SMARTER_BRANDING_PRIMARY_CONTACT }}
          SMARTER_BRANDING_STATE: ${{ secrets.SMARTER_BRANDING_STATE }}
          SMARTER_BRANDING_SUPPORT_EMAIL: ${{ secrets.SMARTER_BRANDING_SUPPORT_EMAIL }}
          SMARTER_BRANDING_SUPPORT_HOURS: ${{ secrets.SMARTER_BRANDING_SUPPORT_HOURS }}
          SMARTER_BRANDING_SUPPORT_PHONE_NUMBER: ${{ secrets.SMARTER_BRANDING_SUPPORT_PHONE_NUMBER }}
          SMARTER_BRANDING_TIMEZONE: ${{ secrets.SMARTER_BRANDING_TIMEZONE }}
          SMARTER_MARKETING_SITE_URL: ${{ env.MARKETING_SITE_URL }}

        run: |
          if [ -z "${FERNET_ENCRYPTION_KEY}" ]; then
            FERNET_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_')"
            echo "::add-mask::${FERNET_ENCRYPTION_KEY}"
          fi
          cp .env.example .env
          {
            echo ""
            echo "# --- added by GitHub Actions test.yml ---"
            for name in \
              ENVIRONMENT SMTP_SENDER SMTP_FROM_EMAIL \
              FERNET_ENCRYPTION_KEY AUTHENTICATION_BACKENDS SMTP_USERNAME SMTP_PASSWORD \
              ANTHROPIC_API_KEY COHERE_API_KEY FIREWORKS_API_KEY GEMINI_API_KEY \
              GOOGLE_AI_STUDIO_KEY GOOGLE_MAPS_API_KEY GOOGLE_SERVICE_ACCOUNT_B64 \
              LLAMA_API_KEY MISTRAL_API_KEY OPENAI_API_KEY TAVILY_API_KEY TOGETHERAI_API_KEY \
              PINECONE_API_KEY PINECONE_ENVIRONMENT MAILCHIMP_API_KEY MAILCHIMP_LIST_ID GITHUB_API_TOKEN \
              SOCIAL_AUTH_GITHUB_KEY SOCIAL_AUTH_GITHUB_SECRET \
              SOCIAL_AUTH_GOOGLE_OAUTH2_KEY SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET \
              SOCIAL_AUTH_LINKEDIN_OAUTH2_KEY SOCIAL_AUTH_LINKEDIN_OAUTH2_SECRET \
              SMARTER_EMAIL_ADMIN SMARTER_LOGO \
              SMARTER_TEST_DB_PASSWORD SMARTER_SETTINGS_OUTPUT \
              SMARTER_BRANDING_ADDRESS1 SMARTER_BRANDING_ADDRESS2 SMARTER_BRANDING_CITY \
              SMARTER_BRANDING_CONTACT_URL SMARTER_BRANDING_CORPORATE_NAME \
              SMARTER_BRANDING_COUNTRY SMARTER_BRANDING_CURRENCY SMARTER_BRANDING_POSTAL_CODE \
              SMARTER_BRANDING_PRIMARY_CONTACT \
              SMARTER_BRANDING_STATE SMARTER_BRANDING_SUPPORT_EMAIL SMARTER_BRANDING_SUPPORT_HOURS \
              SMARTER_BRANDING_SUPPORT_PHONE_NUMBER SMARTER_BRANDING_TIMEZONE SMARTER_MARKETING_SITE_URL
            do
              if [ -n "${!name}" ]; then
                echo "${name}=${!name}"
              fi
            done
          } >> .env

      #------------------------------------------------------------------------
      # Locally, developers run `make init` with the venv activated. Putting
      # venv/bin on the PATH up front has the same effect for the targets that
      # call `python` directly (collectstatic) once the venv exists.
      #------------------------------------------------------------------------
      - name: Add venv to PATH
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

      #========================================================================
      # make python-init
      #
      # The venv is only restored on an exact key match: a venv built from
      # other requirements would keep packages that are no longer pinned.
      # On a miss, python-init deletes and recreates venv/ and installs with
      # PIP_CACHE_DIR=.pypi_cache, which is restored from the closest previous
      # requirements so that only changed packages are downloaded.
      #
      # python-init also runs `npm install` in the repository root
      # (semantic-release, prettier, gulp), so root node_modules is cached too.
      #========================================================================
      - name: Restore Python venv
        id: venv
        uses: actions/cache/restore@v5
        with:
          path: venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('smarter/requirements/local.txt') }}

      - name: Restore pip downloads
        id: pypi
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: .pypi_cache
          key: pypi-${{ runner.os }}-py3.14-${{ hashFiles('smarter/requirements/local.txt') }}
          restore-keys: |
            pypi-${{ runner.os }}-py3.14-

      - name: Restore root node_modules
        id: root-node-modules
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: root-node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            root-node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-

      - name: make python-init
        if: steps.venv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          make python-init

      - name: npm install (python-init, venv restored from cache)
        if: steps.venv.outputs.cache-hit == 'true' && steps.root-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          npm install

      - name: Save Python venv
        if: matrix.shard == 1 && steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: venv
          key: ${{ steps.venv.outputs.cache-primary-key }}

      - name: Save pip downloads
        if: matrix.shard == 1 && steps.venv.outputs.cache-hit != 'true' && steps.pypi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .pypi_cache
          key: ${{ steps.pypi.outputs.cache-primary-key }}

      - name: Save root node_modules
        if: matrix.shard == 1 && steps.root-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: ${{ steps.root-node-modules.outputs.cache-primary-key }}

      #========================================================================
      # make react-install, then the npm build step of make react-build
      #
      # Shared with build.yml, so that both use the same cache entries. See
      # .github/actions/react-build/action.yml.
      #========================================================================
      - name: Build React components
        uses: ./.github/actions/react-build

      #========================================================================
      # make collectstatic
      #
      # Fast, and its output depends on both the Python packages and the
      # React build, so it always runs.
      #========================================================================
      - name: make collectstatic
        shell: bash
        run: |
          make collectstatic

      #========================================================================
      # make docker-build
      #
      # - setup-buildx-action makes a BuildKit builder the default, which
      #   Compose uses for its builds.
      # - ghaction-github-runtime exposes the ACTIONS_* runtime variables that
      #   BuildKit needs for the GitHub Actions cache backend. build-push-action
      #   does this implicitly; Compose does not.
      # - A generated override file adds cache_from/cache_to to the four
      #   services that build the smarter image, and COMPOSE_FILE layers it on
      #   top of docker-compose.yml so the Makefile runs unchanged. All four
      #   build the identical image, so only smarter-app exports the cache,
      #   and only in shard 1. smarter-app comes last in the file, so that
      #   its cache_to can be appended.
      # - The override also sets PYTHON_BASE_IMAGE to Docker Hub's python
      #   image. The Dockerfile's default pulls it from the ECR Public Gallery,
      #   whose anonymous data quota GitHub's shared runner IPs exhaust
      #   (429 "toomanyrequests: Data limit exceeded"). This workflow has no
      #   AWS credentials to authenticate that pull, but it is logged in to
      #   Docker Hub.
      #
      # BuildKit exports the cache during the build itself, so it is saved
      # even if a later step fails.
      #========================================================================
      # docker-init pulls mariadb and redis from Docker Hub, and Buildx pulls
      # its BuildKit image (moby/buildkit) from there too, so log in first.
      # Anonymous pulls share the runner's IP-based rate limit and fail with
      # 429 Too Many Requests. BuildKit used to come from the ECR Public
      # Gallery, but anonymous ECR Public pulls have a monthly data quota per
      # source IP that GitHub's shared runner IPs exhaust ("toomanyrequests:
      # Data limit exceeded"), and this workflow has no AWS credentials to
      # authenticate them. See the note at the top of this file.
      - name: Login to Docker Hub
        id: login-dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub runtime for BuildKit cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Enable Docker layer cache for docker-compose
        shell: bash
        run: |
          OVERRIDE="$RUNNER_TEMP/docker-compose.cache.yml"
          cat > "$OVERRIDE" <<'EOF'
          services:
            smarter-worker:
              build:
                args:
                  PYTHON_BASE_IMAGE: docker.io/library/python:3.14-slim-trixie
                cache_from:
                  - type=gha,scope=smarter-test
            smarter-worker-infrastructure:
              build:
                args:
                  PYTHON_BASE_IMAGE: docker.io/library/python:3.14-slim-trixie
                cache_from:
                  - type=gha,scope=smarter-test
            smarter-beat:
              build:
                args:
                  PYTHON_BASE_IMAGE: docker.io/library/python:3.14-slim-trixie
                cache_from:
                  - type=gha,scope=smarter-test
            smarter-app:
              build:
                args:
                  PYTHON_BASE_IMAGE: docker.io/library/python:3.14-slim-trixie
                cache_from:
                  - type=gha,scope=smarter-test
          EOF
          if [ "${{ matrix.shard }}" = "1" ]; then
            cat >> "$OVERRIDE" <<'EOF'
                cache_to:
                  - type=gha,scope=smarter-test,mode=max
          EOF
          fi
          cat "$OVERRIDE"
          echo "COMPOSE_FILE=$GITHUB_WORKSPACE/docker-compose.yml:$OVERRIDE" >> $GITHUB_ENV

      - name: make docker-build
        shell: bash
        run: |
          make docker-build

      #========================================================================
      # Pull the MariaDB and Redis images, with retries
      #
      # Docker Hub sometimes answers a pull with a transient 5xx (e.g.
      # "received unexpected HTTP status: 502 Bad Gateway"), which would fail
      # `docker-compose up` inside make docker-init. Pulling here, with
      # backoff, means docker-init finds the images locally and skips the pull.
      #========================================================================
      - name: Pull service images
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            docker-compose pull smarter-mariadb smarter-redis && exit 0
            echo "Pull failed (attempt $attempt of 5), retrying in $((attempt * 15))s ..."
            sleep $((attempt * 15))
          done
          echo "Could not pull the service images from Docker Hub."
          exit 1

      #========================================================================
      # make docker-init
      #
      # Starts the containers, creates the database, migrates, and initializes
      # the platform and example resources. Not cacheable: it populates a
      # fresh database for this run.
      #========================================================================
      - name: make docker-init
        shell: bash
        run: |
          make docker-init

      #========================================================================
      # Run this shard of the unit tests with coverage
      #
      # Runs this shard's share of the tests that `make docker-test` runs,
      # under coverage.py. Coverage is measured for all of smarter, the same
      # suite that the tests cover, rather than just smarter.apps as
      # `make coverage` does. .coveragerc is excluded by .dockerignore, so the
      # options are passed on the command line. coverage run exits with the
      # test runner's exit code, so a failing test still fails this step.
      #
      # SMARTER_TEST_SHARD picks the shard, and SMARTER_TEST_JUNIT_XML makes
      # the test runner also write the results as a JUnit XML report (see
      # smarter/smarter/lib/unittest/runner.py).
      #========================================================================
      - name: Run unit tests with coverage
        shell: bash
        run: |
          docker exec \
            -e SMARTER_TEST_SHARD=${{ matrix.shard }}/${{ env.SHARDS }} \
            -e SMARTER_TEST_JUNIT_XML=test-results.xml \
            smarter-app bash -c "coverage run --source=smarter manage.py test smarter"

      #========================================================================
      # Hand the shard's coverage data and test results to python-report.
      #
      # Both are copied even when a test fails, which is when the results
      # matter most. The test report is written as the tests run, so it exists
      # whenever the shard ran to the end. The coverage data file's paths are
      # container paths, /home/smarter_user/smarter/smarter/..., which
      # python-report maps back to the repository's.
      #========================================================================
      - name: Copy coverage data and test results from the container
        if: always()
        shell: bash
        run: |
          mkdir -p shard
          docker cp smarter-app:/home/smarter_user/smarter/.coverage shard/coverage-shard-${{ matrix.shard }} || echo "No coverage data was written."
          docker cp smarter-app:/home/smarter_user/smarter/test-results.xml shard/test-results-shard-${{ matrix.shard }}.xml || echo "No test results were written."

      - name: Upload coverage data and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-shard-${{ matrix.shard }}
          path: shard/
          if-no-files-found: warn
          retention-days: 7

      - name: Dump container logs
        if: failure()
        shell: bash
        run: |
          docker compose logs --no-color --tail=500

      - name: Tear down
        if: always()
        shell: bash
        run: |
          docker compose down -v

  #----------------------------------------------------------------------------
  # Merge the shards' results into one report.
  #
  # - Test summary: every shard's JUnit XML report, rendered together in the
  #   job summary, like the react job's Vitest report. It runs even when a
  #   shard fails, which is when it matters most.
  # - Coverage: the shards' coverage data files are combined, with their
  #   container paths mapped back to the repository's checkout, and reported
  #   against it. The coverage version matches requirements/local.txt, which
  #   the container uses. Only the total goes in the job summary. The
  #   per-file report (some 2,000 lines) stays in this job's log, and in
  #   Codecov, which receives one combined report under the python flag.
  #   Coverage is only reported when every shard passed, as before sharding:
  #   a failed shard's data would understate it.
  # - It fails when any shard failed, so that it can stand for all of them as
  #   a required status check.
  # - When every shard passed, it saves the pass marker (see fingerprint).
  #   When the shards were skipped because these files passed before, it
  #   says so, and passes.
  #----------------------------------------------------------------------------
  python-report:
    needs: [fingerprint, python]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Passed before
        if: needs.fingerprint.outputs.python-passed == 'true'
        shell: bash
        run: |
          echo "These files passed the Python tests in an earlier run, so the shards were skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        if: needs.python.result != 'skipped'
        uses: actions/checkout@v6

      - name: Download the shards' results
        if: needs.python.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: python-shard-*
          path: shards

      - name: Test summary
        if: needs.python.result != 'skipped'
        uses: test-summary/action@v2
        with:
          paths: "shards/**/test-results-shard-*.xml"
          show: "fail, skip"

      - name: Set up Python
        if: needs.python.result == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Combine coverage
        if: needs.python.result == 'success'
        shell: bash
        run: |
          pip install "$(grep -E '^coverage==' smarter/requirements/local.txt)"
          cat > "$RUNNER_TEMP/coveragerc" <<'EOF'
          [run]
          relative_files = True

          [paths]
          source =
              smarter/
              /home/smarter_user/smarter/
          EOF
          coverage combine --rcfile="$RUNNER_TEMP/coveragerc" shards/*/coverage-shard-*
          coverage report --rcfile="$RUNNER_TEMP/coveragerc"
          coverage xml --rcfile="$RUNNER_TEMP/coveragerc" -o coverage.xml
          coverage json --rcfile="$RUNNER_TEMP/coveragerc" -o coverage.json

      - name: Coverage summary
        if: needs.python.result == 'success'
        shell: bash
        run: |
          jq -r '
            .totals as $t |
            "## Python coverage\n",
            "| Statements | Missed | Coverage |",
            "| ---: | ---: | ---: |",
            "| \($t.num_statements) | \($t.missing_lines) | **\($t.percent_covered_display)%** |"
          ' coverage.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage total for notify
        if: needs.python.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.json
          retention-days: 7

      - name: Upload coverage to Codecov
        if: needs.python.result == 'success'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Record the pass
        if: needs.python.result == 'success'
        shell: bash
        run: |
          mkdir -p .tests-passed
          echo "${{ github.sha }}" > .tests-passed/commit

      - name: Save the pass
        if: needs.python.result == 'success'
        uses: actions/cache/save@v5
        with:
          path: .tests-passed
          key: ${{ needs.fingerprint.outputs.python-key }}

      # This job, with react, is the required status check of main: one check
      # for all eight shards, whose names would otherwise all be required.
      # A skip counts as a pass only when the fingerprint job found one: if
      # the fingerprint job failed, python-passed is empty, and this fails.
      - name: Fail when a shard failed
        if: needs.python.result != 'success' && needs.fingerprint.outputs.python-passed != 'true'
        shell: bash
        run: |
          echo "::error::A shard of the Python tests did not pass: ${{ needs.python.result }}."
          exit 1

  #----------------------------------------------------------------------------
  # Post the run's results to Slack: what the job summaries show (the React
  # and Python test counts, coverage, and the tests that failed), which the
  # GitHub app for Slack leaves out. scripts/slack_test_report.py writes the
  # message, and scripts/slack_post.py posts it. A Slack outage doesn't fail
  # the run.
  #
  # Runs after every run that wasn't cancelled. A cancelled run, e.g. one
  # replaced by a newer push, posts nothing. Without the SLACK_BOT_TOKEN
  # secret (e.g. a pull request from a fork) it posts nothing, and passes.
  # The bot must be in the channel, with the chat:write scope.
  #
  # The pull request's title is passed through env, never put into the
  # script by ${{ }}, because anyone who opens a pull request writes it.
  #----------------------------------------------------------------------------
  notify:
    needs: [fingerprint, react, slack-bot, python-report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download the test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: results

      - name: Tell Slack the results
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: smarter
          TITLE: "Tests #${{ github.run_number }}"
          REF: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REACT_RESULT: ${{ needs.react.result }}
          REACT_PASSED_BEFORE: ${{ needs.fingerprint.outputs.react-passed }}
          PYTHON_RESULT: ${{ needs.python-report.result }}
          PYTHON_PASSED_BEFORE: ${{ needs.fingerprint.outputs.python-passed }}
          SLACK_BOT_RESULT: ${{ needs.slack-bot.result }}
        run: |
          args=()
          [ "$REACT_PASSED_BEFORE" = "true" ] && args+=(--react-passed-before)
          [ "$PYTHON_PASSED_BEFORE" = "true" ] && args+=(--python-passed-before)
          python3 -I scripts/slack_test_report.py \
            --title "$TITLE" \
            --repo "$REPO" \
            --ref "$REF" \
            --actor "$ACTOR" \
            --pr-title "$PR_TITLE" \
            --pr-url "$PR_URL" \
            --run-url "$RUN_URL" \
            --react-result "$REACT_RESULT" \
            --react-results results/react-results/vitest-results.json \
            --react-coverage results/react-results/coverage/coverage-summary.json \
            --python-result "$PYTHON_RESULT" \
            --python-results results \
            --python-coverage results/python-coverage/coverage.json \
            --slack-bot-result "$SLACK_BOT_RESULT" \
            "${args[@]}" \
            | python3 -I scripts/slack_post.py --channel "$SLACK_CHANNEL"
