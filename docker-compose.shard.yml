---
#------------------------------------------------------------------------------
# One shard of the Python test suite, for make docker-test (scripts/run_test_shards.py).
#
# The tests share their database, Redis, dev server and Celery workers, without
# rollback, so two shards can't run in one stack: each gets a stack of its own,
# as each of CI's shards gets a runner. scripts/run_test_shards.py starts one
# Compose project per shard (smarter-shard-<n>) from this file, loads a copy of
# the local database into it, and runs SMARTER_TEST_SHARD=<n>/<shards> in its api.
#
# It differs from docker-compose.yml in what would collide between stacks: no
# container names, no host ports, and no bind-mounted database. The services keep
# docker-compose.yml's names, which are the hostnames that settings/base.py uses,
# so each stack's api and workers reach its own MariaDB and Redis on the project's
# own network. There is no Celery Beat: its scheduled tasks would change the rows
# of running tests. The image is the one make build builds.
#------------------------------------------------------------------------------
services:
  smarter-mariadb:
    mem_limit: 2g
    cpus: 0.5
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: smarter
      MYSQL_DATABASE: smarter
      MYSQL_USER: smarter
      MYSQL_PASSWORD: smarter
    # in memory: a shard's database lives only as long as its run.
    tmpfs:
      - /var/lib/mysql:size=1g

  smarter-redis:
    cpus: 0.25
    mem_limit: 1g
    image: redis:latest
    # the tool worker's ACL user, tools, with the Helm chart's rules (redis.auth.acl.users in values.yaml).
    # A list, not a string: compose splits a string command like a shell, and stops at the > of the password.
    command:
      [
        "redis-server",
        "--requirepass",
        "smarter",
        "--user",
        "tools",
        "on",
        ">smarter-tools",
        "~tools_celery_task_queue*",
        "~celery-task-meta-*",
        "%R~django*:1:smarter:extension:archive:*",
        "~django*:1:smarter.apps.llmtool.plugin.websearch_fetch.robots_rules.*",
        "%W~stream:logs:*",
        "&logs:*",
        "&celery-task-meta-*",
        "+@all",
        "-@dangerous",
        "-@admin",
        "-scan",
        "-randomkey",
        "-pubsub",
        "-subscribe",
        "-psubscribe",
        "-ssubscribe",
      ]

  smarter-api:
    mem_limit: 4g
    cpus: 1
    user: smarter_user
    image: smarter
    command: watchmedo auto-restart --directory=./smarter --pattern=*.py --recursive -- uvicorn smarter.asgi:application --host 0.0.0.0 --port 9357 --lifespan off
    depends_on:
      - smarter-mariadb
      - smarter-redis
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=app
      - SMARTER_SUBSYSTEM_SQL_ROOT_PASSWORD=smarter

  smarter-worker:
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=4 --loglevel=info -Q default_celery_task_queue -E
    depends_on:
      - smarter-mariadb
      - smarter-redis
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker

  # the tool worker (ADR-038), without a database, for the tests that send a tool call through
  # Celery to it (smarter.apps.llmtool.runner.tests.test_remote). One process: a shard's tests send
  # their calls one at a time, and each prefork process costs about 0.4 GiB (with 4, it used 1.04 GiB,
  # and 11 shards ran Docker's VM out of memory).
  smarter-worker-tools:
    mem_limit: 1g
    cpus: 0.5
    user: smarter_user
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=1 --loglevel=info -Q tools_celery_task_queue -n tools@%h --without-mingle --without-gossip --without-heartbeat
    depends_on:
      - smarter-redis
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker
      - SMARTER_DATABASE_UNAVAILABLE=true
      # its own Redis user, which may touch only its own keys (ADR-030, rule 8).
      - SMARTER_SUBSYSTEM_REDIS_USERNAME=tools
      - SMARTER_SUBSYSTEM_REDIS_PASSWORD=smarter-tools

  smarter-worker-infrastructure:
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=4 --loglevel=info -Q infrastructure_celery_task_queue -E -n infrastructure@%h
    depends_on:
      - smarter-mariadb
      - smarter-redis
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker
