---
#------------------------------------------------------------------------------
# One shard of the Python test suite, for make docker-test (scripts/run_test_shards.py).
#
# The tests share their database, Redis, dev server and Celery workers, without
# rollback, so two shards can't run in one stack: each gets a stack of its own,
# as each of CI's shards gets a runner. scripts/run_test_shards.py starts one
# Compose project per shard (smarter-shard-<n>) from this file, loads a copy of
# the local database into it, and runs SMARTER_TEST_SHARD=<n>/<shards> in its api.
#
# It differs from docker-compose.yml in what would collide between stacks: no
# container names, no host ports, and no bind-mounted database. The services keep
# docker-compose.yml's names, which are the hostnames that settings/base.py uses,
# so each stack's api and workers reach its own MariaDB and Redis on the project's
# own network. There is no Celery Beat: its scheduled tasks would change the rows
# of running tests. The image is the one make build builds.
#------------------------------------------------------------------------------

# The tool worker's and the Extension worker's environment, as docker-compose.yml's: the non-secret settings that
# the Helm chart's smarter.toolWorkerEnv gives them, never .env's credentials.
x-restricted-worker-environment: &restricted-worker-environment
  PYTHONUNBUFFERED: "1"
  SMARTER_DATABASE_UNAVAILABLE: "true"
  SMARTER_APP_LLMTOOL_PLUGIN_MAX_DATA_RESULTS: ${SMARTER_APP_LLMTOOL_PLUGIN_MAX_DATA_RESULTS:-50}
  SMARTER_APP_EXTENSIONS_TASKS_CELERY_TASK_QUEUE: ${SMARTER_APP_EXTENSIONS_TASKS_CELERY_TASK_QUEUE:-extensions_celery_task_queue}
  SMARTER_APP_TOOLS_TASKS_CELERY_TASK_QUEUE: ${SMARTER_APP_TOOLS_TASKS_CELERY_TASK_QUEUE:-tools_celery_task_queue}
  SMARTER_DEBUG_MODE: ${SMARTER_DEBUG_MODE:-false}
  SMARTER_ENVIRONMENT: ${SMARTER_ENVIRONMENT:-local}
  SMARTER_LOG_LEVEL: ${SMARTER_LOG_LEVEL:-INFO}
  SMARTER_PLATFORM_CLOUD_PROVIDER: ${SMARTER_PLATFORM_CLOUD_PROVIDER:-aws}
  SMARTER_PLATFORM_INTERNAL_IP_PREFIXES: ${SMARTER_PLATFORM_INTERNAL_IP_PREFIXES:-192.168.}
  SMARTER_PLATFORM_ROOT_DOMAIN: ${SMARTER_PLATFORM_ROOT_DOMAIN:-example.com}
  SMARTER_PLATFORM_SHARED_RESOURCE_IDENTIFIER: ${SMARTER_PLATFORM_SHARED_RESOURCE_IDENTIFIER:-smarter}
  SMARTER_PLATFORM_SUBDOMAIN: ${SMARTER_PLATFORM_SUBDOMAIN:-platform}

services:
  smarter-mariadb:
    mem_limit: 2g
    cpus: 0.5
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: smarter
      MYSQL_DATABASE: smarter
      MYSQL_USER: smarter
      MYSQL_PASSWORD: smarter
    # in memory: a shard's database lives only as long as its run.
    tmpfs:
      - /var/lib/mysql:size=1g

  smarter-redis:
    cpus: 0.25
    mem_limit: 1g
    image: redis:latest
    # the ACL users of the tool worker, tools, and of the Extension worker, extensions, with the Helm chart's
    # rules (redis.master.preExecCmds in values.yaml).
    # A list, not a string: compose splits a string command like a shell, and stops at the > of the password.
    command:
      [
        "redis-server",
        "--requirepass",
        "smarter",
        "--user",
        "tools",
        "on",
        ">smarter-tools",
        "~tools_celery_task_queue*",
        "~celery-task-meta-*",
        "%R~django*:1:smarter:extension:archive:*",
        "~tools_cache:*",
        "%W~stream:logs:*",
        "&logs:*",
        "&celery-task-meta-*",
        "+@all",
        "-@dangerous",
        "-@admin",
        "-scan",
        "-randomkey",
        "-pubsub",
        "-subscribe",
        "-psubscribe",
        "-ssubscribe",
        "--user",
        "extensions",
        "on",
        ">smarter-extensions",
        "~extensions_celery_task_queue*",
        "~celery-task-meta-*",
        "%R~django*:1:smarter:extension:archive:*",
        "~extensions_cache:*",
        "%W~stream:logs:*",
        "&logs:*",
        "&celery-task-meta-*",
        "+@all",
        "-@dangerous",
        "-@admin",
        "-scan",
        "-randomkey",
        "-pubsub",
        "-subscribe",
        "-psubscribe",
        "-ssubscribe",
      ]

  smarter-api:
    mem_limit: 4g
    cpus: 1
    user: smarter_user
    image: smarter
    command: watchmedo auto-restart --directory=./smarter --pattern=*.py --recursive -- uvicorn smarter.asgi:application --host 0.0.0.0 --port 9357 --lifespan off
    depends_on:
      - smarter-mariadb
      - smarter-redis
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=api
      - SMARTER_SUBSYSTEM_SQL_ROOT_PASSWORD=smarter

  smarter-worker:
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=4 --loglevel=info -Q default_celery_task_queue -E
    depends_on:
      - smarter-mariadb
      - smarter-redis
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker

  # the tool worker (ADR-038), without a database, for the tests that send a tool call through
  # Celery to it (smarter.apps.llmtool.runner.tests.test_remote). One process: a shard's tests send
  # their calls one at a time, and each prefork process costs about 0.4 GiB (with 4, it used 1.04 GiB,
  # and 11 shards ran Docker's VM out of memory).
  smarter-worker-tools:
    mem_limit: 1g
    cpus: 0.5
    user: smarter_user
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=1 --loglevel=info -Q tools_celery_task_queue -n tools@%h --without-mingle --without-gossip --without-heartbeat
    depends_on:
      - smarter-redis
    # no env_file: only the settings that it needs, never .env's credentials.
    environment:
      <<: *restricted-worker-environment
      SERVICE_TYPE: worker-tools
      # its own Redis user, which may touch only its own keys (ADR-030, rule 8).
      SMARTER_SUBSYSTEM_REDIS_USERNAME: tools
      SMARTER_SUBSYSTEM_REDIS_PASSWORD: smarter-tools
      # @cache_results' own cache (cache-results reads it), as the Helm chart's smarter.toolWorkerEnv sets it:
      # the cache's database, as the same user, under the keys that its ACL rule ~tools_cache:* allows.
      CACHE_RESULTS_CACHE: '{"BACKEND": "django_redis.cache.RedisCache", "LOCATION": "redis://tools:smarter-tools@smarter-redis:6379/1", "KEY_PREFIX": "tools_cache", "OPTIONS": {"SOCKET_CONNECT_TIMEOUT": 2, "SOCKET_TIMEOUT": 5}}'

  # the Extension worker (issue #1077): it runs Extensions' tool calls, which the app sends to its own queue,
  # each in a process of its own (--max-tasks-per-child=1), as the Redis user extensions, which can't read
  # the tool worker's queue. Otherwise it is the tool worker: no database, the same image.
  smarter-worker-extensions:
    mem_limit: 1g
    cpus: 0.5
    user: smarter_user
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=1 --loglevel=info -Q extensions_celery_task_queue -n extensions@%h --max-tasks-per-child=1 --without-mingle --without-gossip --without-heartbeat
    depends_on:
      - smarter-redis
    # no env_file: only the settings that it needs, never .env's credentials.
    environment:
      <<: *restricted-worker-environment
      SERVICE_TYPE: worker-extensions
      # its own Redis user, which may touch only its own keys (ADR-030, rule 8).
      SMARTER_SUBSYSTEM_REDIS_USERNAME: extensions
      SMARTER_SUBSYSTEM_REDIS_PASSWORD: smarter-extensions
      # @cache_results' own cache, as for the tool worker, under the keys that ~extensions_cache:* allows.
      CACHE_RESULTS_CACHE: '{"BACKEND": "django_redis.cache.RedisCache", "LOCATION": "redis://extensions:smarter-extensions@smarter-redis:6379/1", "KEY_PREFIX": "extensions_cache", "OPTIONS": {"SOCKET_CONNECT_TIMEOUT": 2, "SOCKET_TIMEOUT": 5}}'
      SMARTER_APP_TOOLS_WORKER_QUEUE: extensions_celery_task_queue

  smarter-worker-infrastructure:
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    image: smarter
    command: celery -A smarter.workers.celery.app worker --concurrency=4 --loglevel=info -Q infrastructure_celery_task_queue -E -n infrastructure@%h
    depends_on:
      - smarter-mariadb
      - smarter-redis
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_TYPE=worker-infrastructure
